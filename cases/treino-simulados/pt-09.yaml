      sendo sincero, foi o pessoal mais caprichoso, que cuida da entrega, que já embala
      tudo direitinho; isso a gente não tem como marcar na base, é de conhecer os caras.
      Agora o marketing quer colocar no release que a bag reduziu em X% as reclamações de
      comida fria e me pediram o número. Tenho a base por entregador: entregas de julho, se
      é moto ou bike, zona em que mais roda, reclamações de temperatura em setembro por 100
      entregas e nota média do cliente em setembro. A nota subiu bonito pra quem tá com a
      bag, acho que o cliente vê a bag com a marca e já dá 5 estrelas, e comida fria
      obviamente derruba a nota. Bike e CIC sempre tiveram mais reclamação (a distância
      pesa), e o pessoal que roda mais tem menos, isso é histórico. Consegue me dizer o
      efeito da bag nas reclamações? Vale colocar a nota na conta? Valeu!
    edges:
      - entregas_jul -> bag_oficial
      - entregas_jul -> reclamacoes_temp_set
      - modal -> bag_oficial
      - modal -> reclamacoes_temp_set
      - zona -> bag_oficial
      - zona -> reclamacoes_temp_set
      - capricho -> bag_oficial
      - capricho -> reclamacoes_temp_set
      - bag_oficial -> reclamacoes_temp_set
      - bag_oficial -> nota_media_set
      - reclamacoes_temp_set -> nota_media_set
    answer:
      identifiable: false
      missing: [capricho]
    note: >-
      Gêmeo do sorteio com um fato trocado: quem quis foi buscar. Volume, modal e zona
      estão na tabela e parecem resolver; o capricho do entregador não está.

  - id: pt_museu_audioguia
    author: ai
    status: rascunho
    language: pt
    style: e-mail para o chefe
    persona: diretora de um museu histórico municipal em uma cidade de 80 mil habitantes; historiadora, sem formação em dados
    theme: Cultura (museu, audioguia)
    title: Audioguia e tempo de permanência no museu
    treatment: audioguia
    outcome: tempo_permanencia_min
    columns:
      audioguia: Visitante retirou o audioguia gratuito na recepção (1 = sim, 0 = não).
      tempo_permanencia_min: Minutos entre a leitura do ingresso na catraca de entrada e na de saída.
      origem: Origem do visitante declarada no ingresso (cidade, região, outro estado ou exterior).
      faixa_etaria: Faixa etária declarada no ingresso (18 a 39, 40 a 59, 60 ou mais).
      fim_de_semana: Visita em sábado, domingo ou feriado (1 = sim, 0 = não).
      exposicao_temporaria: Havia exposição temporária em cartaz na data da visita (1 = sim, 0 = não).
      visitou_anexo: Passou pela catraca do anexo (prédio da antiga cadeia pública) durante a visita (1 = sim, 0 = não).
      num_ingresso: Número sequencial do ingresso.
    story: >-
      Secretário, boa tarde.

      Conforme o senhor pediu depois da sessão da Câmara, segue o que temos sobre o
      audioguia, para o senhor responder ao vereador Ademir.

      Os 20 aparelhos foram comprados em dezembro com recurso da Lei Paulo Gustavo (R$ 38
      mil, incluindo a gravação). O visitante pega na recepção se quiser, sem custo, e
      devolve na saída. Pela catraca, que lê o ingresso na entrada e na saída, temos o
      tempo que cada visitante ficou dentro do museu, de janeiro a junho: 9.800 visitantes
      adultos. Quem mais pega o aparelho é o visitante de fora, principalmente de outros
      estados, e o público com mais idade; o visitante de fora também fica mais tempo,
      porque veio para isso, e o pessoal mais velho igualmente demora mais nas salas. O
      roteiro do audioguia termina no anexo da antiga cadeia, e quem vai até o anexo soma
      uns 15 minutos de visita só pelo deslocamento. Em abril e maio tivemos a exposição
      temporária do acervo Kaingang no salão principal, que prendeu o visitante bem mais
      tempo. Nos fins de semana e feriados as pessoas também ficam mais, vêm sem pressa.

      A pergunta do vereador, se entendi, é se o audioguia faz o visitante ficar mais
      tempo no museu, e se isso justificou os R$ 38 mil. A planilha por visitante está no
      Drive da Secretaria (pasta Museu, subpasta Audioguia), com o dicionário das colunas
      na primeira aba. Se o senhor achar melhor, posso pedir uma análise ao pessoal da
      universidade, mas gostaria de levar algo já na reunião de terça.

      Atenciosamente,
      Lúcia Mendes
      Diretora, Museu Histórico Municipal
    edges:
      - origem -> audioguia
      - origem -> tempo_permanencia_min
      - faixa_etaria -> audioguia
      - faixa_etaria -> tempo_permanencia_min
      - fim_de_semana -> tempo_permanencia_min
      - exposicao_temporaria -> tempo_permanencia_min
      - audioguia -> visitou_anexo
      - visitou_anexo -> tempo_permanencia_min
      - audioguia -> tempo_permanencia_min
    answer:
      identifiable: true
      adjust_for: [faixa_etaria, origem]
      do_not_adjust_for:
        visitou_anexo: O roteiro do audioguia leva ao anexo, e ir ao anexo soma minutos; é parte do efeito que se quer medir.
      indifferent: [exposicao_temporaria, fim_de_semana, num_ingresso]
    note: >-
      O anexo é consequência do audioguia; que a passagem pela catraca acontece durante a
      visita está só no dicionário. Exposição e fim de semana só mexem no tempo.

  - id: pt_callcenter_curso_lideranca
    author: ai
    status: rascunho
    language: pt
    style: pergunta em um fórum de analytics
    persona: gerente de RH de um call center com cerca de 1.200 operadores no Rio de Janeiro; formação em psicologia, sem estatística
    theme: RH (call center, treinamento de supervisores)
    title: Curso de liderança dos supervisores e absenteísmo da equipe
    treatment: supervisor_treinado
    outcome: absenteismo_abr_jun
    columns:
      supervisor_treinado: Supervisor direto do operador concluiu o curso de liderança em março de 2026 (1 = sim, 0 = não).
      absenteismo_abr_jun: Percentual das horas escaladas do operador não trabalhadas (faltas e atrasos) de abril a junho de 2026.
      absenteismo_jan_mar: Mesmo percentual, de janeiro a março de 2026.
      operacao: Operação do operador (cobrança, SAC ou vendas).
      tempo_casa: Meses de empresa do operador em 1º de abril de 2026.
      turno: Turno do operador (manhã, tarde ou noite).
      feedbacks_1a1: Número de conversas individuais de feedback com o operador registradas pelo supervisor no sistema entre abril e junho de 2026.
      matricula: Matrícula do operador.
    not_in_table:
      avaliacao_diretor: O julgamento do diretor de operações sobre quais supervisores "têm futuro". Foi dito em conversa; não há registro.
    story: >-
      Pergunta de leiga, sejam gentis. Sou de RH de um call center (uns 1.200 operadores,
      61 supervisores) e preciso dizer até sexta se o curso de liderança que 22
      supervisores fizeram em março reduziu o absenteísmo das equipes. Quem escolheu os 22
      foi o diretor de operações: pegou as equipes com absenteísmo mais alto no primeiro
      trimestre e, dentro delas, os supervisores que ele acha que "têm futuro". Isso foi
      conversa de sala, não tem nada escrito, e, convenhamos, supervisor bom já segura a
      equipe sem curso nenhum. Vendas ficou de fora porque estava em campanha, e vendas
      sempre teve bem menos falta que cobrança. Depois do curso, os treinados passaram a
      registrar muito mais conversas individuais de feedback no sistema, e operador que
      recebe feedback falta menos, a gente vê isso todo ano. Novato e turno da noite
      faltam mais, sempre faltaram. Tenho a base por operador, com o absenteísmo de
      janeiro a março e de abril a junho. Basta comparar as equipes treinadas com as
      outras, ajustando pelo absenteísmo anterior?
    edges:
      - absenteismo_jan_mar -> supervisor_treinado
      - absenteismo_jan_mar -> absenteismo_abr_jun
      - operacao -> supervisor_treinado
      - operacao -> absenteismo_abr_jun
      - avaliacao_diretor -> supervisor_treinado
      - avaliacao_diretor -> absenteismo_abr_jun
      - tempo_casa -> absenteismo_abr_jun
      - turno -> absenteismo_abr_jun
      - supervisor_treinado -> feedbacks_1a1
      - feedbacks_1a1 -> absenteismo_abr_jun
      - supervisor_treinado -> absenteismo_abr_jun
    answer:
      identifiable: false
      missing: [avaliacao_diretor]
    note: >-
      O absenteísmo anterior e a operação estão na tabela e parecem bastar; o julgamento
      do diretor sobre o supervisor, que também segura a equipe, não está. Os feedbacks
      são consequência do curso.
