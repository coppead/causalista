# Casos simulados para TREINO, lote pt-06: oito casos em português do Brasil escritos
# como se fossem de uma pessoa (o diretor de uma rede de escolas de idiomas, o dono de
# uma rede de pet shops, o gerente de segurança do trabalho de uma mineradora, um
# analista de uma distribuidora de medicamentos, a coordenadora pedagógica de uma rede
# municipal), cada um no estilo em que essa pessoa escreveria: transcrição de áudio
# informal, trecho de dissertação de mestrado, mensagem de Slack para o time de dados,
# briefing para uma consultoria, trecho de relatório trimestral.
#
# Escritos pelo assistente em 2026-10-07, no papel de cada pessoa. Idioma: pt.
#
# Estes casos são TREINO (reforço: o modelo responde, o verificador dá a nota). Não são
# teste e não reaproveitam nenhum cenário dos casos congelados de cases/simulados/. As
# setas ("causa -> efeito") declaram o diagrama que o texto, as descrições das colunas e
# o bom senso implicam; o verificador confere a resposta a partir delas
# (scripts/check_cases.py). Status: rascunho até aprovação por delegação.

cases:

  - id: pt_idiomas_clube_conversacao
    author: ai
    status: rascunho
    language: pt
    style: transcrição de áudio informal
    persona: diretor de uma rede de escolas de idiomas com cinco unidades no interior de Minas Gerais, ex-professor de inglês, sem formação em dados
    theme: Educação privada (escola de idiomas)
    title: Clube de conversação e rematrícula
    treatment: clube_conversacao
    outcome: rematriculou
    columns:
      id_aluno: Código do aluno no sistema acadêmico.
      clube_conversacao: Participou do clube de conversação aos sábados em pelo menos quatro encontros no primeiro semestre de 2026 (1 = sim, 0 = não).
      rematriculou: Fez a rematrícula para o segundo semestre de 2026 dentro do prazo, até 15 de julho (1 = sim, 0 = não).
      nivel: Nível do aluno no início do semestre (básico, intermediário ou avançado).
      semestres_cursados: Semestres concluídos na escola até o fim de 2025.
      unidade: Unidade em que o aluno estuda (Centro, Shopping, Bairro Alto, Nova Era ou Rio Verde).
      nota_prova_final: Nota na prova oral e escrita de fim de semestre, aplicada na última semana de junho de 2026, de 0 a 10.
      respondeu_pesquisa: Respondeu à pesquisa de satisfação enviada por e-mail no fim de julho de 2026 (1 = sim, 0 = não).
    not_in_table:
      gosto_pelo_curso: O quanto o aluno gosta do curso e se envolve com ele, a impressão que cada professor tem dos seus alunos. Não existe campo para isso no sistema.
    story: >-
      Oi Renata, tudo bem? vou te mandar por áudio que é mais rápido, depois você me cobra
      o que faltar. É sobre o clube de conversação, lembra? Aquele que a gente começou em
      fevereiro, sábado de manhã, de graça, aberto pra qualquer aluno, em três unidades
      só, Centro, Shopping e Nova Era, porque nas outras duas eu não tinha professor pra
      pôr no sábado. Então, a rematrícula do segundo semestre fechou dia 15 de julho e eu
      fui olhar: dos alunos que frequentaram o clube, assim, pelo menos quatro sábados,
      81% rematricularam, contra 64% do resto. A Lu do Shopping já quer vender isso pros
      franqueados como a grande solução da evasão, e eu queria segurar um pouco.

      Porque assim, quem vai no clube é quem gosta mesmo do curso, aquele aluno que você
      vê que participa em sala, que pergunta, que faz a lição. Esse aluno fica com a gente
      de qualquer jeito, e vai bem na prova também. Isso de gostar do curso o professor
      sabe de cabeça de cada um, mas não tem no sistema, não tem campo pra isso. Outra
      coisa, o aluno de nível avançado vai muito mais no clube, porque consegue conversar,
      né, o básico morre de vergonha. E avançado rematricula menos, porque tá acabando o
      curso. O nível tá ligado ao tempo de casa, óbvio, quem tem mais semestre tá em nível
      mais alto.

      As unidades são diferentes também: o Shopping sempre perdeu mais aluno que as outras,
      é um público mais rotativo, e lá o clube lotou. Eu pedi pro Diego puxar do sistema:
      a unidade, o nível, quantos semestres o aluno já tinha, a nota da prova final de
      junho, se foi no clube e se rematriculou. Na prova final o pessoal do clube foi bem
      melhor, principalmente na oral, o que faz sentido, praticaram mais, e quem vai mal
      na prova desanima e some. Ah, e tem a pesquisa de satisfação, que a gente mandou por
      e-mail no fim de julho, depois que a rematrícula fechou. Quem rematriculou respondeu
      bem mais, lógico, e as professoras do clube ficaram cobrando a turma delas pra
      responder, então também respondeu mais. O Diego pôs se respondeu ou não. Enfim, me
      diz: dá pra eu dizer que o clube segurou aluno ou não dá? Valeu, beijo.
    edges:
      - gosto_pelo_curso -> clube_conversacao
      - gosto_pelo_curso -> rematriculou
      - gosto_pelo_curso -> nota_prova_final
      - nivel -> clube_conversacao
      - nivel -> rematriculou
      - semestres_cursados -> nivel
      - unidade -> clube_conversacao
      - unidade -> rematriculou
      - clube_conversacao -> nota_prova_final
      - nota_prova_final -> rematriculou
      - clube_conversacao -> rematriculou
      - clube_conversacao -> respondeu_pesquisa
      - rematriculou -> respondeu_pesquisa
    answer:
      identifiable: false
      missing: [gosto_pelo_curso]
    note: >-
      Quem vai ao clube é quem gosta do curso, e isso não está em coluna nenhuma. Nível e
      unidade explicam parte da ida ao clube, mas não essa parte. A nota da prova final é
      consequência do clube e a pesquisa foi respondida depois da rematrícula; nenhuma das
      duas substitui o que falta.

  - id: pt_pet_assinatura_depois
    author: ai
    status: rascunho
    language: pt
    style: mensagem de Slack para o time de dados
    persona: dono de uma rede de quatro pet shops na zona norte de Porto Alegre, administrador, mexe em planilha mas não em estatística
    theme: Varejo (pet shop)
    title: Assinatura de banho e gasto com produtos, com as visitas contadas depois
    twin: pt_pet_assinatura_antes
    treatment: assinatura_banho
    outcome: gasto_produtos_6m
    columns:
      assinatura_banho: Aderiu ao plano mensal de banho (quatro banhos por mês a preço fixo) no lançamento, em março de 2026 (1 = sim, 0 = não).
      gasto_produtos_6m: Gasto com produtos (ração, petiscos, acessórios, farmácia) de abril a setembro de 2026, em reais. Não inclui serviços.
      gasto_produtos_6m_antes: Gasto com produtos de outubro de 2025 a março de 2026, em reais, mesmo critério.
      porte_pet: Porte do maior cão do cliente no cadastro (pequeno, médio ou grande).
      visitas_loja_6m: Número de vezes que o cliente passou no caixa de abril a setembro de 2026, com compra ou serviço.
      loja: Loja em que o cliente está cadastrado (1 a 4).
    story: >-
      @time-dados bom dia! Lembram do plano de banho mensal que lançamos em março? Preciso
      saber se ele puxou venda de produto, porque a margem do banho é baixa e a aposta era
      essa: o cliente vindo toda semana pro banho leva ração, petisco, o que for. Puxei do
      caixa, por cliente: gasto com produto de abr a set, o mesmo gasto de out a mar,
      quantas vezes a pessoa passou no caixa de abr a set, porte do cão e a loja. Quem
      aderiu foi muito o pessoal de cachorro grande (banho de grande é caro, o plano
      compensa) e quem já gastava bem com a gente antes. Cachorro grande come mais e
      cliente bom continua bom, isso vcs sabem melhor que eu. A loja 3 vendeu o dobro de
      planos das outras porque a Carla abraçou a ideia. Bruto: assinante gastou R$ 1.340
      em produto no período vs R$ 760 dos outros. Confio nessa diferença? Ajusto por quê?
    edges:
      - gasto_produtos_6m_antes -> assinatura_banho
      - gasto_produtos_6m_antes -> gasto_produtos_6m
      - porte_pet -> assinatura_banho
      - porte_pet -> gasto_produtos_6m
      - loja -> assinatura_banho
      - assinatura_banho -> visitas_loja_6m
      - visitas_loja_6m -> gasto_produtos_6m
      - assinatura_banho -> gasto_produtos_6m
    answer:
      identifiable: true
      adjust_for: [gasto_produtos_6m_antes, porte_pet]
      do_not_adjust_for:
        visitas_loja_6m: Contada de abril a setembro, depois do lançamento, e é consequência do plano. Vir toda semana e comprar enquanto está na loja é justamente o caminho pelo qual o plano age.
      indifferent: [loja]
    note: >-
      Os dois motivos da adesão (porte do cão e gasto anterior) estão na tabela. A loja só
      mexe na adesão. A armadilha são as visitas, contadas depois do lançamento.

