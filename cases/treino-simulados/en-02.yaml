# Simulated human-written cases for TRAINING, file en-02: eight cases in English (US, UK and
# Canadian voices).
#
# Written by a large language model on 2026-10-07, in the role of a real person (the owner of a chain of car
# washes, a programme officer at a UK housing charity, a data analyst at a ride-hailing company
# in Toronto, the principal of a charter school network, a marketing manager at a fitness app)
# describing a dataset the way that person would in a forum post, a quarterly report, an
# internal wiki page, a chat message or an e-mail to the data team.
#
# These cases are TRAINING material: the model answers them, the verifier grades the answer,
# nothing else is shown to it. They deliberately avoid every scenario of the frozen test set in
# cases/simulados/. The edges declare the causal diagram the text implies; the checker
# (scripts/check_cases.py) recomputes every answer from the edges with the verifier.

cases:

  - id: en_wash_club_course_picked
    author: ai
    status: rascunho
    language: en
    style: forum post
    persona: owner of a chain of 14 express car washes in the Phoenix area, runs the business from spreadsheets, no analyst on staff
    theme: Small business / car wash memberships
    title: Membership selling course at the sites the owner picked
    twin: en_wash_club_course_coinflip
    treatment: pitch_course
    outcome: club_signups_per_1k
    columns:
      site_id: Site number, 1 to 14.
      pitch_course: 1 if the site's pay-station crew went through the two-day Unlimited Club selling course in March 2026, 0 if not.
      club_signups_per_1k: New Unlimited Club memberships sold April through June, per 1,000 cars washed at the site in the same months.
      cars_per_day_q1: Average cars washed per day, January through March 2026.
      tunnel_ft: Tunnel length in feet.
      pitches_logged_pct: Percent of April-June retail transactions where the attendant tapped "club pitched" on the pay station.
    not_in_table:
      manager_quality: How much the owner trusts each site manager to run things properly. His own ranking, in his head, never written down.
    story: >-
      Long time lurker, first post. I run 14 express exterior tunnels around Phoenix (Mesa,
      Chandler, Gilbert, two in Tempe). Back in March I sent the pay-station crews at 6 of my
      sites through a two-day course on selling the Unlimited Club, about $4k per site all in
      with the trainer's travel. My bookkeeper wants to know if it paid for itself and honestly
      so do I.

      What I have is a spreadsheet by site: cars per day for Jan through Mar, tunnel length
      (the 130-footers push a lot more cars through than the 100s), new club memberships sold
      April through June per thousand cars, and a percentage off the pay station where the
      attendant taps a button whenever they pitch the club. That pitch percentage roughly
      doubled at the trained sites, which I was pretty happy about, and you don't sell a
      membership you never pitched. Trained sites came in around 31 per thousand vs 19 for
      the rest.

      How I picked the 6: I didn't overthink it. I went with the managers I trust to actually
      make the crew do it, and I leaned toward my busier sites because that's where the upside
      is. If you asked me to rank my managers I could do it in my head but it's not written
      down anywhere, and a good manager sells more club with or without a course. The busier
      sites always sold more memberships per car anyway, lots of commuters.

      Is that 31 vs 19 the real lift from the course, or am I kidding myself? What should I be
      comparing against?
    edges:
      - manager_quality -> pitch_course
      - manager_quality -> club_signups_per_1k
      - cars_per_day_q1 -> pitch_course
      - cars_per_day_q1 -> club_signups_per_1k
      - tunnel_ft -> cars_per_day_q1
      - pitch_course -> pitches_logged_pct
      - pitches_logged_pct -> club_signups_per_1k
      - pitch_course -> club_signups_per_1k
    answer:
      identifiable: false
      missing: [manager_quality]
    note: >-
      Traffic is recorded and could be adjusted for, but the owner also picked the managers he
      trusts, and that ranking lives only in his head while it drives membership sales on its
      own. The pitch percentage he is proud of is a result of the course.

