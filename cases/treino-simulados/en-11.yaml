  - id: en_fitapp_save_offer
    author: ai
    status: rascunho
    language: en
    style: chat message
    persona: marketing manager at a London fitness app with about two million users, messaging the analyst on her team before a meeting with the head of growth
    theme: Consumer software / subscription retention
    title: Half-price save offer made by retention agents during the cancellation chat
    treatment: save_offer_shown
    outcome: active_d90
    columns:
      user_id: Internal user id.
      save_offer_shown: 1 if the retention agent offered the user three months at half price during the cancellation chat in May 2026.
      active_d90: 1 if the user had an active subscription 90 days after the cancellation chat.
      tenure_months: Months subscribed at the time of the cancellation chat.
      workouts_30d: Workouts logged in the 30 days before the cancellation chat.
      offer_accepted: 1 if the user took the offer (0 for everyone who was not offered it).
      winback_email: 1 if the user received the win-back email. Sent 30 days after cancellation to anyone who left, and as a follow-up to everyone who was made the offer, whether they left or stayed.
      agent_id: Retention agent who handled the chat (one of 11).
    not_in_table:
      agent_read: What the agent made of the conversation, i.e. whether the person sounded like they could be talked round. Not recorded anywhere; there is no field for why an offer was or was not made.
    story: >-
      Tom, quick one before my 3pm with Rachel. The save offer: of the ~9k people who went
      through the cancellation chat in May, about 40% were offered the three-months-half-price,
      and 90 days on 46% of them are still subscribed vs 18% of the ones who weren't offered it.
      Rachel wants to call that a 28-point lift and tell the agents to offer it to everyone.

      Thing is, right now the offer is the agent's call. They have tenure and last-30-days
      workouts up on the screen and they do use them (nobody offers it to someone who hasn't
      opened the app in a month), but mostly it's how the conversation goes, whether the person
      sounds like they can be talked round. There's no field for that, we only know who got the
      offer. And the agents are good at reading people, the ones they think are on the fence
      mostly are. Some agents offer a lot more than others, but I don't think that matters
      beyond who gets it.

      About a third of the people offered accepted, and the ones who accepted are nearly all
      still with us, which is the whole point. The win-back email went to the usual leavers at
      day 30 and we also sent it to everyone who'd been made the offer, it's in the export.

      Can I say anything honest about the lift with what we've got? Need an answer by Thursday.
    edges:
      - agent_read -> save_offer_shown
      - agent_read -> active_d90
      - tenure_months -> save_offer_shown
      - tenure_months -> active_d90
      - workouts_30d -> save_offer_shown
      - workouts_30d -> active_d90
      - agent_id -> save_offer_shown
      - save_offer_shown -> offer_accepted
      - offer_accepted -> active_d90
      - save_offer_shown -> active_d90
      - save_offer_shown -> winback_email
      - active_d90 -> winback_email
    answer:
      identifiable: false
      missing: [agent_read]
    note: >-
      Tenure and recent workouts are recorded, but the agent also went by how the conversation
      sounded, which is in no column and predicts staying on its own. The agent only moves the
      offer. Acceptance is a result of the offer; the win-back email follows both the offer and
      the outcome.

  - id: en_fitapp_free_month
    author: ai
    status: rascunho
    language: en
    style: notes from a call with a consultant
    persona: marketing manager at a London fitness app, writing up her notes after a call with a freelance analytics consultant
    theme: Consumer software / free trial of a paid tier
    title: Free month of Premium at day 30 and paid status at month 4
    treatment: free_month
    outcome: paid_at_m4
    columns:
      user_id: Internal user id.
      free_month: 1 if the user was granted a free month of Premium at the end of their first 30 days (March 2026 sign-up cohort).
      paid_at_m4: 1 if the user was on a paid plan at the start of month 4 after sign-up.
      workouts_first_30d: Workouts logged in the first 30 days after sign-up.
      workouts_m2: Workouts logged in days 31 to 60 after sign-up.
      support_ticket_first_30d: 1 if the user opened a support ticket in their first 30 days (billing, bugs, anything).
      price_tier: Monthly price band for the user's country. A (12 to 14 in local currency), B (8 to 11), C (under 8).
    story: >-
      Notes from call with Hannah (the consultant Priya used at her last place), Tues 6 Oct.

      Context I gave her: the March cohort, about 31k sign-ups on the free tier. We gave a free
      month of Premium at day 30 to anyone who'd logged 10 or more workouts in their first month,
      that was the "reward the keen ones" idea. Paid at month 4: 23% for free-month users vs 9%
      for everyone else. I'd like to tell leadership the free month works.

      Hannah's questions and what I said. Was 10 workouts the only way in? No. Customer care also
      hands out free months to people who write in during the first month, mostly billing errors
      and the Android sync bug. A few hundred of those. People who had to write to us in their
      first month are, let's say, not our most loyal. Did anything else decide it? Not that I know
      of. She asked when exactly each workouts column was measured; I said it's in the data
      dictionary. She asked about price. We price by country, three bands, and the cheap-band
      countries convert better. Nothing to do with who got the free month.

      She also said the keen ones were always going to convert more, free month or not, and I
      said yes, that's why we gave it to them, which she found funny.

      Her view: answerable from what we have if we're careful about which columns go in. She'll
      send a note. Table is one row per March sign-up, columns as in the export.
    edges:
      - workouts_first_30d -> free_month
      - workouts_first_30d -> paid_at_m4
      - workouts_first_30d -> workouts_m2
      - support_ticket_first_30d -> free_month
      - support_ticket_first_30d -> paid_at_m4
      - free_month -> workouts_m2
      - workouts_m2 -> paid_at_m4
      - free_month -> paid_at_m4
      - price_tier -> paid_at_m4
    answer:
      identifiable: true
      adjust_for: [support_ticket_first_30d, workouts_first_30d]
      do_not_adjust_for:
        workouts_m2: Logged after the free month was granted and lifted by it; it is part of how the free month leads to paying. Adjusting for it hides that part of the effect.
      indifferent: [price_tier, user_id]
    note: >-
      Two routes into the free month (workouts in month one, a support ticket), both recorded and
      both tied to converting. The trap is the second workouts column, which looks like the first
      but, by the dictionary, was measured after the free month began. Price only drives
      conversion.
