# Casos simulados para TREINO, em português do Brasil: oito textos escritos como uma
# pessoa escreveria.
#
# Escritos pelo assistente em 2026-10-07, a pedido do André, no papel de cinco pessoas: a
# gerente de cobrança de uma operadora de cartões, um produtor rural de laranja, a
# gerente de uma rede de óticas, uma analista de dados de um clube de assinatura de
# vinhos e o diretor de operações de uma transportadora de cargas frias. Cada texto tem
# o estilo do canal em que a pessoa escreveria (e-mail ao chefe, fórum de analytics,
# WhatsApp, ata de reunião, página de wiki interna).
#
# Estes casos servem ao treino por reforço (o modelo responde, o verificador dá a nota).
# Não são casos de teste: nenhum cenário do conjunto congelado de cases/simulados/ se
# repete aqui. As setas declaram o diagrama que o texto implica; o verificador confere a
# resposta a partir delas (scripts/check_cases.py). Status rascunho até a revisão.

cases:

  - id: pt_cartoes_repasse_externo
    author: ai
    status: rascunho
    language: pt
    style: e-mail para o chefe
    persona: gerente de cobrança de uma operadora de cartões
    theme: Cobrança de cartão de crédito, repasse de contas a escritório externo
    title: Repasse ao escritório externo e recuperação em 90 dias
    twin: pt_cartoes_repasse_externo_nota
    treatment: repasse_externo
    outcome: pagou_90d
    columns:
      repasse_externo: >-
        Conta repassada ao escritório externo (Recupera+) ao completar 30 dias de atraso
        (1 = sim; 0 = ficou com a equipe interna).
      pagou_90d: Quitou ou renegociou o saldo em atraso até o 90º dia de atraso (1 = sim, 0 = não).
      saldo_atraso: Saldo em atraso no 30º dia, em reais.
      score_interno: >-
        Score de risco do modelo interno na data do 30º dia de atraso, de 0 a 1000 (quanto
        maior, menor o risco).
      acionamentos: >-
        Número de contatos com o cliente (ligação atendida, SMS, WhatsApp) entre o 30º e o
        90º dia de atraso.
      reclamacao: >-
        Registrou reclamação sobre a cobrança (SAC, Procon ou consumidor.gov) até o 120º dia
        de atraso (1 = sim, 0 = não).
      canal_emissao: Canal em que o cartão foi emitido (app, loja parceira ou telemarketing).
    not_in_table:
      impressao_supervisora: >-
        A leitura que a supervisora da equipe interna faz, ouvindo as ligações dos primeiros
        30 dias, sobre se o cliente tem intenção de pagar. Não é anotada em lugar nenhum.
    story: >-
      Ricardo, bom dia. Segue o que levantei sobre o Recupera+ antes da renovação do
      contrato, que vence em novembro. Peguei todas as contas que completaram 30 dias de
      atraso entre março e junho (41.380 CPFs) e marquei quais foram repassadas pra eles no
      dia 30 e quais ficaram com o nosso time. No bruto, a recuperação em 90 dias do externo
      é pior que a nossa, 23% contra 31%, mas não acho que dá pra levar esse número pro
      comitê, e queria tua opinião. O ponto é como as contas vão pra lá. A regra formal é
      saldo: acima de R$ 3 mil vai pro externo, porque eles têm estrutura pra negociar valor
      grande, e saldo grande a gente sabe que paga menos. O modelo de risco também entra:
      quem está com score baixo no dia 30 vai pro externo quase sempre, e score baixo paga
      menos, por definição. Mas tem uma parte que ninguém escreve. A Cláudia, que
      supervisiona o time interno, ouve as ligações dos primeiros 30 dias e manda pro
      externo quem ela sente que não vai pagar de jeito nenhum, mesmo com saldo pequeno e
      score ok. E ela acerta bastante: quem ela marca assim quase nunca paga. Só que isso é
      a cabeça dela, não tem campo no sistema. Do lado deles, o que fazem de diferente é
      acionar muito mais (média de 14 contatos por conta contra 6 nossos entre o dia 30 e o
      90), e mais contato é mais pagamento, isso é pacífico. Eles também têm alçada pra
      desconto maior no à vista, o que por si só já deve mexer na recuperação. O efeito
      colateral é a reclamação: a agressividade deles gera Procon e consumidor.gov, e
      também reclama mais quem não pagou e continua sendo cobrado depois do dia 90. O
      extrato do CRM tem saldo no dia 30, score, acionamentos, flag de reclamação até o dia
      120 e o canal de emissão do cartão (veio junto, não sei se serve pra algo). Dá pra
      tirar alguma conclusão séria sobre o efeito do repasse com isso, ou preciso desenhar
      um teste antes de novembro? Abraço, Fernanda.
    edges:
      - saldo_atraso -> repasse_externo
      - saldo_atraso -> pagou_90d
      - score_interno -> repasse_externo
      - score_interno -> pagou_90d
      - impressao_supervisora -> repasse_externo
      - impressao_supervisora -> pagou_90d
      - repasse_externo -> acionamentos
      - acionamentos -> pagou_90d
      - repasse_externo -> pagou_90d
      - repasse_externo -> reclamacao
      - pagou_90d -> reclamacao
    answer:
      identifiable: false
      missing: [impressao_supervisora]
    note: >-
      Saldo e score explicam parte do repasse e estão na tabela; a impressão da supervisora,
      que também decide o repasse e prevê o pagamento, ficou só na cabeça dela. Os
      acionamentos são consequência do repasse e a reclamação é registrada depois do prazo
      de pagamento.

  - id: pt_cartoes_repasse_externo_nota
    author: ai
    status: rascunho
    language: pt
    style: e-mail para o chefe
    persona: gerente de cobrança de uma operadora de cartões
    theme: Cobrança de cartão de crédito, repasse de contas a escritório externo
    title: Repasse ao escritório externo, com a nota da supervisora no sistema
    twin: pt_cartoes_repasse_externo
    treatment: repasse_externo
    outcome: pagou_90d
    columns:
      repasse_externo: >-
        Conta repassada ao escritório externo (Recupera+) ao completar 30 dias de atraso
        (1 = sim; 0 = ficou com a equipe interna).
      pagou_90d: Quitou ou renegociou o saldo em atraso até o 90º dia de atraso (1 = sim, 0 = não).
      saldo_atraso: Saldo em atraso no 30º dia, em reais.
      score_interno: >-
        Score de risco do modelo interno na data do 30º dia de atraso, de 0 a 1000 (quanto
