# Casos simulados para TREINO, em português do Brasil: oito textos escritos como uma
# pessoa escreveria.
#
# Escritos pelo assistente em 2026-10-07, a pedido do André, no papel de cinco pessoas: a
# coordenadora de um programa de microcrédito, a gerente de e-commerce de uma marca de
# moda, o gerente de segurança do trabalho de uma mineradora, o diretor de uma escola
# técnica estadual e a gerente de assinaturas de um jornal. Cada texto tem o estilo do
# canal em que a pessoa escreveria (e-mail para o chefe, Slack para o time de dados,
# trecho de dissertação, nota interna, página de wiki).
#
# Estes casos servem ao treino por reforço: o modelo responde, o verificador dá a nota.
# Não são o teste da seção 7 (os de cases/simulados/) e não repetem os cenários dele.
# Não são texto de pessoas de verdade. A resposta de cada caso é conferida contra o
# diagrama declarado em `edges` por scripts/check_cases.py.

cases:

  - id: pt_microcredito_oficina
    author: ai
    status: rascunho
    language: pt
    style: e-mail para o chefe
    persona: coordenadora de um programa de microcrédito no interior de Pernambuco, formada em serviço social
    theme: Microcrédito
    title: Oficina de educação financeira e atraso no primeiro ciclo
    treatment: oficina_financeira
    outcome: atraso_60d
    columns:
      oficina_financeira: Participou da oficina de educação financeira antes do desembolso do primeiro empréstimo (1 = sim, 0 = não).
      atraso_60d: Teve parcela com mais de 60 dias de atraso durante o primeiro ciclo (1 = sim, 0 = não).
      renda_familiar: Renda familiar mensal declarada no cadastro, em reais.
      tempo_negocio: Tempo de funcionamento do negócio no cadastro, em anos.
      valor_liberado: Valor do primeiro empréstimo liberado pelo comitê de crédito, em reais.
      agente_credito: Agente de crédito responsável pelo cadastro do cliente.
      visita_agente: Recebeu visita do agente durante o primeiro ciclo (1 = sim, 0 = não). Inclui a visita de acompanhamento do terceiro mês e a visita de cobrança.
    not_in_table:
      organizacao_cliente: Impressão do agente, na visita de cadastro, sobre o quanto o cliente é organizado com as contas. Não é registrada.
    story: >-
      Oi Ricardo, tudo bem? Segue o que eu consegui levantar sobre a oficina de educação
      financeira, pra gente decidir se ela fica no orçamento de 2027. Desde abril de 2025
      oferecemos uma oficina de duas tardes (fluxo de caixa, separar o dinheiro da casa do
      dinheiro do negócio) antes do desembolso do primeiro empréstimo. Foram 412 clientes com
      oficina e 1.130 sem, todos de primeiro ciclo. Puxei do sistema a planilha com o atraso
      acima de 60 dias no primeiro ciclo, a renda familiar declarada no cadastro, o tempo do
      negócio e o valor liberado. Como a oficina depende da agenda do agente, a Marta e o
      Josué fizeram quase todas; os outros agentes mal convidaram. Quem define o valor e
      aprova é o comitê de crédito, não o agente. Agora, o que me deixa com um pé atrás: na
      prática os agentes convidavam de preferência quem eles achavam mais organizado, aquele
      cliente que já chega com o caderninho anotado, e esse cliente paga melhor de qualquer
      jeito. A gente não registra nada disso, é impressão do agente na visita. Pela regra do
      programa, a oficina também foi oferecida primeiro às famílias de renda mais baixa, e
      essas famílias são as que mais atrasam. Uma coisa que eu reparei: quem passou pela
      oficina acabou pedindo valores menores, acho que a conversa sobre fluxo de caixa deixa
      a pessoa mais pé no chão, e valor menor atrasa menos. Negócio mais antigo atrasa menos,
      isso a gente já sabia. Tem também a coluna da visita: o agente visita quem fez a oficina
      no terceiro mês, pra ver se está aplicando, e visita também todo mundo que passou de 60
      dias de atraso, pra cobrar. Dá pra tirar alguma conclusão séria sobre a oficina com
      esses dados ou não? Abraço, Lúcia
    edges:
      - organizacao_cliente -> oficina_financeira
      - organizacao_cliente -> atraso_60d
      - renda_familiar -> oficina_financeira
      - renda_familiar -> atraso_60d
      - tempo_negocio -> atraso_60d
      - agente_credito -> oficina_financeira
      - oficina_financeira -> valor_liberado
      - valor_liberado -> atraso_60d
      - oficina_financeira -> atraso_60d
      - oficina_financeira -> visita_agente
      - atraso_60d -> visita_agente
    answer:
      identifiable: false
      missing: [organizacao_cliente]
    twin: pt_microcredito_oficina_nota
    note: A impressão do agente sobre a organização do cliente decide quem é convidado e prevê o atraso, e não está na tabela. O valor liberado é consequência da oficina; a visita vem depois do atraso.

  - id: pt_microcredito_oficina_nota
