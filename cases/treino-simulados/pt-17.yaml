    edges:
      - nota_organizacao -> oficina_financeira
      - nota_organizacao -> atraso_60d
      - renda_familiar -> oficina_financeira
      - renda_familiar -> atraso_60d
      - tempo_negocio -> atraso_60d
      - agente_credito -> oficina_financeira
      - oficina_financeira -> valor_liberado
      - valor_liberado -> atraso_60d
      - oficina_financeira -> atraso_60d
      - oficina_financeira -> visita_agente
      - atraso_60d -> visita_agente
    answer:
      identifiable: true
      adjust_for: [nota_organizacao, renda_familiar]
      do_not_adjust_for:
        valor_liberado: É consequência da oficina e faz parte do efeito que se quer medir. Quem fez a oficina pediu valores menores, e valor menor atrasa menos.
        visita_agente: Vem depois do atraso e é causada pela oficina e pelo próprio atraso. Ajustar por ela cria uma associação falsa entre oficina e atraso.
