      - media_2ano -> empregado_6m
      - curso -> estagio_parceria
      - curso -> empregado_6m
      - distancia_empresa -> estagio_parceria
      - idade -> empregado_6m
      - estagio_parceria -> frequencia_3ano
      - frequencia_3ano -> empregado_6m
      - estagio_parceria -> empregado_6m
      - estagio_parceria -> respondeu_egressos
      - empregado_6m -> respondeu_egressos
    answer:
      identifiable: true
      adjust_for: [curso, media_2ano]
      do_not_adjust_for:
