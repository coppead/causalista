    status: rascunho
    language: pt
    style: e-mail para o chefe
    persona: coordenadora de um programa de microcrédito no interior de Pernambuco, formada em serviço social
    theme: Microcrédito
    title: Oficina de educação financeira e atraso, com a nota de organização no sistema
