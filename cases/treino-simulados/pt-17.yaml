    note: Nota curta. A frequência do 3º ano parece uma coluna anterior, mas o ano do estágio e o da frequência são o mesmo, e a nota diz que o estágio mudou a frequência.

  - id: pt_jornal_desconto_retencao
    author: ai
    status: rascunho
    language: pt
    style: nota interna curta
    persona: gerente de assinaturas de um jornal regional, formada em jornalismo, sem formação em estatística
    theme: Assinaturas de jornal
    title: Desconto de retenção na ligação de cancelamento e assinatura ativa
    treatment: desconto_retencao
    outcome: ativo_6m
    columns:
      desconto_retencao: Recebeu oferta de 40% de desconto por seis meses na ligação de cancelamento (1 = sim, 0 = não).
      ativo_6m: Assinatura ativa seis meses após a ligação (1 = sim, 0 = não).
      motivo_cancelamento: Código do motivo informado na ligação. preco, conteudo, tempo ou mudanca.
      tempo_assinatura: Meses de assinatura até a data da ligação.
      atendente: Código do atendente que atendeu a ligação.
    not_in_table:
      duvida_assinante: Se o assinante parecia em dúvida sobre cancelar, percebido pelo atendente na conversa. Não é registrado.
    story: >-
      Nota rápida sobre o desconto de retenção, pra gente discutir na segunda. Hoje a oferta
      de 40% por seis meses fica a critério do atendente: o roteiro manda oferecer quando o
      motivo da ligação é preço, mas na prática o atendente oferece quando sente que a pessoa
      está em dúvida, e quem liga em dúvida acaba ficando mais mesmo sem desconto. Essa
      sensação não vai pra lugar nenhum, o sistema só grava o código do motivo. Peguei as
      3.900 ligações de cancelamento do primeiro semestre, com o motivo, o tempo de
      assinatura, o atendente e se o assinante continuava ativo seis meses depois. Pra
      assinante antigo o atendente tende a oferecer mais, pra segurar, e assinante antigo
      também fica mais; motivo conteúdo quase não volta, preço volta bastante. Tem atendente que oferece pra todo mundo
      e atendente que quase nunca oferece. Faz sentido medir o efeito do desconto com essa
      base ou eu paro de insistir nisso?
    edges:
      - duvida_assinante -> desconto_retencao
      - duvida_assinante -> ativo_6m
      - motivo_cancelamento -> desconto_retencao
      - motivo_cancelamento -> ativo_6m
      - tempo_assinatura -> desconto_retencao
      - tempo_assinatura -> ativo_6m
      - atendente -> desconto_retencao
      - desconto_retencao -> ativo_6m
    answer:
      identifiable: false
      missing: [duvida_assinante]
    note: Caso curto, com o fator que falta dito logo no início. Motivo e tempo de assinatura são confusões reais, mas a dúvida percebida pelo atendente não está na tabela.

  - id: pt_ecommerce_frete_gratis
    author: ai
    status: rascunho
    language: pt
    style: mensagem de Slack para o time de dados
    persona: gerente de e-commerce de uma marca de moda feminina de médio porte, formada em administração
    theme: E-commerce de moda
    title: Frete grátis acima de R$ 150 e recompra em 90 dias
    treatment: frete_gratis_150
    outcome: recompra_90d
    columns:
      frete_gratis_150: Cliente incluída na lista de frete grátis para pedidos acima de R$ 150, liberada em junho de 2026 (1 = sim, 0 = não).
      recompra_90d: Fez ao menos um pedido nos 90 dias após a liberação da lista (1 = sim, 0 = não).
      regiao_entrega: Região do endereço principal de entrega. sudeste, sul, nordeste, centro_oeste ou norte.
      pedidos_2025: Número de pedidos concluídos pela cliente em 2025.
      sessoes_app_90d: Número de sessões no app nos 90 dias após a liberação da lista.
      cupom_reativacao: Recebeu cupom de reativação em setembro de 2026 (1 = sim, 0 = não).
      dia_semana_cadastro: Dia da semana em que a cliente fez o cadastro no site.
    story: >-
      gente, bom dia. a Carol do CRM quer apresentar o frete grátis acima de 150 como case
      no offsite e me pediu um número de recompra. antes que alguém faça o com x sem direto,
      deixa eu contar como a lista foi montada. em junho a gente liberou frete grátis a
      partir de R$ 150 pra um grupo de clientes: entrou quem o CRM marcou como recorrente (3
      ou mais pedidos em 2025) e também a base do Sudeste, que o CD de Extrema entrega em até
      2 dias, mas não foi 100% nem num grupo nem no outro, o orçamento não deu e o CRM cortou
      aleatório dentro de cada grupo. a liberação veio com push e banner no app. o que eu tenho na base: região de entrega, pedidos em
      2025, sessões no app nos 90 dias seguintes, se a cliente recomprou em 90 dias, se
      recebeu cupom de reativação em setembro e o dia da semana do cadastro (veio junto no
      export, ignorem). coisas que eu sei: cliente recorrente recompra muito mais, óbvio;
      Sudeste recompra mais porque recebe rápido; quem ganhou frete grátis passou a abrir o
      app bem mais (push, banner) e quem abre mais o app compra de novo. o cupom de
      reativação é da régua automática pra quem ficou 90 dias sem comprar, só que a lista do
      frete grátis entrou numa régua separada que também manda cupom. me ajudem a montar a
      comparação direito pra eu não passar vergonha na frente da Carol.
    edges:
      - regiao_entrega -> frete_gratis_150
      - regiao_entrega -> recompra_90d
      - pedidos_2025 -> frete_gratis_150
      - pedidos_2025 -> recompra_90d
      - frete_gratis_150 -> sessoes_app_90d
      - sessoes_app_90d -> recompra_90d
      - frete_gratis_150 -> recompra_90d
      - frete_gratis_150 -> cupom_reativacao
      - recompra_90d -> cupom_reativacao
    answer:
      identifiable: true
      adjust_for: [pedidos_2025, regiao_entrega]
      do_not_adjust_for:
        sessoes_app_90d: É consequência do frete grátis e faz parte do efeito que se quer medir. Quem ganhou frete grátis abriu mais o app, e quem abre mais compra de novo.
        cupom_reativacao: Vem depois da recompra e é causado pela lista do frete grátis e pela própria recompra. Ajustar por ele cria uma associação falsa entre os dois.
      indifferent: [dia_semana_cadastro]
    note: A lista foi montada por região e por recorrência, que também preveem a recompra. As sessões no app são consequência; o cupom vem depois do resultado.
