    twin: pt_microcredito_oficina
    note: Igual ao gêmeo, com um fato trocado. A impressão do agente virou a coluna nota_organizacao, e com ela e a renda o efeito fica identificável.

  - id: pt_jornal_newsletter_alternada
    author: ai
    status: rascunho
    language: pt
    style: mensagem de Slack para o time de dados
    persona: gerente de assinaturas de um jornal regional, formada em jornalismo, sem formação em estatística
    theme: Assinaturas de jornal
    title: Newsletter da manhã e renovação da assinatura digital
    treatment: newsletter_manha
    outcome: renovou_12m
    columns:
      newsletter_manha: Inscrito automaticamente na newsletter Bom Dia no momento do cadastro, em março de 2025 (1 = sim, 0 = não).
      renovou_12m: Assinatura renovada no 12º mês (1 = sim, 0 = não).
      plano: Plano contratado no cadastro. digital ou digital_impresso.
      canal_aquisicao: Origem do cadastro. campanha_190 (promoção de R$ 1,90 no primeiro mês) ou organico.
      dias_app_90d: Número de dias com pelo menos uma abertura do app nos 90 dias após o cadastro.
      respondeu_pesquisa: Respondeu a pesquisa de satisfação enviada em abril de 2026 (1 = sim, 0 = não).
      id_assinante: Código do assinante no sistema de assinaturas.
    story: >-
      pessoal, preciso de uma mão com a análise da newsletter Bom Dia antes da reunião de
      quinta. contexto: em março do ano passado a gente testou inscrever automaticamente parte
      dos novos assinantes na newsletter. o Fábio fez na mão, pegou a lista de
      cadastros de março em ordem de data e foi alternando, um entra, o próximo não, até
      fechar o mês (deu 2.348 inscritos e 2.351 não). agora fechou 12 meses e eu quero saber
      se a newsletter mexeu na renovação. a base que eu exportei tem: se entrou na newsletter,
      se renovou no 12º mês, o plano (só digital ou digital+impresso), o canal de aquisição
      (campanha de R$ 1,90 ou cadastro orgânico), os dias com abertura do app nos primeiros
      90 dias, se respondeu a pesquisa de satisfação que mandamos em abril deste ano, e o id.
      detalhe que eu acho relevante: o link da newsletter abre dentro do app, então quem está
      inscrito abre o app bem mais, e a gente sabe de outros levantamentos que quem abre mais
      o app renova mais. e a pesquisa de satisfação foi mandada pela newsletter e por e-mail
      avulso, então inscrito respondeu muito mais; quem renovou também respondeu muito mais,
      obviamente, quem cancelou nem abre nosso e-mail. plano e canal pesam na renovação
      (impresso+digital renova mais, R$ 1,90 renova menos), isso a gente já sabe. a dúvida é
      só o que entra na comparação e o que não entra. pode ser pra quarta?
    edges:
      - newsletter_manha -> dias_app_90d
      - dias_app_90d -> renovou_12m
      - newsletter_manha -> renovou_12m
      - plano -> renovou_12m
      - canal_aquisicao -> renovou_12m
      - newsletter_manha -> respondeu_pesquisa
      - renovou_12m -> respondeu_pesquisa
    answer:
      identifiable: true
      adjust_for: []
      do_not_adjust_for:
        dias_app_90d: É consequência da newsletter e faz parte do efeito que se quer medir. Quem recebe a newsletter abre mais o app, e quem abre mais renova.
        respondeu_pesquisa: Foi medida depois da renovação e é causada pela newsletter e pela renovação. Ajustar por ela cria uma associação falsa entre as duas.
      indifferent: [plano, canal_aquisicao, id_assinante]
    note: A inscrição alternada na lista por ordem de cadastro vale como sorteio. Nada precisa ser ajustado; o uso do app e a pesquisa estragam a conta.

  - id: pt_ecommerce_provador_virtual
    author: ai
    status: rascunho
    language: pt
    style: página de wiki interna
    persona: gerente de e-commerce de uma marca de moda feminina de médio porte, formada em administração
    theme: E-commerce de moda
    title: Provador virtual e devolução em 30 dias
    treatment: usou_provador
    outcome: devolveu_30d
    columns:
      usou_provador: Cliente usou o provador virtual na página do produto antes de concluir o pedido (1 = sim, 0 = não).
      devolveu_30d: Item devolvido em até 30 dias após a entrega (1 = sim, 0 = não).
      categoria: Categoria do item. vestido, calca ou camiseta.
      compras_anteriores: Número de pedidos concluídos pela cliente antes deste, desde o cadastro.
      dispositivo: Dispositivo em que o pedido foi feito. app ou site.
      valor_item: Preço pago pelo item, em reais, sem frete.
      avaliou_produto: Cliente enviou avaliação do produto em resposta ao pedido de avaliação, disparado quando fecha a janela de devolução (1 = sim, 0 = não).
    not_in_table:
      inseguranca_tamanho: Insegurança da cliente quanto ao tamanho no momento da compra. Não é registrada em lugar nenhum.
    story: >-
      Provador virtual: o que sabemos até agora. Página mantida pelo time de e-commerce,
      atualizada em 22/09. Contexto. O provador virtual (a cliente informa altura, peso e o
      caimento que prefere e recebe a sugestão de tamanho) está no ar na página de produto
      desde fevereiro, para todas as clientes, em vestidos, calças e camisetas. Ninguém é
      obrigado a usar; o uso ficou em torno de 11% dos itens vendidos. A pergunta que o
      comercial faz toda semana é se o provador reduz devolução. Dados. Montamos uma base por
      item vendido de fevereiro a agosto com: uso do provador antes da compra, devolução em
      até 30 dias, categoria, número de compras anteriores da cliente, dispositivo, valor do
      item e se a cliente avaliou o produto. O que já observamos. O uso concentra em vestidos
      e calças, que são também as categorias com mais devolução por caimento; em camiseta
      quase ninguém usa. Cliente antiga, que já conhece a nossa modelagem, usa pouco o
      provador e devolve pouco. No app o botão fica abaixo da dobra e o uso é bem menor que
      no site. Peça mais cara volta mais, com ou sem provador. A avaliação do produto é pedida
      por e-mail quando fecha a janela de 30 dias de devolução, e quem usou o provador recebe
      um e-mail específico perguntando se o tamanho sugerido serviu, por isso avalia mais;
      quem devolveu quase nunca avalia. Ponto em aberto. A hipótese do time de produto é que a cliente que clica
      no provador é justamente a que está insegura com o tamanho, e essa cliente devolve mais
      com ou sem provador. Não temos nenhum registro dessa insegurança: não há pergunta no
      checkout e o provador não guarda o que a cliente digitou. Por isso a comparação simples
      (11,8% de devolução com provador contra 9,1% sem) não convence ninguém, e ainda não
      sabemos se alguma comparação convenceria.
    edges:
      - inseguranca_tamanho -> usou_provador
      - inseguranca_tamanho -> devolveu_30d
      - categoria -> usou_provador
      - categoria -> devolveu_30d
      - compras_anteriores -> usou_provador
      - compras_anteriores -> devolveu_30d
      - dispositivo -> usou_provador
      - valor_item -> devolveu_30d
      - usou_provador -> devolveu_30d
      - usou_provador -> avaliou_produto
      - devolveu_30d -> avaliou_produto
    answer:
      identifiable: false
      missing: [inseguranca_tamanho]
    note: A cliente escolhe usar o provador, e a insegurança que leva a usar também leva a devolver; não está na tabela. Categoria e compras anteriores são confusões reais, mas não bastam.

  - id: pt_mineradora_bloqueio_energia
    author: ai
    status: rascunho
    language: pt
    style: trecho de dissertação de mestrado
    persona: gerente de segurança do trabalho de uma mineradora de ferro, engenheiro, cursando mestrado profissional em engenharia de produção
    theme: Segurança do trabalho em mineração
    title: Reciclagem em bloqueio de energias e incidentes em doze meses
    treatment: treinamento_bloqueio
    outcome: incidente_12m
    columns:
      treinamento_bloqueio: Concluiu a reciclagem de 16 h em bloqueio e etiquetagem de energias perigosas no 1º trimestre de 2025 (1 = sim, 0 = não).
      incidente_12m: Envolvido em ao menos um incidente registrado, com ou sem afastamento, entre abril de 2025 e março de 2026 (1 = sim, 0 = não).
      area: Área de lotação em março de 2025. mina, usina ou manutencao.
      tempo_empresa: Tempo de casa em março de 2025, em anos completos.
      turno: Turno fixo em março de 2025. dia ou noite.
      relatos_quase_acidente: Número de relatos de quase-acidente abertos pelo empregado entre abril de 2025 e março de 2026.
      modulo_complementar: Convocado para o módulo complementar de 4 h realizado em abril de 2026 (1 = sim, 0 = não).
      matricula: Matrícula funcional do empregado.
    story: >-
      3.2 Base de dados e variáveis. A base reúne os 1.874 empregados próprios da unidade
      estudada, no Quadrilátero Ferrífero, ativos em março de 2025. A intervenção analisada é
      a reciclagem de 16 horas em bloqueio e etiquetagem de energias perigosas, realizada no
      primeiro trimestre de 2025 e concluída por 712 empregados. A reciclagem não foi
      oferecida a todos de uma vez: por decisão da gerência de operações, da qual o autor fez
      parte, a área de manutenção foi atendida primeiro, por intervir diretamente em
      equipamentos energizados, e, dentro de cada área, deu-se prioridade aos empregados com
      menos de dois anos de casa. A variável de resultado é o envolvimento em ao menos um
      incidente registrado, com ou sem afastamento, nos doze meses seguintes ao trimestre da
      reciclagem. Cabe notar que a manutenção concentra historicamente a maior taxa de
      incidentes da unidade e que empregados recém-admitidos se envolvem em mais ocorrências
      do que os veteranos, o que desaconselha a comparação direta entre treinados e não
      treinados. O turno noturno apresenta taxa de incidentes superior ao diurno, conforme os
      relatórios anuais da unidade. Registram-se ainda duas variáveis coletadas ao longo do
      período de observação. A primeira é o número de relatos de quase-acidente abertos pelo
      empregado nos doze meses: o conteúdo da reciclagem enfatiza o relato, e observou-se
      aumento expressivo entre os treinados; a literatura e a experiência da unidade indicam
      que o relato antecipa correções e reduz a ocorrência de incidentes. A segunda é a
      convocação para o módulo complementar de quatro horas, realizado em abril de 2026, ao
      término do período de observação: foram convocados todos os envolvidos em incidentes,
      por exigência do procedimento de investigação, e todos os que haviam concluído a
      reciclagem de 16 horas, da qual o módulo é continuação. A matrícula funcional foi
      mantida apenas como chave de identificação. O Quadro 3 descreve as variáveis.
    edges:
      - area -> treinamento_bloqueio
      - area -> incidente_12m
      - tempo_empresa -> treinamento_bloqueio
      - tempo_empresa -> incidente_12m
      - turno -> incidente_12m
      - treinamento_bloqueio -> relatos_quase_acidente
      - relatos_quase_acidente -> incidente_12m
      - treinamento_bloqueio -> incidente_12m
      - treinamento_bloqueio -> modulo_complementar
      - incidente_12m -> modulo_complementar
    answer:
      identifiable: true
      adjust_for: [area, tempo_empresa]
      do_not_adjust_for:
        relatos_quase_acidente: É consequência da reciclagem e faz parte do efeito que se quer medir. A reciclagem aumenta o relato, e o relato reduz incidentes.
        modulo_complementar: Foi registrado depois do período e é causado pela reciclagem e pelo incidente. Ajustar por ele cria uma associação falsa entre os dois.
      indifferent: [turno, matricula]
    note: Texto formal e longo. Área e tempo de casa decidiram quem foi treinado primeiro e preveem incidentes. Os relatos são consequência; a convocação vem depois do resultado.

  - id: pt_escola_tecnica_estagio
    author: ai
    status: rascunho
    language: pt
    style: nota interna curta
    persona: diretor de uma escola técnica estadual de uma cidade média de Minas Gerais, professor de eletrotécnica
    theme: Educação profissional
    title: Estágio pela parceria e emprego seis meses depois
    treatment: estagio_parceria
    outcome: empregado_6m
    columns:
      estagio_parceria: Fez estágio na empresa parceira durante o 3º ano, em 2024 (1 = sim, 0 = não).
      empregado_6m: Empregado com carteira assinada em junho de 2025, seis meses após o fim do 3º ano (1 = sim, 0 = não).
      media_2ano: Média geral do aluno ao fim do 2º ano (2023), de 0 a 10.
      curso: Curso técnico. eletrotecnica, informatica ou administracao.
      distancia_empresa: Distância da residência do aluno até a empresa parceira, em km.
      idade: Idade do aluno em março de 2024, em anos.
      frequencia_3ano: Percentual de presença do aluno nas aulas do 3º ano (2024).
      respondeu_egressos: Respondeu a pesquisa de egressos aplicada no fim de junho de 2025 (1 = sim, 0 = não).
    story: >-
      Nota para a Superintendência Regional sobre a parceria de estágio com a Metalúrgica
      Santa Rita. Em 2024, 63 alunos do 3º ano estagiaram na Santa Rita pela parceria; 148
      não estagiaram. A empresa pediu que a escola indicasse os melhores alunos, e a
      indicação seguiu a média do 2º ano. A parceria só abriu vagas para eletrotécnica e
      informática; administração ficou de fora. Alguns indicados recusaram porque a empresa
      fica na saída da BR e eles moram do outro lado da cidade. Em junho de 2025 levantamos
      quem estava empregado com carteira. Eletrotécnica emprega bem mais que os outros cursos
      aqui na região, e aluno com média alta se coloca com mais facilidade de qualquer forma;
      os mais velhos também, as empresas daqui preferem quem já fez 18. A empresa cobra
      presença dos estagiários, e isso apareceu na frequência do 3º ano; frequência baixa é o
      que mais pesa para o aluno não concluir e ficar sem emprego. A pesquisa de egressos foi
      aplicada no fim de junho: a Santa Rita nos ajudou a localizar os ex-estagiários, e quem
      estava empregado respondeu bem mais. Peço orientação de como comparar os dois grupos
      antes de levar o número para a reunião com a empresa.
    edges:
