# Casos simulados para TREINO, lote pt-16: oito casos em português do Brasil escritos
# como se fossem de uma pessoa (gerente de operações de um app de entregas, dono de uma
# rede de pet shops, coordenador de um programa de habitação municipal, gerente de uma
# concessionária de veículos, analista de BI de uma seguradora de saúde), cada um no
# estilo em que essa pessoa escreveria: e-mail longo com anexo descrito, pergunta em um
# fórum de analytics, transcrição de áudio informal, briefing para uma consultoria, ata
# de reunião.
#
# Escritos pelo assistente em 2026-10-07, no papel de cada pessoa, sem acesso às fichas de
# teoria. Idioma: pt. Status: rascunho (a aprovação é dada em outro lugar).
#
# Estes casos são TREINO (reforço com a nota do verificador), não teste. Nenhum deles
# repete os cenários do conjunto de teste congelado em cases/simulados/, nem variantes
# próximas. As setas ("causa -> efeito") declaram o diagrama que o texto, as descrições
# das colunas e o bom senso implicam; o verificador confere a resposta a partir delas
# (scripts/check_cases.py). Um caso errado ensina uma lição errada: por isso a resposta
# nunca é aceita sem a conferência.

cases:

  - id: pt_app_garantia_pico
    author: ai
    status: rascunho
    language: pt
    style: pergunta em um fórum de analytics
    persona: gerente de operações regional de um app de entregas, formado em administração, sabe fazer tabela dinâmica e nada além disso
    theme: Logística (app de entregas)
    title: Garantia de ganho mínimo e horas online dos entregadores
    treatment: grupo_garantia
    outcome: horas_online_teste
    columns:
      id_entregador: Identificador do entregador na plataforma.
      grupo_garantia: Entrou no grupo com garantia de ganho mínimo de R$ 25 por hora nas noites de sexta e sábado durante o teste de agosto de 2026 (1 = sim, 0 = não). Sorteio feito pelo sistema entre os entregadores ativos de Curitiba.
      horas_online_teste: Horas online nas quatro semanas do teste (agosto de 2026).
      horas_online_antes: Horas online nas quatro semanas anteriores ao teste (julho de 2026).
      modal: Veículo cadastrado (moto ou bicicleta).
      turnos_pico_teste: Número de turnos de pico (sexta e sábado, das 18h às 23h) em que o entregador ficou online durante as quatro semanas do teste.
      respondeu_pesquisa: Respondeu à pesquisa de satisfação enviada em setembro de 2026 (1 = sim, 0 = não). A pesquisa foi enviada ao grupo da garantia e aos entregadores com mais de 120 horas online no mês do teste.
    story: >-
      Título: teste A/B com entregadores, por quais colunas eu ajusto?

      Oi pessoal, sou de operações num app de entregas (não sou da área de dados, perdão
      se a pergunta for básica). Em agosto a gente rodou um teste em Curitiba: metade dos
      entregadores ativos, sorteada pelo sistema, passou a ter garantia de ganho mínimo
      de R$ 25 por hora nas noites de sexta e sábado; a outra metade seguiu no modelo
      normal. Quero saber se a garantia aumentou as horas online nas quatro semanas do
      teste.

      A base tem: id do entregador, se caiu no grupo da garantia, horas online nas 4
      semanas do teste, horas online nas 4 semanas anteriores, modal (moto ou bike),
      quantos turnos de pico (sex/sáb à noite) o entregador fez durante o teste e se
      respondeu a pesquisa de satisfação que mandamos em setembro.

      Alguns pontos. Quem tem moto roda bem mais hora que quem está de bike, isso é
      histórico. As horas de julho ajudam a prever as de agosto, claro, quem roda muito
      continua rodando muito. Os turnos de pico subiram bastante no grupo da garantia,
      era essa a ideia, e turno de pico puxa a hora online total pra cima. A pesquisa de
      setembro foi mandada pra todo mundo do grupo da garantia (pra ouvir o feedback) e
      pra quem rodou mais de 120 horas no mês, que são os que a gente trata como
      parceiros prioritários.

      Meu chefe quer uma regressão "com todas as colunas pra ficar mais robusto". Faz
      sentido? Ou eu só comparo as médias dos dois grupos?
    edges:
      - grupo_garantia -> turnos_pico_teste
      - turnos_pico_teste -> horas_online_teste
      - grupo_garantia -> horas_online_teste
      - horas_online_antes -> horas_online_teste
      - modal -> horas_online_teste
      - grupo_garantia -> respondeu_pesquisa
      - horas_online_teste -> respondeu_pesquisa
    answer:
      identifiable: true
      adjust_for: []
      do_not_adjust_for:
        turnos_pico_teste: Contados durante o teste e consequência da garantia. São o caminho pelo qual ela age sobre as horas; ajustar por eles apaga parte do efeito.
        respondeu_pesquisa: A pesquisa foi enviada ao grupo da garantia e a quem rodou muito. Depende do grupo e do resultado; ajustar por ela cria uma associação falsa entre a garantia e as horas.
      indifferent: [horas_online_antes, id_entregador, modal]
    note: >-
      Houve sorteio, então a comparação simples já dá o efeito. A armadilha é a
      regressão "com tudo": os turnos de pico são consequência da garantia e a pesquisa
      foi enviada em função do grupo e das horas.

  - id: pt_concessionaria_estendido_feeling
    author: ai
    status: rascunho
    language: pt
    style: e-mail longo com anexo descrito
    persona: gerente geral de uma concessionária de veículos em Campinas, vinte anos vendendo carro, formado em administração, nunca mexeu com estatística
    theme: Varejo automotivo (concessionária)
    title: Test drive estendido e compra em 90 dias, oferecido pelo feeling do vendedor
    twin: pt_concessionaria_estendido_sabado
    treatment: test_drive_estendido
    outcome: comprou_90d
    columns:
      id_lead: Identificador do lead no CRM da concessionária.
      test_drive_estendido: Fez o test drive estendido (levou o carro na sexta e devolveu na segunda) entre março e junho de 2026 (1 = sim, 0 = não).
      comprou_90d: Comprou um veículo novo na loja em até 90 dias após a primeira visita (1 = sim, 0 = não).
      tem_usado_troca: Declarou na primeira visita ter um veículo usado para dar na troca (1 = sim, 0 = não).
      faixa_versao: Faixa da versão de interesse registrada na primeira visita (entrada, intermediária ou topo).
      visita_sabado: A primeira visita à loja foi em um sábado (1 = sim, 0 = não).
      origem_lead: Origem do lead (site da marca, passagem na loja ou indicação).
      ligacao_acompanhamento: Recebeu ao menos uma ligação de acompanhamento do vendedor nos 90 dias após a primeira visita (1 = sim, 0 = não).
    not_in_table:
      impressao_vendedor: O "feeling" do vendedor sobre quão perto o lead está de fechar. Não é registrado no CRM.
    story: >-
      Assunto: dados do test drive estendido, pedido de ajuda na análise

      Prezada Carla, boa tarde.

      Conforme conversamos no encontro de concessionárias em agosto, segue em anexo a
      planilha do nosso piloto do test drive estendido, e peço a ajuda do seu time pra
      tirar uma conclusão honesta disso, porque aqui a gente só sabe fazer média.

      Contexto. De março a junho deste ano a loja passou a oferecer a alguns leads o
      test drive estendido: o cliente leva o carro na sexta e devolve na segunda. A ideia
      veio da regional e o custo não é pequeno (seguro, combustível, o carro parado no
      fim de semana). Dos 1.180 leads que entraram na loja no período, 143 fizeram o
      estendido. A pergunta da diretoria é se isso aumenta a conversão em 90 dias ou se
      a gente está só emprestando carro pra quem já ia comprar.

      Como foi oferecido. Aqui vai a parte que me incomoda: não teve regra. Cada vendedor
      oferecia pra quem ele sentia que estava mais perto de fechar, aquele feeling de
      quem vende carro há quinze anos, o cliente que volta duas vezes, que pergunta de
      prazo de entrega. Isso não fica registrado em lugar nenhum; o CRM só tem o que
      está na planilha. E, convenhamos, esse feeling acerta bastante: o cliente que o
      vendedor acha quente fecha mais, com ou sem fim de semana com o carro. Fora o
      feeling, dois critérios objetivos pesaram. Os vendedores priorizaram quem tinha
      usado pra dar na troca, porque o negócio fica maior, e só havia carro de
      demonstração disponível para as versões intermediária e topo, então lead de versão
      de entrada praticamente não recebeu a oferta.

      O anexo. A planilha "piloto_td_estendido.xlsx" tem uma linha por lead: id do lead,
      se fez o estendido, se comprou em até 90 dias (qualquer veículo novo, na nossa
      loja), se declarou ter usado pra troca na primeira visita, a faixa de versão de
      interesse (entrada, intermediária, topo), se a primeira visita foi num sábado, a
      origem do lead (site da marca, passagem na loja ou indicação) e se recebeu ligação
      de acompanhamento do vendedor nos 90 dias.

      Sobre essas colunas, pelo que conheço do negócio. Quem tem usado pra dar na troca
      fecha mais, porque o financiamento sai mais fácil. Lead de versão topo converte
      menos, demora mais pra decidir. Quem visita no sábado vem em família e normalmente
      já está mais decidido, fecha mais. Indicação converte muito mais que lead de site.
      A ligação de acompanhamento o vendedor faz pra todo mundo que levou o carro no fim
      de semana (pra combinar a devolução e sentir a temperatura) e faz também pra quem
      comprou, pra agendar a entrega e a primeira revisão; o resto do pessoal raramente
      recebe ligação.

      A média crua é 41% de conversão com estendido contra 17% sem. Eu não acredito nesse
      número. Dá pra chegar em algo mais honesto com o que tem na planilha? Se precisar
      de mais alguma coluna do CRM, eu puxo.

      Obrigado desde já,
      Ricardo Nunes
      Gerente geral
    edges:
      - impressao_vendedor -> test_drive_estendido
      - impressao_vendedor -> comprou_90d
      - tem_usado_troca -> test_drive_estendido
      - tem_usado_troca -> comprou_90d
      - faixa_versao -> test_drive_estendido
      - faixa_versao -> comprou_90d
      - visita_sabado -> comprou_90d
      - origem_lead -> comprou_90d
      - test_drive_estendido -> comprou_90d
      - test_drive_estendido -> ligacao_acompanhamento
      - comprou_90d -> ligacao_acompanhamento
    answer:
      identifiable: false
      missing: [impressao_vendedor]
    note: >-
      Os dois critérios objetivos (usado na troca, faixa de versão) estão na planilha,
      mas o terceiro motivo da oferta, o feeling do vendedor, não está em coluna nenhuma
      e também mexe na compra. A ligação de acompanhamento é consequência do estendido
      e da compra.

