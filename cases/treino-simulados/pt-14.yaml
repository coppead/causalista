# Casos simulados para TREINO, lote pt-14: oito casos em português do Brasil escritos como
# se fossem de uma pessoa (a dona de uma clínica odontológica com três unidades, o gerente
# de frota de uma locadora de carros, um síndico profissional, um analista de crédito de
# uma financeira de veículos, uma professora de pós-graduação em administração), cada um
# no estilo em que essa pessoa escreveria: transcrição de áudio informal, briefing para
# uma consultoria, e-mail para o chefe, ata de reunião, trecho de dissertação de mestrado.
#
# Escritos pelo assistente em 2026-10-07, no papel de cada pessoa, sem acesso às fichas de
# teoria. Idioma: pt.
#
# Estes casos são de TREINO (reforço: o modelo responde, o verificador dá a nota). Não
# são teste e não reutilizam os cenários do conjunto de teste congelado em
# cases/simulados/. As setas ("causa -> efeito") declaram o diagrama que o texto, as
# descrições das colunas e o bom senso implicam; o verificador confere a resposta a
# partir delas (scripts/check_cases.py). Status rascunho até a aprovação.

cases:

  - id: pt_odonto_sedacao_sem_questionario
    author: ai
    status: rascunho
    language: pt
    style: transcrição de áudio informal
    persona: dona de uma clínica odontológica com três unidades no Rio, dentista de formação, hoje só na gestão, mandando áudio para a sobrinha que faz mestrado em estatística
    theme: Saúde (odontologia, clínica particular)
    title: Sedação consciente e conclusão do plano de tratamento, sem registro da ansiedade
    twin: pt_odonto_sedacao_com_questionario
    treatment: sedacao_oxido
    outcome: concluiu_plano
    columns:
      id_paciente: Código do paciente no sistema da clínica.
      unidade: Unidade onde o plano de tratamento foi aberto (Barra, Centro ou Tijuca).
      n_procedimentos_plano: Quantidade de procedimentos previstos no plano de tratamento aprovado pelo paciente.
      sedacao_oxido: Fez as sessões do plano com sedação consciente por óxido nitroso (1 = sim, 0 = não).
      faltas_durante: Número de consultas do plano em que o paciente faltou sem avisar, contadas da aprovação do plano até a conclusão ou até completar seis meses.
      concluiu_plano: Concluiu todos os procedimentos do plano em até seis meses da aprovação (1 = sim, 0 = não).
      respondeu_pesquisa: Respondeu à pesquisa de satisfação enviada por WhatsApp seis meses depois da aprovação do plano (1 = sim, 0 = não).
    not_in_table:
      ansiedade_percebida: O quanto o paciente pareceu nervoso ao dentista nas primeiras consultas. Não é anotado em lugar nenhum.
    story: >-
      Oi Dani, tudo bem? Então, deixa eu te explicar o que eu queria que você olhasse, que eu
      sei que você mexe com esses dados aí no mestrado. A gente tem o óxido nitroso na Barra e
      na Tijuca desde 2024, no Centro não tem, o aparelho é caro e lá o espaço é pequeno. E a
      minha dúvida é se a sedação faz o paciente terminar o tratamento, porque o nosso problema
      número um é paciente que aprova o plano, faz dois, três procedimentos e some. Eu puxei do
      sistema todo mundo que aprovou plano em 2025, uns mil e duzentos pacientes, com a
      unidade, quantos procedimentos tinha no plano, se usou sedação, quantas vezes faltou sem
      avisar, se concluiu em seis meses e se respondeu a pesquisa de satisfação que a gente
      manda no WhatsApp depois dos seis meses. Agora, umas coisas que você precisa saber. Quem
      decide oferecer a sedação é o dentista: o paciente senta na cadeira, tá suando, agarrado
      no braço, o dentista oferece, e como a gente não cobra à parte quase todo mundo aceita.
      E paciente nervoso assim falta mais e abandona mais, isso eu te garanto, trinta anos de
      consultório. Os dentistas também oferecem mais quando o plano é longo, que o paciente
      vai ter que vir muitas vezes, e plano longo a pessoa termina menos mesmo, com sedação ou
      sem. Da unidade, o Centro tem muito paciente de passagem, gente que trabalha ali perto,
      muda de emprego e some; a Barra e a Tijuca são mais de bairro. Uma coisa que eu vi e
      fiquei bem contente: quem fez sedação faltou muito menos, e aí claro, quem falta menos
      termina mais. A pesquisa quem responde mais é quem terminou, e quem fez sedação também
      responde mais porque a gente pergunta da sedação especificamente, aí a pessoa se sente
      na obrigação. Dá pra tirar alguma coisa disso ou eu tô perdendo meu tempo? Me liga
      quando puder, beijo. Ah, esqueci: sobre o paciente nervoso, não tem questionário, não
      tem nada anotado, é o olho do dentista mesmo, cada um com o seu.
    edges:
      - ansiedade_percebida -> sedacao_oxido
      - ansiedade_percebida -> faltas_durante
      - ansiedade_percebida -> concluiu_plano
      - unidade -> sedacao_oxido
      - unidade -> concluiu_plano
      - n_procedimentos_plano -> sedacao_oxido
      - n_procedimentos_plano -> concluiu_plano
      - sedacao_oxido -> faltas_durante
      - faltas_durante -> concluiu_plano
      - sedacao_oxido -> concluiu_plano
      - sedacao_oxido -> respondeu_pesquisa
      - concluiu_plano -> respondeu_pesquisa
    answer:
      identifiable: false
      missing: [ansiedade_percebida]
    note: >-
      O dentista oferece a sedação a quem parece nervoso, e isso não está em coluna nenhuma.
      As faltas carregam parte da ansiedade, mas são consequência da sedação e não servem
      para ajustar. O gêmeo tem o questionário de ansiedade na tabela.

  - id: pt_odonto_sedacao_com_questionario
    author: ai
    status: rascunho
    language: pt
    style: transcrição de áudio informal
    persona: dona de uma clínica odontológica com três unidades no Rio, dentista de formação, hoje só na gestão, mandando áudio para a sobrinha que faz mestrado em estatística
    theme: Saúde (odontologia, clínica particular)
    title: Sedação consciente e conclusão do plano de tratamento, com o questionário de ansiedade
    twin: pt_odonto_sedacao_sem_questionario
    treatment: sedacao_oxido
    outcome: concluiu_plano
    columns:
      id_paciente: Código do paciente no sistema da clínica.
      unidade: Unidade onde o plano de tratamento foi aberto (Barra, Centro ou Tijuca).
      escala_ansiedade: Pontuação na escala de ansiedade odontológica de Corah, de 4 a 20, respondida pelo paciente na primeira consulta, antes de aprovar o plano.
      n_procedimentos_plano: Quantidade de procedimentos previstos no plano de tratamento aprovado pelo paciente.
      sedacao_oxido: Fez as sessões do plano com sedação consciente por óxido nitroso (1 = sim, 0 = não).
      faltas_durante: Número de consultas do plano em que o paciente faltou sem avisar, contadas da aprovação do plano até a conclusão ou até completar seis meses.
      concluiu_plano: Concluiu todos os procedimentos do plano em até seis meses da aprovação (1 = sim, 0 = não).
      respondeu_pesquisa: Respondeu à pesquisa de satisfação enviada por WhatsApp seis meses depois da aprovação do plano (1 = sim, 0 = não).
    story: >-
      Oi Dani, tudo bem? Então, deixa eu te explicar o que eu queria que você olhasse, que eu
      sei que você mexe com esses dados aí no mestrado. A gente tem o óxido nitroso na Barra e
      na Tijuca desde 2024, no Centro não tem, o aparelho é caro e lá o espaço é pequeno. E a
      minha dúvida é se a sedação faz o paciente terminar o tratamento, porque o nosso problema
      número um é paciente que aprova o plano, faz dois, três procedimentos e some. Eu puxei do
      sistema todo mundo que aprovou plano em 2025, uns mil e duzentos pacientes, com a
      unidade, a pontuação do questionário de ansiedade, quantos procedimentos tinha no plano,
      se usou sedação, quantas vezes faltou sem avisar, se concluiu em seis meses e se
      respondeu a pesquisa de satisfação que a gente manda no WhatsApp depois dos seis meses.
      Agora, umas coisas que você precisa saber. Desde 2024 todo paciente responde na primeira
      consulta aquele questionário de ansiedade de dentista, o de Corah, e a regra da clínica
      é oferecer a sedação pra quem pontua treze ou mais, e também em plano com mais de oito
      procedimentos, que o paciente vai ter que vir muitas vezes. Padronizei isso justamente
      pra não ficar no feeling de cada dentista, e eles seguem, eu confiro no sistema; como a
      gente não cobra à parte, quase todo mundo aceita. E paciente nervoso assim falta mais e
      abandona mais, isso eu te garanto, trinta anos de consultório. Plano longo a pessoa
      termina menos mesmo, com sedação ou sem. Da unidade, o Centro tem muito paciente de
      passagem, gente que trabalha ali perto, muda de emprego e some; a Barra e a Tijuca são
