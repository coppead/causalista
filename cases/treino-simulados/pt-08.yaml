# Casos simulados para TREINO, em português do Brasil: oito textos escritos como uma
# pessoa escreveria.
#
# Escritos pelo assistente em 2026-10-07, a pedido do André, no papel de cinco pessoas: o
# coordenador de um programa de habitação municipal, o gerente de uma loja de uma rede
# de eletrodomésticos, o gerente de um supermercado regional, uma analista de BI de uma
# seguradora de saúde e a coordenadora de um programa de microcrédito. Cada texto tem o
# estilo do canal em que a pessoa escreveria (nota interna, e-mail com anexo, áudio
# transcrito, relatório trimestral, Slack).
#
# Estes casos servem ao treino por reforço (o modelo responde, o verificador dá a nota).
# Não são texto de pessoas de verdade e não contam para a prova da seção 7. Os cenários
# evitam os do conjunto de teste congelado em cases/simulados/. As setas declaram o
# diagrama que o texto implica; o verificador confere a resposta a partir delas
# (scripts/check_cases.py). Status rascunho até a revisão.

cases:

  - id: pt_habitacao_casa_saudavel_digitado
    author: ai
    status: rascunho
    language: pt
    style: trecho de relatório trimestral
    persona: coordenador do programa de melhoria habitacional da Secretaria Municipal de Habitação de uma cidade de porte médio
    theme: Habitação municipal, reforma de telhado e banheiro e saúde respiratória infantil
    title: Reforma pelo Casa Saudável e atendimentos respiratórios, com o grau de umidade digitado
    twin: pt_habitacao_casa_saudavel_papel
    treatment: reforma
    outcome: atend_resp_12m
    columns:
      reforma: Domicílio recebeu a obra do Casa Saudável (troca do telhado, impermeabilização e reforma do banheiro) em 2025 (1 = sim, 0 = não).
      atend_resp_12m: >-
        Número de atendimentos de crianças de até 10 anos do domicílio nas UBS por queixa
        respiratória nos 12 meses seguintes ao término da obra (para os domicílios não
        atendidos, 12 meses a partir de julho de 2025). Fonte e-SUS, cruzado pelo CPF do
        responsável.
      grau_umidade: >-
        Grau de umidade e mofo atribuído pela assistente social na vistoria de 2024, antes
        da obra, de 0 (sem sinais) a 3 (mofo em cômodo de dormir). Digitado no SIGHAB.
      renda_pc: Renda familiar per capita declarada no CadÚnico na última atualização anterior a 2025, em reais.
      n_moradores: Número de moradores do domicílio no CadÚnico.
      ano_cadastro: Ano de inclusão da família no CadÚnico.
      visita_retorno: A equipe social voltou ao domicílio depois de julho de 2025 (1 = sim, 0 = não).
      nis_responsavel: Número de Identificação Social do responsável familiar.
    story: >-
      3.4 Programa Casa Saudável: avaliação de resultados. O Casa Saudável concluiu 412
      obras em 2025, em domicílios do CadÚnico com crianças de até 10 anos. Como relatado
      nos trimestres anteriores, a seleção seguiu os critérios aprovados pelo Conselho em
      2024: prioridade para os domicílios com grau de umidade 2 ou 3 na vistoria das
      assistentes sociais, para as famílias de menor renda per capita e para as de maior
      número de moradores; dentro de cada faixa de prioridade, atendemos primeiro os
      cadastros mais antigos, até esgotar o orçamento. Os 1.180 domicílios vistoriados e
      não atendidos formam o grupo de comparação. O cruzamento com o e-SUS, concluído em
      agosto com a Vigilância em Saúde, trouxe o número de atendimentos por queixa
      respiratória das crianças de cada domicílio nos 12 meses posteriores à obra. O
      resultado bruto é favorável: 1,9 atendimentos por domicílio atendido contra 2,6 nos
      não atendidos. A equipe pondera, contudo, que casa úmida, renda baixa e casa cheia
      adoecem mais as crianças, por si sós, e que esses foram justamente os critérios de
      seleção. O grau de umidade da vistoria foi digitado no SIGHAB junto com o cadastro,
      de modo que a base entregue ao Observatório da Cidade reúne, por domicílio, as três
      variáveis de seleção, o ano de cadastro, o indicador de saúde e dois campos
      administrativos: o NIS do responsável e o registro de visita de retorno da equipe
      social, que ocorre de ofício após a conclusão de cada obra e também quando a UBS
      aciona a Secretaria por criança com queixa respiratória recorrente. Solicitamos ao
      Observatório que indique por quais variáveis a comparação deve ser ajustada para que
      o efeito da obra sobre os atendimentos possa ser apresentado ao Conselho no próximo
      trimestre.
    edges:
      - grau_umidade -> reforma
      - grau_umidade -> atend_resp_12m
      - renda_pc -> reforma
      - renda_pc -> atend_resp_12m
      - n_moradores -> reforma
      - n_moradores -> atend_resp_12m
      - ano_cadastro -> reforma
      - reforma -> atend_resp_12m
      - reforma -> visita_retorno
      - atend_resp_12m -> visita_retorno
    answer:
      identifiable: true
      adjust_for: [grau_umidade, n_moradores, renda_pc]
      do_not_adjust_for:
        visita_retorno: >-
          Acontece depois da obra e depois dos atendimentos, e é consequência dos dois (a
          equipe volta após a obra e quando a UBS aciona). Ajustar por ela cria uma
          associação falsa entre a obra e os atendimentos.
      indifferent: [ano_cadastro, nis_responsavel]
    note: >-
      Os três critérios de seleção estão na base e cada um deles adoece as crianças por si
      só. O ano de cadastro só decide a ordem na fila. A visita de retorno é a armadilha:
      um campo administrativo que depende da obra e do resultado.

