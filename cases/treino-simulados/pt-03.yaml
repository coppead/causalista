    answer:
      identifiable: true
      adjust_for: [ocupacao_2024, vmd_pesados_2024]
      do_not_adjust_for:
        convenios_transportadoras: Foram assinados depois do pátio e por causa dele; é o caminho pelo qual o pátio enche quarto. Ajustar por eles apaga parte do efeito.
      indifferent: [cod_unidade, terreno_m2]
    note: >-
      Mesma reunião do caso irmão, com a contagem de veículos pesados na planilha. Com
      ela e a ocupação de 2024, a escolha do diretor fica toda em coluna. A área do
