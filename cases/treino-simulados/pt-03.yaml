# Casos de TREINO que simulam texto de pessoa, lote pt-03: oito casos em português do
# Brasil escritos como se fossem de uma pessoa (uma analista de marketing de editora de
# livros didáticos, um técnico de secretaria estadual de saúde, uma gerente regional de
# rede de hotéis de estrada, um coordenador de cooperativa de catadores, duas analistas
# de crédito de uma financeira de veículos), cada um no estilo em que essa pessoa
# escreveria: e-mail longo com anexo descrito, trecho de dissertação de mestrado, ata de
# reunião, transcrição de áudio informal, nota interna curta.
#
# Escritos pelo assistente em 2026-10-07, no papel de cada pessoa. Idioma: pt.
#
# Estes casos são material de TREINO (reforço com a nota do verificador), não teste.
# Não repetem nenhum cenário do conjunto de teste congelado em cases/simulados/ nem
# variante próxima dele. Status rascunho até revisão. As setas ("causa -> efeito")
# declaram o diagrama que o texto, as descrições das colunas e o bom senso implicam; o
# verificador confere a resposta a partir delas (scripts/check_cases.py).

cases:

  - id: pt_editora_exemplares
    author: ai
    status: rascunho
    language: pt
    style: e-mail longo com anexo descrito
    persona: analista de marketing de uma editora de livros didáticos, formada em publicidade, responsável pelos relatórios da campanha de adoção; sem formação em estatística
    theme: Editora de livros didáticos (marketing de adoção)
    title: Caixa de exemplares de divulgação e adoção para 2026
    treatment: recebeu_exemplares
    outcome: adotou_2026
    columns:
      cod_escola: Código da escola no CRM da editora.
      recebeu_exemplares: Recebeu a caixa de exemplares de divulgação da coleção de Fundamental II (livro do aluno dos quatro anos e livro do professor) entre maio e agosto de 2025 (1 = sim, 0 = não).
      adotou_2025: Adotou ao menos um título da editora para o ano letivo de 2025 (1 = sim, 0 = não).
      adotou_2026: Adotou ao menos um título da coleção para o ano letivo de 2026, conforme pedido registrado até 31/01/2026 (1 = sim, 0 = não).
      pediu_formacao: Solicitou a formação de professores oferecida pela editora entre dezembro de 2025 e fevereiro de 2026 (1 = sim, 0 = não).
      num_alunos: Alunos matriculados no Fundamental II, conforme cadastro do CRM atualizado em abril de 2025.
      regional: Regional comercial responsável pela escola (Sul, Sudeste, Centro-Oeste, Nordeste, Norte).
    not_in_table:
      afinidade_coordenacao: A relação do divulgador com a coordenação pedagógica da escola, se a coordenadora atende, abre a caixa e senta com ele. Cada divulgador sabe de cabeça; não há campo para isso no CRM.
    story: >-
      Oi, Renato, tudo bem?

      Conforme conversamos na quinta, segue em anexo a base da campanha de adoção 2026
      (arquivo base_adocao_2026.xlsx, aba "escolas", 1.874 linhas, uma por escola
      particular com Fundamental II na nossa carteira). Vou explicar o que tem lá e o
      que a gente precisa.

      Contexto: entre maio e agosto do ano passado mandamos a caixa de exemplares de
      divulgação da coleção nova (livro do aluno dos quatro anos mais o livro do
      professor) pra 612 escolas. A caixa custa caro, uns R$ 380 com frete, então cada
      divulgador tinha uma cota e escolhia pra quem mandar. A diretoria quer saber se a
      caixa fez diferença na adoção pra 2026, porque o orçamento de 2027 depende disso.

      O resultado cru é bonito: 41% de adoção entre quem recebeu a caixa contra 17%
      entre quem não recebeu. Só que eu já ouvi do Jorge (regional Sul) e da Cris
      (Nordeste) como eles escolheram, e fiquei com o pé atrás. Eles mandam primeiro
      pras escolas que já adotaram a gente em 2025, pra garantir a renovação, e pras
      escolas grandes, porque a cota é por caixa e não por aluno, então escola de 800
      alunos vale mais que uma de 120. E o Jorge foi sincero: ele manda caixa pra
      coordenadora que ele sabe que vai abrir e sentar com ele, aquela que atende o
      telefone dele há anos. Isso não tem como estar no sistema, é a cabeça do
      divulgador, mas é óbvio que essas coordenadoras adotam mais a gente, com ou sem
      caixa; aliás, já adotavam em 2025 por isso mesmo. Fora isso, escola que adotou em
      2025 tende a renovar, e escola grande tem mais turma, logo mais chance de pelo
      menos um título entrar.

      A cota também variou por regional: Norte e Nordeste tiveram menos caixas por
      escola porque têm menos divulgador em campo.

      Colunas da planilha: código da escola, se recebeu a caixa, se adotou em 2025, se
      adotou pra 2026 (pedido registrado até 31/01), número de alunos do Fundamental
      II, regional, e uma coluna que eu puxei do time de formação: se a escola pediu a
      formação de professores que a gente oferece de dezembro a fevereiro. Eu gosto
      desse dado, mas aviso que a formação é mais pedida por quem adotou (lógico, vão
      usar o livro) e também por quem recebeu a caixa, porque dentro da caixa vai o
      folheto da formação.

      Dá pra tirar daí um número honesto do efeito da caixa, ou a gente vai ter que
      fazer um teste em 2026, mandando caixa por sorteio em parte da carteira? Preciso
      de uma resposta até sexta, se der.

      Obrigada,
      Letícia
    edges:
      - afinidade_coordenacao -> recebeu_exemplares
      - afinidade_coordenacao -> adotou_2026
      - afinidade_coordenacao -> adotou_2025
      - adotou_2025 -> recebeu_exemplares
      - adotou_2025 -> adotou_2026
      - num_alunos -> recebeu_exemplares
      - num_alunos -> adotou_2026
      - num_alunos -> adotou_2025
      - regional -> recebeu_exemplares
      - recebeu_exemplares -> adotou_2026
      - recebeu_exemplares -> pediu_formacao
      - adotou_2026 -> pediu_formacao
    answer:
      identifiable: false
      missing: [afinidade_coordenacao]
    note: >-
      Os divulgadores mandaram a caixa para as coordenadoras que os atendem, e essa
      relação não está em coluna nenhuma. A adoção de 2025 carrega parte dela, mas não
      tudo. O pedido de formação vem depois da adoção e sobe com a caixa e com a adoção.

  - id: pt_saude_teleconsultoria
    author: ai
    status: rascunho
    language: pt
    style: trecho de dissertação de mestrado
    persona: técnico da área de regulação de uma secretaria estadual de saúde, enfermeiro, escrevendo a dissertação do mestrado profissional em saúde coletiva sobre o serviço de teleconsultoria
    theme: Saúde pública (secretaria estadual, atenção primária)
    title: Teleconsultoria na atenção primária e encaminhamentos ao ambulatório estadual
    treatment: aderiu_teleconsultoria
    outcome: encaminhamentos_2025
    columns:
      codigo_ibge: Código IBGE do município, com sete dígitos.
      aderiu_teleconsultoria: Município com ao menos uma equipe de atenção primária habilitada na plataforma estadual de teleconsultoria até 31 de março de 2025 (1 = sim, 0 = não).
      encaminhamentos_2025: Encaminhamentos de usuários do município ao ambulatório estadual de especialidades registrados no sistema de regulação entre abril e dezembro de 2025, por mil consultas médicas na atenção primária no mesmo período.
      encaminhamentos_2024: Mesmo indicador, calculado para o ano de 2024.
      cobertura_esf_2024: Cobertura populacional estimada da Estratégia Saúde da Família em dezembro de 2024, em percentual.
      distancia_capital_km: Distância rodoviária da sede do município à capital, em quilômetros.
      teleconsultorias_1000: Teleconsultorias solicitadas pelas equipes do município entre abril e dezembro de 2025, por mil consultas médicas na atenção primária no período (zero para os municípios não habilitados).
      rotatividade_medicos_2025: Proporção dos médicos da atenção primária do município que mudaram de equipe ou deixaram o município ao longo de 2025, segundo o CNES.
    story: >-
      4.2 Delineamento e fonte dos dados

      A implantação do serviço estadual de teleconsultoria não seguiu desenho
      experimental. A adesão foi voluntária e ocorreu em duas ondas, entre setembro de
      2024 e março de 2025, mediante termo assinado pelo gestor municipal e habilitação
      de ao menos uma equipe de atenção primária na plataforma. Até 31 de março de
      2025, 97 dos 223 municípios do estado haviam aderido.

      Importa descrever como se deu essa adesão, porque ela condiciona a leitura dos
      resultados. As coordenações regionais, por orientação da Superintendência de
      Regulação, concentraram o trabalho de sensibilização nos municípios com as
      maiores taxas de encaminhamento ao ambulatório estadual em 2024, entendidos como
      os que mais pressionavam a fila. Aderiram em maior proporção, ainda, os
      municípios mais distantes da capital, para os quais o deslocamento do usuário até
      o ambulatório representa custo elevado e o acesso remoto ao especialista é mais
      atraente, e os municípios com cobertura mais alta da Estratégia Saúde da Família,
      uma vez que o serviço exigia equipe completa e cadastrada. Essas três
      características guardam, por sua vez, relação própria com a taxa de
      encaminhamento: a cobertura da ESF está associada, na literatura e na série
      histórica do estado, a maior resolutividade e menor encaminhamento; a distância
      opera como barreira ao encaminhamento, independentemente de qualquer intervenção;
      e a taxa de 2024 reflete padrões locais de prática que se mantêm no ano seguinte.
      Cobertura e distância também explicam parte das próprias taxas de 2024.

      O mecanismo esperado do serviço é direto: ao discutir o caso com o especialista à
      distância, o médico da atenção primária resolve localmente parte do que antes
      encaminharia. Por isso o volume de teleconsultorias efetivamente solicitadas, por
      mil consultas, foi incluído na base como indicador de processo, ainda que ele
      seja, por definição, posterior e decorrente da habilitação. Registra-se, por fim,
      que 2025 foi um ano de alta rotatividade de médicos na atenção primária em
      diversos municípios, pelo encerramento de um ciclo do Mais Médicos; médicos
      recém-chegados tendem a encaminhar mais, e a rotatividade foi incluída na base
      por esse motivo.

      A base final tem uma linha por município (n = 223) e as variáveis descritas no
      Quadro 3. A questão que orienta a análise do capítulo 5 é a estimativa do efeito
      da adesão sobre a taxa de encaminhamentos de abril a dezembro de 2025.
    edges:
      - cobertura_esf_2024 -> aderiu_teleconsultoria
      - cobertura_esf_2024 -> encaminhamentos_2025
      - cobertura_esf_2024 -> encaminhamentos_2024
      - distancia_capital_km -> aderiu_teleconsultoria
      - distancia_capital_km -> encaminhamentos_2025
      - distancia_capital_km -> encaminhamentos_2024
      - encaminhamentos_2024 -> aderiu_teleconsultoria
      - encaminhamentos_2024 -> encaminhamentos_2025
      - aderiu_teleconsultoria -> teleconsultorias_1000
      - teleconsultorias_1000 -> encaminhamentos_2025
      - aderiu_teleconsultoria -> encaminhamentos_2025
      - rotatividade_medicos_2025 -> encaminhamentos_2025
    answer:
      identifiable: true
      adjust_for: [cobertura_esf_2024, distancia_capital_km, encaminhamentos_2024]
      do_not_adjust_for:
        teleconsultorias_1000: É posterior à habilitação e decorre dela; é o caminho pelo qual o serviço age. Ajustar por ela apaga parte do efeito.
      indifferent: [codigo_ibge, rotatividade_medicos_2025]
    note: >-
      Os três motivos da adesão estão na tabela. A armadilha é o indicador de processo,
      consequência da adesão; a rotatividade só mexe no resultado.

  - id: pt_hotel_patio_sem_contagem
    author: ai
    status: rascunho
    language: pt
    style: ata de reunião
    persona: gerente regional de uma rede de hotéis econômicos de beira de estrada com 46 unidades em quatro estados, que redige as atas das reuniões de gerência; formação em hotelaria
    theme: Hotelaria (rede de hotéis de estrada)
    title: Pátio vigiado para carretas e ocupação, sem a contagem de tráfego
    twin: pt_hotel_patio_com_contagem
    treatment: patio_carretas
    outcome: ocupacao_2025
    columns:
      cod_unidade: Código da unidade na rede, formado pela rodovia e um número sequencial.
      patio_carretas: Unidade recebeu o pátio vigiado 24 horas para carretas, inaugurado entre fevereiro e abril de 2025 (1 = sim, 0 = não).
      ocupacao_2025: Taxa de ocupação média da unidade de maio a dezembro de 2025, em percentual das unidades habitacionais disponíveis.
      ocupacao_2024: Taxa de ocupação média da unidade em 2024, mesmo critério.
      terreno_m2: Área total do terreno da unidade, em metros quadrados, conforme matrícula.
      convenios_transportadoras: Número de convênios com transportadoras assinados pela unidade entre maio e dezembro de 2025.
    not_in_table:
      movimento_carretas: O movimento de carretas no trecho de rodovia de cada unidade, como o diretor comercial o percebe nas viagens dele. A rede não tem contagem nenhuma.
    story: >-
      ATA – Reunião de gerentes regionais – 20/01/2026 – sala da diretoria, matriz.
      Presentes: Nelson (diretor comercial), Patrícia (controladoria), Fábio, Renata e
      eu (regionais). Ausente: Marcelo (regional Sul), justificado.

      Pauta 2 – Pátio de carretas: resultado de 2025 e decisão sobre expansão em 2026.

      Nelson apresentou o resumo: 17 das 46 unidades receberam o pátio vigiado 24h
      entre fevereiro e abril, investimento médio de R$ 410 mil por unidade. Ocupação
      média de maio a dezembro: 71% nas unidades com pátio contra 58% nas demais. Ele
      propõe estender para mais 12 unidades em 2026.

      Patrícia pediu cautela com a comparação. Lembrou que as 17 unidades não foram
      sorteadas: o Nelson escolheu pelo movimento de carreta que ele vê na estrada, de
      tanto rodar os trechos, e priorizou também unidades com terreno sobrando, pra
      fazer o pátio sem comprar área. Nelson confirmou e acrescentou que preferiu
      unidades que vinham com ocupação fraca em 2024, "pra dar um gás onde precisava".
      Patrícia observou que trecho com muita carreta é trecho com muito hóspede
      caminhoneiro, com ou sem pátio, e que isso já aparecia na ocupação de 2024
      dessas unidades; e que a ocupação de um ano puxa a do outro, cliente fixo volta.
      Sobre o movimento de carreta, confirmou-se que a rede não tem esse número em
      lugar nenhum: é a leitura do Nelson, e só.

      Renata comentou que as unidades com pátio fecharam convênios com transportadoras
      ao longo do ano (a Rota Sul fechou cinco), coisa que não acontecia antes porque
      a transportadora exige vaga segura pra carreta; convênio enche quarto de segunda
      a quinta. Nelson concordou que foi por aí que o pátio funcionou.

      Encaminhamentos:
      1. Patrícia envia ao BI a planilha por unidade (código, pátio, ocupação 2025 e
      2024, área do terreno, número de convênios) e pede uma estimativa do efeito do
      pátio na ocupação, com a ressalva acima.
      2. Decisão sobre expansão adiada para a reunião de fevereiro.
      3. Fábio verifica com a concessionária se existe contagem de veículos pesados por
      trecho.

      Redigido por Cláudia (regional Centro-Oeste).
    edges:
      - movimento_carretas -> patio_carretas
      - movimento_carretas -> ocupacao_2025
      - movimento_carretas -> ocupacao_2024
      - ocupacao_2024 -> patio_carretas
      - ocupacao_2024 -> ocupacao_2025
      - terreno_m2 -> patio_carretas
      - patio_carretas -> convenios_transportadoras
      - convenios_transportadoras -> ocupacao_2025
      - patio_carretas -> ocupacao_2025
    answer:
      identifiable: false
      missing: [movimento_carretas]
    note: >-
      O diretor escolheu as unidades pelo movimento de carretas que ele vê, e a rede
      não tem esse número. A ocupação de 2024 carrega parte dele, mas não tudo. Os
      convênios são consequência do pátio.

