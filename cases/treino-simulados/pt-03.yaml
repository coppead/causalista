  - id: pt_catadores_carrinho
    author: ai
    status: rascunho
    language: pt
    style: transcrição de áudio informal
    persona: coordenador de uma cooperativa de catadores de materiais recicláveis com 120 cooperados, ele mesmo catador há vinte anos, mandando áudio para a professora da universidade que ajuda a cooperativa com as planilhas
    theme: Reciclagem (cooperativa de catadores)
    title: Carrinho elétrico e material entregue no galpão
    treatment: carrinho_eletrico
    outcome: kg_mes_abr_set
    columns:
      id_cooperado: Número do cooperado no livro de matrícula da cooperativa.
      carrinho_eletrico: Recebeu um dos carrinhos elétricos doados pela prefeitura, entregues em março de 2026 (1 = sim, 0 = não).
      kg_mes_abr_set: Média mensal de material entregue e pesado no galpão da cooperativa entre abril e setembro de 2026, em kg.
      kg_mes_2025: Média mensal de material entregue no galpão em 2025, em kg.
      viagens_dia: Média de viagens ao galpão por dia trabalhado entre abril e setembro de 2026, conforme anotação da portaria.
      idade: Idade em março de 2026, em anos.
      anos_coop: Anos como cooperado até março de 2026.
      conferencia_pesagem: Teve ao menos uma entrega repesada na balança pequena entre abril e setembro de 2026 (1 = sim, 0 = não).
    story: >-
      [áudio, 3 min 12 s]

      Oi, professora, boa tarde, é o Edmilson aqui da cooperativa. Então, é sobre
      aquela planilha dos carrinhos que a Jéssica montou pra senhora. Deixa eu explicar
      como foi, que eu acho que a senhora precisa saber disso pra fazer a conta.

      A prefeitura doou quarenta carrinho elétrico pra gente em março, e nós temos
      noventa e cinco cooperado que trabalha na rua, o resto fica no galpão na triagem.
      Como não dava pra todo mundo, a gente fez sorteio na assembleia, papelzinho no
      saco mesmo, com o pessoal da prefeitura olhando. Todo mundo da rua entrou,
      ninguém ia recusar carrinho de graça, né. Então quem pegou carrinho foi pura
      sorte, não teve escolha de ninguém.

      O que a gente quer saber é se o carrinho aumentou o material que o pessoal traz
      pro galpão. A planilha tem os noventa e cinco da rua, e pra cada um a Jéssica
      botou a média de quilo por mês de abril a setembro deste ano, a média de 2025
      inteiro pra comparar, a idade, e quantos anos a pessoa tem de cooperativa. Isso
      importa porque os mais velhos puxam menos, o corpo não aguenta, e quem tá há mais
      tempo tem os ponto certo, os prédio que guardam material pra ele, então traz
      mais.

      Tem duas coisa que eu queria avisar. Uma é que a portaria anota quantas viagem
      cada um faz por dia, e quem tá de carrinho elétrico tá fazendo muito mais viagem,
      porque não cansa, volta no galpão, descarrega e sai de novo. E mais viagem é mais
      quilo, lógico. A Jéssica botou isso na planilha também. A outra é a coluna da
      repesagem: a dona Neide confere de novo na balança pequena quem tá com carrinho
      novo, porque a prefeitura pede relatório certinho desse pessoal, e confere também
      qualquer um que chega com muito acima do normal dele, pra não ter conversa de que
      tá misturando material de fora. Então essa coluna marca quem foi repesado pelo
      menos uma vez.

      Na conta grossa deu 1.340 quilo por mês pra quem tem carrinho e 870 pra quem não
      tem. A senhora acha que esse número tá certo ou tem que mexer em alguma dessas
      colunas? É que a prefeitura quer saber se vale comprar mais quarenta pro ano que
      vem. Valeu, professora, um abraço.
    edges:
      - carrinho_eletrico -> viagens_dia
      - viagens_dia -> kg_mes_abr_set
      - carrinho_eletrico -> kg_mes_abr_set
      - kg_mes_2025 -> kg_mes_abr_set
      - idade -> kg_mes_abr_set
      - idade -> kg_mes_2025
      - anos_coop -> kg_mes_abr_set
      - anos_coop -> kg_mes_2025
      - carrinho_eletrico -> conferencia_pesagem
      - kg_mes_abr_set -> conferencia_pesagem
      - kg_mes_2025 -> conferencia_pesagem
    answer:
      identifiable: true
      adjust_for: []
      do_not_adjust_for:
        viagens_dia: Foi anotada depois da entrega dos carrinhos e é consequência deles; é por aí que o carrinho rende mais quilo. Ajustar por ela apaga parte do efeito.
        conferencia_pesagem: A repesagem é feita em quem tem carrinho novo e em quem trouxe muito acima do normal, ou seja, depende do carrinho e do próprio resultado. Ajustar por ela cria uma associação falsa entre o carrinho e o material entregue.
      indifferent: [anos_coop, id_cooperado, idade, kg_mes_2025]
    note: >-
      Houve sorteio entre todos os catadores de rua, então a comparação simples já dá
      o efeito. As armadilhas são as viagens por dia, consequência do carrinho, e a
      repesagem, que depende do carrinho e do quilo entregue.

  - id: pt_financeira_vistoria
    author: ai
    status: rascunho
    language: pt
    style: nota interna curta
    persona: analista de crédito sênior de uma financeira de veículos usados, escrevendo uma nota rápida ao gerente de risco; formação em administração
    theme: Crédito (financeira de veículos)
    title: Vistoria presencial e atraso de 90 dias
    treatment: vistoria_presencial
    outcome: atraso_90d
    columns:
      num_proposta: Número da proposta no sistema de crédito.
      score_bureau: Score do cliente no bureau de crédito na data da proposta, de 0 a 1000.
      vistoria_presencial: Proposta passou por vistoria presencial do veículo pela empresa parceira antes da liberação do contrato (1 = sim, 0 = não). Contratos liberados entre fevereiro e julho de 2025.
      atraso_90d: Contrato atingiu 90 dias de atraso em alguma parcela nos 12 meses seguintes à liberação (1 = sim, 0 = não).
      entrada_pct: Valor da entrada sobre o valor do veículo, em percentual.
      idade_veiculo: Idade do veículo na data da proposta, em anos.
      dia_semana_proposta: Dia da semana em que a proposta foi digitada pela loja.
    not_in_table:
      desconfianca_analista: A desconfiança do analista com a proposta, formada no telefonema de confirmação e na leitura dos documentos. Fica na cabeça do analista; o sistema só registra se a vistoria foi pedida.
    story: >-
      Rogério,

      Sobre a sua pergunta de ontem, se a vistoria presencial "paga o custo". Puxei os
      6.212 contratos liberados de fevereiro a julho de 2025: 2,9% de atraso de 90 dias
      entre os que tiveram vistoria contra 6,1% entre os que não tiveram. Mas antes de
      levar isso pro comitê: a vistoria era pedida por regra pra carro com mais de 10
      anos e pra entrada abaixo de 20%, e fora da regra ficava a critério da mesa,
      quando a proposta cheirava mal no telefonema de confirmação ou na documentação.
      Esse faro do analista não vira campo nenhum no sistema, e a gente sabe que ele
      acerta: proposta que cheira mal atrasa mais. Carro velho e entrada baixa também
      atrasam mais, isso o modelo de score já mostra, e o score em si segue sendo o que
      melhor separa quem paga. Na base tem o número da proposta, se teve vistoria, o
      atraso, o score na data, a entrada em %, a idade do carro e o dia da semana em
      que a loja digitou a proposta. Consigo um número limpo com isso ou não?

      Marina
    edges:
      - desconfianca_analista -> vistoria_presencial
      - desconfianca_analista -> atraso_90d
      - idade_veiculo -> vistoria_presencial
      - idade_veiculo -> atraso_90d
      - entrada_pct -> vistoria_presencial
      - entrada_pct -> atraso_90d
      - score_bureau -> atraso_90d
      - vistoria_presencial -> atraso_90d
    answer:
      identifiable: false
      missing: [desconfianca_analista]
    note: >-
      As regras da vistoria (idade do carro, entrada) estão na tabela; o critério da
      mesa, o faro do analista, não está, e ele também prevê o atraso. O score só mexe
      no atraso.

  - id: pt_financeira_debito_automatico
    author: ai
    status: rascunho
    language: pt
    style: transcrição de áudio informal
    persona: analista de crédito de uma financeira de veículos, mandando áudio no WhatsApp para a colega do BI; fala rápido, com o jargão da área
    theme: Crédito (financeira de veículos)
    title: Débito automático na assinatura e atraso de 60 dias
    treatment: debito_automatico
    outcome: atraso_60d
    columns:
      num_contrato: Número do contrato de financiamento.
      debito_automatico: Cliente aderiu ao débito automático das parcelas no momento da assinatura do contrato (1 = sim, 0 = não). Contratos assinados entre março e agosto de 2025.
      atraso_60d: Alguma parcela com 60 dias ou mais de atraso nos 12 meses seguintes à assinatura (1 = sim, 0 = não).
      ligacoes_cobranca: Número de ligações da central de cobrança ao cliente nos 12 meses seguintes à assinatura. Inclui a ligação de boas-vindas que a central faz, no primeiro mês, a todo cliente com débito automático, para confirmar os dados bancários.
      score_bureau: Score do cliente no bureau de crédito na data da proposta, de 0 a 1000.
      regiao_loja: Região da loja onde o contrato foi assinado (capital, interior ou litoral).
      valor_parcela: Valor da parcela mensal, em reais.
    story: >-
      [áudio 2:10]

      Lu, bom dia, deixa eu te passar o contexto daquela base do débito automático que
      eu te mandei ontem, que você perguntou. Ó, o sistema novo de formalização, aquele
      que oferece o débito automático na hora da assinatura, entrou nas lojas do
      interior em março, na capital só em junho e no litoral em setembro, então no
      período da base, março a agosto, a maioria dos clientes que teve a opção é do
      interior. E aí você já sabe o que eu vou dizer: interior sempre atrasou menos que
      capital, é histórico nosso, independe de qualquer coisa. E mesmo onde tinha a
      opção, quem topou o débito automático foi mais o cliente de score alto, que tem
      conta em banco grande e não tem medo de deixar debitar; cliente de score baixo
      quase sempre recusou. Score alto paga melhor, isso você sabe. A parcela eu deixei
      na base porque parcela pesada atrasa mais, mas ela não influenciou em nada quem
      aderiu. E tem a coluna das ligações da cobrança, que é o número de ligações que a
      central fez pro cliente no ano; a central liga pra quem passa de quinze dias de
      atraso, é o fluxo padrão. Tá tudo no dicionário que eu mandei junto. A pergunta
      do gerente é só uma: o débito automático reduz o atraso de sessenta dias ou é o
      perfil do cliente que tá fazendo a diferença? Vê aí pra mim quais colunas você
      usaria no ajuste. Valeu.
    edges:
      - regiao_loja -> debito_automatico
      - regiao_loja -> atraso_60d
      - score_bureau -> debito_automatico
      - score_bureau -> atraso_60d
      - valor_parcela -> atraso_60d
      - debito_automatico -> atraso_60d
      - debito_automatico -> ligacoes_cobranca
      - atraso_60d -> ligacoes_cobranca
    answer:
      identifiable: true
      adjust_for: [regiao_loja, score_bureau]
      do_not_adjust_for:
        ligacoes_cobranca: Contadas depois, sobem com o atraso (fluxo de cobrança) e com o débito automático (ligação de boas-vindas, dita só no dicionário). Ajustar por elas cria uma associação falsa entre o débito automático e o atraso.
      indifferent: [num_contrato, valor_parcela]
    note: >-
      A região e o score explicam quem aderiu e quem atrasa. A armadilha está no
      dicionário: a central também liga para todo cliente com débito automático, então
      as ligações dependem da intervenção e do resultado.

  - id: pt_saude_carreta_mamografia
    author: ai
    status: rascunho
    language: pt
    style: nota interna curta
    persona: técnico da coordenação de atenção à saúde da mulher de uma secretaria estadual de saúde, escrevendo um despacho curto para a coordenadora; formação em enfermagem
    theme: Saúde pública (secretaria estadual, rastreamento)
    title: Carreta da mamografia e exames de rastreamento
    treatment: carreta_2025
    outcome: mamografias_100_2025
    columns:
      carreta_2025: Município recebeu a unidade móvel de mamografia (carreta) por ao menos uma semana em 2025 (1 = sim, 0 = não).
      campanha_radio: Município veiculou campanha em rádio local para a chegada da carreta, conforme relato da coordenação regional (1 = sim, 0 = não).
      mamografias_100_2025: Mamografias de rastreamento realizadas em 2025 em mulheres residentes de 50 a 69 anos, por 100 mulheres dessa faixa etária, segundo o SISCAN.
      mamografias_100_2024: Mesmo indicador, para 2024.
      tem_mamografo: Município possui mamógrafo fixo em serviço habilitado pelo SUS, segundo o CNES de dezembro de 2024 (1 = sim, 0 = não).
    story: >-
      Despacho à coordenadora – 03/02/2026

      Lúcia, o levantamento da carreta para a prestação de contas: em 2025 ela passou
      por 61 dos 223 municípios, primeiro nos sem mamógrafo fixo e, depois, nos de
      cobertura mais baixa em 2024 (quem tem mamógrafo rastreia mais em qualquer ano, e
      cobertura baixa num ano segue baixa no outro). O indicador subiu 9 pontos onde a
      carreta passou, 2 onde não passou. Em vários lugares a prefeitura anunciou a
      carreta no rádio e a agenda lotou em dois dias. Planilha e dicionário em anexo,
      uma linha por município. Dá para afirmar quanto desse aumento é da carreta?

      Hugo
    edges:
      - tem_mamografo -> carreta_2025
      - tem_mamografo -> mamografias_100_2025
      - tem_mamografo -> mamografias_100_2024
      - mamografias_100_2024 -> carreta_2025
      - mamografias_100_2024 -> mamografias_100_2025
      - carreta_2025 -> campanha_radio
      - campanha_radio -> mamografias_100_2025
      - carreta_2025 -> mamografias_100_2025
    answer:
      identifiable: true
      adjust_for: [mamografias_100_2024, tem_mamografo]
      do_not_adjust_for:
        campanha_radio: A campanha foi feita para a chegada da carreta, como diz o dicionário; é consequência dela e parte do efeito. Ajustar por ela apaga parte do efeito.
    note: >-
      Os dois critérios do roteiro estão na tabela. A campanha de rádio só existe onde a
      carreta foi, e o dicionário é que diz isso com clareza.
