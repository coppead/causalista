# Casos simulados para TREINO, em português do Brasil: oito textos escritos como uma
# pessoa escreveria, para o modelo responder durante o treino por reforço (o verificador
# dá a nota; o modelo não vê a resposta).
#
# Escritos pelo assistente em 2026-10-07, a pedido do André, no papel de cinco pessoas: o
# coordenador de uma cooperativa de catadores, o gerente de uma rede de hotéis de estrada,
# a diretora de um museu municipal, a gerente de RH de um call center e uma analista de
# marketing de uma editora de livros didáticos. Cada texto tem o estilo do canal em que a
# pessoa escreveria (WhatsApp, Slack, wiki interna, nota interna, relatório trimestral).
#
# Estes casos NÃO fazem parte do teste congelado de cases/simulados/: os cenários são
# outros, e nada daqui pode ser usado para medir o modelo. O diagrama (edges) e a resposta
# são do autor; o verificador confere a resposta contra o diagrama
# (scripts/check_cases.py). Status: rascunho até revisão.

cases:

  - id: pt_catadores_carrinho_escolhido
    author: ai
    status: rascunho
    language: pt
    style: mensagem de WhatsApp
    persona: coordenador de uma cooperativa de catadores de material reciclável
    theme: Cooperativa de reciclagem
    title: Carrinhos elétricos escolhidos pela coordenação
    treatment: carrinho_eletrico
    outcome: kg_mes
    columns:
      carrinho_eletrico: Recebeu um dos oito carrinhos elétricos doados pela prefeitura em abril (1 = sim, 0 = não).
      kg_mes: Quilos de material entregues no galpão por mês, média de maio a agosto, pela ficha de pesagem.
      dias_trabalhados: Dias por mês com pesagem registrada no nome do cooperado, média de maio a agosto.
      anos_coop: Anos como cooperado, contados até março.
      rota: Região da rota de coleta do cooperado (centro, zona norte, orla).
      idade: Idade em anos.
      num_ficha: Número da ficha do cooperado no caderno de pesagem.
    not_in_table:
      disposicao: O empenho de cada cooperado (chegar cedo, sair todo dia), que a coordenação viu "no olho" para escolher quem recebia carrinho. Não é anotado em lugar nenhum.
    story: >-
      Oi Lu, tudo bem? Então, lembra dos 8 carrinhos elétricos que a prefeitura doou em
      abril? A diretoria quer saber se valeu a pena, pq tem mais 10 pra vir e o vereador
      quer número. Montei a planilha com a ficha de pesagem de todo mundo, maio a agosto,
      37 cooperados. Quem ficou com carrinho fui eu e a Dona Cida que escolhemos, a gente
      deu pros que estavam mais na pegada, que a gente via chegando cedo e saindo todo dia,
      e esse pessoal junta mais quilo de qualquer jeito, né. Isso não tem anotado em lugar
      nenhum, foi no olho mesmo. Com o carrinho o pessoal passou a sair mais dias na
      semana, dá pra ver nas pesagens, e saindo mais dia junta mais quilo, óbvio. Tem a
      rota também, a turma da orla pega muito mais pet, por causa dos quiosques, e quem tem
      mais tempo de coop conhece os pontos bons. Os mais velhos rendem menos, a gente sabe.
      Dá pra vc me dizer se o carrinho aumentou os quilos? Fiquei com essa pulga atrás da
      orelha.
    edges:
      - disposicao -> carrinho_eletrico
      - disposicao -> dias_trabalhados
      - disposicao -> kg_mes
      - carrinho_eletrico -> dias_trabalhados
      - dias_trabalhados -> kg_mes
      - carrinho_eletrico -> kg_mes
      - anos_coop -> kg_mes
      - rota -> kg_mes
      - idade -> kg_mes
    answer:
      identifiable: false
      missing: [disposicao]
    twin: pt_catadores_carrinho_sorteio
    note: >-
      A coordenação escolheu quem recebia pelo empenho que via, e o empenho também faz
      juntar mais quilo; não está na tabela. Os dias trabalhados são consequência do
      carrinho e não servem de ajuste.

