# Casos simulados para TREINO, em português do Brasil: oito textos escritos como uma pessoa
# escreveria. Arquivo pt-02.
#
# Escritos pelo assistente em 2026-10-07, a pedido do André, no papel de cinco pessoas: uma
# analista de BI de uma seguradora de saúde, o diretor de uma escola técnica estadual, a
# coordenadora de um programa de microcrédito, uma gerente de RH de um call center e um
# síndico profissional de condomínios. Estilos: ata de reunião, pergunta em fórum de
# analytics, briefing para uma consultoria, mensagem de WhatsApp e página de wiki interna.
#
# Estes casos servem ao treino por reforço (o modelo responde, o verificador dá a nota;
# nada mais é mostrado a ele). Não são o teste da seção 7: nenhum cenário do teste
# congelado (cases/simulados/) se repete aqui, nem variante próxima. As setas declaram o
# diagrama que o texto implica; o verificador confere a resposta a partir delas
# (scripts/check_cases.py). Status rascunho até revisão.

cases:

  - id: pt_seguradora_vacina_gripe
    author: ai
    status: rascunho
    language: pt
    style: página de wiki interna
    persona: analista de BI de uma seguradora de saúde, que documenta as bases do time
    theme: Seguradora de saúde, campanha de vacinação contra gripe
    title: Vacinação na campanha e sinistro respiratório no inverno
    treatment: vacinou_campanha
    outcome: sinistro_resp_inverno
    columns:
      vacinou_campanha: Tomou a vacina da gripe na campanha de abril/maio de 2026, no posto da empresa ou com o voucher (1 = sim, 0 = não).
      sinistro_resp_inverno: Teve pelo menos uma guia com CID principal respiratório (capítulo J) entre 01/06 e 31/08/2026 (1 = sim, 0 = não).
      idade: Idade em anos em 01/04/2026.
      cronico: Condição crônica (asma, DPOC, diabetes ou cardiopatia) identificada nas guias dos 24 meses anteriores a abril/2026 (1 = sim, 0 = não).
      posto_no_local: A empresa do beneficiário cedeu uma sala e recebeu posto de vacinação no local (1 = sim; 0 = a empresa recebeu vouchers).
      respondeu_pesquisa_set: >-
        Respondeu à pesquisa de satisfação de setembro/2026 (1 = sim, 0 = não respondeu ou
        não recebeu). A pesquisa foi enviada a quem participou da campanha de vacinação e a
        quem teve alguma utilização do plano entre junho e agosto.
      id_beneficiario: Identificador interno do beneficiário.
    story: >-
      Base bi_saude.vacina_gripe_2026. Uma linha por beneficiário de plano empresarial ativo
      em 01/04/2026 (412 mil linhas). Última atualização em 02/10/2026, por mim (Camila).
      Dúvidas no canal #bi-sinistro.

      Contexto. A campanha de vacinação contra gripe foi em abril e maio de 2026, em parceria
      com as empresas clientes. Nas empresas que cederam uma sala montamos posto de vacinação
      no local; nas outras mandamos voucher para a rede de farmácias, e a adesão com voucher
      foi bem menor (11% contra 46%). Dentro de cada empresa, aderiram mais os beneficiários
      mais velhos e os que têm condição crônica, até porque a comunicação da campanha foi
      dirigida a esses dois grupos. São também os grupos que mais abrem sinistro respiratório
      no inverno, com ou sem vacina.

      Para que serve. A pergunta padrão da Diretoria Técnica é se a vacinação na campanha
      reduz o sinistro respiratório entre junho e agosto. A flag de sinistro respiratório já
      vem calculada a partir do CID principal da guia, não precisa refazer.

      Cuidados. As colunas vêm de três fontes (cadastro, autorização de guias e a pesquisa de
      setembro), cada uma com o seu período; antes de usar uma coluna, confira no dicionário a
      que período ela se refere. Houve pedidos para incluir a pesquisa de setembro como
      "indicador de engajamento" nas comparações; o dicionário diz como ela foi aplicada.
    edges:
      - idade -> vacinou_campanha
      - idade -> sinistro_resp_inverno
      - cronico -> vacinou_campanha
      - cronico -> sinistro_resp_inverno
      - posto_no_local -> vacinou_campanha
      - vacinou_campanha -> sinistro_resp_inverno
      - vacinou_campanha -> respondeu_pesquisa_set
      - sinistro_resp_inverno -> respondeu_pesquisa_set
    answer:
      identifiable: true
      adjust_for: [cronico, idade]
      do_not_adjust_for:
        respondeu_pesquisa_set: Foi aplicada em setembro a quem se vacinou e a quem usou o plano no inverno. Depende da vacinação e do próprio sinistro; ajustar por ela cria uma associação falsa entre os dois.
      indifferent: [id_beneficiario, posto_no_local]
    note: >-
      A pesquisa de setembro é o laço. A história só diz que ela existe e manda ler o
      dicionário; é lá que está escrito que ela foi enviada a quem se vacinou e a quem usou o
      plano. O posto no local só mexe na adesão.

  - id: pt_etec_monitores_professores
    author: ai
    status: rascunho
    language: pt
    style: ata de reunião
    persona: diretor de escola técnica estadual, que redige as atas do conselho escolar
    theme: Educação técnica, programa de monitores de laboratório
    title: Monitores escolhidos pelos professores e emprego seis meses depois
    twin: pt_etec_monitores_sorteio
    treatment: monitor
    outcome: empregado_6m
    columns:
      monitor: Foi selecionado como monitor de laboratório em 2025 (1 = sim, 0 = não). A base tem só os alunos que se inscreveram no programa.
      empregado_6m: Estava empregado na área do curso em junho/2026, segundo a ligação de acompanhamento de egressos da secretaria (1 = sim, 0 = não).
      turno: Turno do aluno no 2º ano (M = manhã, N = noite).
      curso: Curso técnico (MEC = Mecatrônica, INF = Informática, EDF = Edificações).
      media_1ano: Média geral do 1º ano (2024), de 0 a 10.
      idade: Idade em anos em 01/02/2025.
      cadastro_banco_vagas: Cadastrou currículo no banco de vagas da escola entre agosto e dezembro de 2025 (1 = sim, 0 = não).
    not_in_table:
      iniciativa: >-
        A impressão dos professores de laboratório sobre a desenvoltura do aluno ("quem se
        vira no laboratório"). Ficou na conversa entre os professores; não há registro.
    story: >-
      ATA DA REUNIÃO DO CONSELHO ESCOLAR, 14 de agosto de 2026, 19h, sala dos professores.
      Presentes: a direção, a coordenação pedagógica, dois representantes dos professores, um
      representante dos pais e a secretária. Pauta única: avaliação do programa de monitores
      de laboratório com a turma formada em dezembro de 2025.

      A direção relatou que o programa teve 96 inscritos do 2º ano para 38 vagas, distribuídas
      pelos laboratórios de Mecatrônica, Informática e Edificações, em número diferente em
      cada um e maior no período noturno, onde o laboratório funciona sem técnico. Os
      professores de cada laboratório escolheram os monitores entre os inscritos. Segundo o
      professor Ednaldo, pesou a média do 1º ano e, nas palavras dele, "quem se vira no
      laboratório", o aluno mais desenrolado; esse segundo critério ficou na conversa entre os
      professores, não há registro dele em lugar nenhum, e o conselho concordou que é
      justamente esse aluno que as empresas contratam primeiro, monitor ou não.

      A secretaria ligou para os 96 em junho de 2026, no acompanhamento de egressos. Entre os
      que foram monitores, 71% estavam empregados na área; entre os demais, 44%. A coordenação
      ponderou que os alunos do noturno e os mais velhos em geral já trabalham; que a
      empregabilidade varia muito por curso (Informática contrata, Edificações está parado);
      e que as empresas pedem o histórico, de modo que a média do 1º ano pesa na contratação.
      Lembrou ainda que os monitores ficaram sabendo das vagas pelos professores e se
      cadastraram muito mais no banco de vagas da escola, que é o canal pelo qual
      encaminhamos currículos às empresas conveniadas. O representante dos pais perguntou se,
      com o que a secretaria tem (seleção, situação em junho, turno, curso, média do 1º ano,
      idade e cadastro no banco de vagas), dá para dizer quanto da diferença é mérito do
      programa. A direção ficou de levar a pergunta ao professor de estatística do noturno.
      Nada mais havendo a tratar, lavrei a presente ata.
    edges:
      - turno -> monitor
      - turno -> empregado_6m
      - curso -> monitor
      - curso -> empregado_6m
      - media_1ano -> monitor
      - media_1ano -> empregado_6m
      - iniciativa -> monitor
      - iniciativa -> empregado_6m
      - idade -> empregado_6m
      - monitor -> cadastro_banco_vagas
      - cadastro_banco_vagas -> empregado_6m
      - monitor -> empregado_6m
    answer:
      identifiable: false
      missing: [iniciativa]
    note: >-
      Turno, curso e média estão na tabela; a desenvoltura que os professores viram não está, e
      é ela que também faz o aluno ser contratado. Gêmeo do caso do sorteio.

