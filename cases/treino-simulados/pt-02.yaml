    answer:
      identifiable: true
      adjust_for: [curso, turno]
      do_not_adjust_for:
        cadastro_banco_vagas: Veio depois da seleção e por causa dela (os monitores souberam das vagas pelos professores). É parte do caminho pelo qual o programa gera emprego.
