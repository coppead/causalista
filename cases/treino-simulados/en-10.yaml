# Casos que simulam texto de pessoa, para TREINO: arquivo en-10, oito casos em inglês
# (vozes dos EUA e do Reino Unido).
#
# Escritos pelo assistente em 2026-10-07, no papel de pessoas (analista de uma agência estadual
# de trabalho e emprego, diretor de uma liga esportiva juvenil, analista de risco de uma
# financeira de crédito imobiliário, diretora de pessoas de um hospital em Manchester, dono
# de uma rede de lava-rápidos) descrevendo um conjunto de dados do jeito que essa pessoa
# escreveria: mensagem de Slack, memorando de uma página, pergunta a um consultor, e-mail
# ao time de dados, transcrição de áudio.
#
# Estes casos servem ao treino por reforço (o modelo responde, o verificador dá a nota).
# Não são o teste: nenhum cenário do conjunto congelado em cases/simulados/ é reutilizado.
# As setas declaram o diagrama causal que o texto implica; o verificador recalcula cada
# resposta a partir delas (scripts/check_cases.py). Status rascunho até a revisão.

cases:

  - id: en_wfa_week3_call
    author: ai
    status: rascunho
    language: en
    style: Slack message
    persona: analyst in the unemployment insurance division of a state workforce agency in the Upper Midwest, messaging a colleague on the analytics team
    theme: Public workforce agency / unemployment insurance
    title: Week-3 reemployment check-in call, every other claimant on the list
    treatment: checkin_call
    outcome: off_ui_wk16
    columns:
      checkin_call: 1 if the claimant received the Reemployment Services week-3 check-in call. Initial claims effective Feb 1 to Apr 25, 2026.
      off_ui_wk16: 1 if the claimant filed no weekly certification for benefit week 16 or any later week, through week 26.
      jobs_logged_wk4_8: Work-search contacts the claimant entered in the portal for benefit weeks 4 through 8.
      wba: Weekly benefit amount, dollars. Computed from base-period wages at filing.
      base_wages: Total base-period wages, dollars.
      naics2: Two-digit NAICS code of the separating employer.
      job_center: Job center assigned from the ZIP code of residence.
      survey_wk20: 1 if the claimant returned the claimant experience survey mailed in benefit week 20.
      claim_id: Claim number.
    story: >-
      @Luis one for you before I take anything to the deputy secretary. the week-3 check-in
      calls. recap: for initial claims effective Feb 1 through Apr 25 the RES unit called
      claimants at the start of their third benefit week, 15 minutes, go over the work-search
      rule, show them the job board, that's it. they could not call everyone so Carla's staff
      sorted each week's new-claim list by claim number and called every other row. no skipping
      anybody because they looked like a hard case, I asked, she was religious about it. what the
      dashboard shows: the called group enters a lot more work-search contacts in weeks 4 through
      8 (that is literally what the call tells them to do, and people who log more contacts get
      off benefits sooner, that's the whole theory of the thing), and exits by week 16 are up
      maybe 2.5 points. deputy sec wants a clean "the call moved exits by X points" for the
      legislature. in the extract besides the call flag and the week-16 exit I've got weekly
      benefit amount (which is just a formula off base-period wages, and the bigger the check the
      slower people leave, we all know that), the base-period wages themselves (higher earners
      have more options, they go faster), 2-digit NAICS of the last employer (construction clears
      out in April no matter what we do), the job center from the home ZIP (Milwaukee is a
      different labor market from the Fox Valley), and the week-20 claimant survey return flag,
      which the called folks return more because they recognize a name on the letter, and
      honestly so does anyone who just landed a job and is feeling good about us. which of those
      do I need to cut the comparison by, and which ones are going to wreck it if I do? I don't
      want to over-engineer this but I also don't want Hal from the Fiscal Bureau picking it apart.
    edges:
      - claim_id -> checkin_call
      - checkin_call -> jobs_logged_wk4_8
      - jobs_logged_wk4_8 -> off_ui_wk16
      - checkin_call -> off_ui_wk16
      - base_wages -> wba
      - wba -> off_ui_wk16
      - base_wages -> off_ui_wk16
      - naics2 -> off_ui_wk16
      - job_center -> off_ui_wk16
      - checkin_call -> survey_wk20
      - off_ui_wk16 -> survey_wk20
    answer:
      identifiable: true
      adjust_for: []
      do_not_adjust_for:
        jobs_logged_wk4_8: Entered in the weeks after the call and raised by it. It is the way the call is supposed to work, so it is part of the effect being measured.
        survey_wk20: Returned after week 16 and driven by both the call (a familiar name on the letter) and having left benefits (a good mood). Adjusting for it creates a false link between the two.
      indifferent: [base_wages, claim_id, job_center, naics2, wba]
    note: >-
      Every other row of a list sorted by claim number is as good as a coin flip, so the plain
      comparison is right. The traps are the work-search KPI, which is the mechanism, and the
      survey return, which comes after the fact for both reasons.

  - id: en_wfa_rapid_response
    author: ai
    status: rascunho
    language: en
    style: one-page memo
    persona: analyst in the research and evaluation unit of a state workforce agency in the Upper Midwest, writing to the director of the Dislocated Worker unit
    theme: Public workforce agency / mass layoffs
    title: On-site Rapid Response sessions and wages two quarters after the layoff
    treatment: rr_session
    outcome: emp_q2
    columns:
      rr_session: 1 if an on-site Rapid Response information session was held for the worker's layoff event before the separation date. WARN events with separations Jul 2024 to Jun 2025.
      emp_q2: 1 if UI wage records show wages from any employer in the second full calendar quarter after separation.
      event_size: Number of affected workers listed on the employer's WARN notice.
      notice_days: Calendar days between the WARN notice filing and the worker's separation date.
      wda: Workforce development area of the worksite, 1 to 11.
      age: Age at separation, from the WARN worker list.
      tenure_yrs: Years with the separating employer, from the WARN worker list where the employer provided it.
      rr_survey: Satisfaction rating, 1 to 5, from the Rapid Response survey mailed to every worker on the WARN list six months after separation. Blank if not returned.
      worker_id: Row identifier.
    story: >-
      MEMORANDUM. To Janelle Okoro, Director, Dislocated Worker Unit. From Sam Petrakis, Research
      and Evaluation. September 3, 2026. Re whether the on-site Rapid Response sessions can be
      shown to move reemployment. You asked for a number on the on-site sessions for the federal
      report. I want to lay out what the file can and cannot support before I produce one. What
      the sessions are. When an employer files a WARN notice, the Rapid Response team tries to
      get on site before the separations to walk the workers through UI filing, the job centers
      and the training money. Of the 212 WARN events with separations between July 2024 and June
      2025, 71 had a session. How events got one. Three things decided it, and all three are in
      the file I built from the WARN lists and the UI wage records. The team prioritized the large
      events, which is also where the local labor market takes the hardest hit: 400 people out of
      one plant in a town of 9,000 do not get reabsorbed the way 60 do. The team reliably covers
      only workforce areas 3 and 7, where the two coordinators sit; the other nine areas got a
      session when a coordinator could drive out, which was rarely, and those areas are very
      different labor markets to begin with. And the team needs lead time: with a full 60-day
      notice they are in, when the notice arrives two weeks before the doors close they are not,
      and a worker who learned two months out has had two months to line something up whether or
      not we showed up. Other fields. Age and years with the employer, both from the worker
      lists; older and longer-tenured workers take longer to find the next job, that has held in
      every cohort I have looked at. And the satisfaction rating from the survey the unit mails
      out, which has been running around 4.3 and which I know you are pleased with; I would note
      that the people who send it back skew toward those who are working again, and toward those
      who met the team in person. What I propose. To report the effect of a session on having
      wages in the second quarter after separation. Before I run it I would like your view on
      which of these fields should be held constant in the comparison and which should be left
      out of it, since the federal reviewers will ask.
    edges:
      - event_size -> rr_session
      - event_size -> emp_q2
      - wda -> rr_session
      - wda -> emp_q2
      - notice_days -> rr_session
      - notice_days -> emp_q2
      - age -> emp_q2
      - tenure_yrs -> emp_q2
      - rr_session -> emp_q2
      - rr_session -> rr_survey
      - emp_q2 -> rr_survey
    answer:
      identifiable: true
      adjust_for: [event_size, notice_days, wda]
      do_not_adjust_for:
        rr_survey: Mailed six months after separation and returned more by those back at work and by those who met the team. Adjusting for it creates a false link between the session and reemployment.
      indifferent: [age, tenure_yrs, worker_id]
    note: >-
      Three recorded things decided which events got a session, and each of them also moves
      reemployment on its own. The survey the director is pleased with is mailed after the
      outcome window and answered for both reasons.

  - id: en_league_sideline_scored
    author: ai
    status: rascunho
    language: en
    style: question to a consultant
    persona: executive director of a youth soccer league in the Atlanta suburbs (about 4,500 players, 300 volunteer coaches), former high-school coach, no analytics background, writing to a parent who runs an analytics consultancy
    theme: Youth sports league / coach training
    title: Positive Sideline workshop, seats by the spring conduct score, with the score on the coach's record
    twin: en_league_sideline_paper
    treatment: coach_workshop
    outcome: reregistered_spring
    columns:
      coach_workshop: 1 if the player's fall 2025 head coach attended the Positive Sideline workshop in August 2025.
      reregistered_spring: 1 if the player registered for the spring 2026 season by the February 15 deadline.
      coach_spring_score: Age-group commissioner's sideline-conduct score for the coach at the end of the spring 2025 season, 1 (poor) to 5 (excellent).
      coach_seasons: Seasons the coach has coached in the league, counting fall 2025.
      age_group: Player's fall 2025 age group, U6 through U14.
      sideline_incidents: Referee-reported sideline incidents (coach or spectator warnings and dismissals) logged against the player's team during the fall 2025 season.
      player_id: Registration system player number.
    story: >-
      Hi Priya, you offered to look at our numbers when we talked at the U12 tournament, so I'm
      taking you up on it. Last August we ran a workshop for coaches called Positive Sideline,
      three hours on a Saturday at the Mount Pisgah fields, mostly about how you talk to
      nine-year-olds and how you handle their parents. We had room for 140 and we have just over
      300 coaches. Here's how the seats went. Our age-group commissioners score every coach 1 to
      5 on sideline conduct at the end of each season, and since 2024 they enter that score on
      the coach's record in SportsEngine. Anybody at a 2 or below on the spring score was told to
      come or lose the team, and they all came. The rest of the seats we filled from the 3s,
      alphabetically, until we ran out; nobody at a 4 or 5 went. What I want to know is whether
      the workshop keeps kids in the league, so the thing I'm looking at is whether the player
      came back for spring. I pulled a player-level export: whether the player's fall coach went
      to the workshop, whether the player registered for spring, the coach's spring score, how
      many seasons the coach has been with us (our long-timers tend to score better and kids tend
      to stick with them), the player's age group (we bleed kids at U13 and U14 no matter what we
      do), and the number of referee-reported sideline incidents on the team in the fall. The
      incident count is the one I'm proudest of, it dropped a lot on the workshop coaches' teams,
      and I don't need a study to tell me nobody re-registers a kid after a season of parents
      screaming at the ref. Our board meets in May. I know the low-scored coaches lose more kids
      anyway, which is why I'm nervous about just comparing attendees to non-attendees. What
      should I be comparing on, and is there anything in that export I should leave alone?
    edges:
      - coach_spring_score -> coach_workshop
      - coach_spring_score -> reregistered_spring
      - coach_spring_score -> sideline_incidents
      - coach_seasons -> coach_spring_score
      - coach_seasons -> reregistered_spring
      - age_group -> reregistered_spring
      - coach_workshop -> sideline_incidents
      - sideline_incidents -> reregistered_spring
      - coach_workshop -> reregistered_spring
    answer:
      identifiable: true
      adjust_for: [coach_spring_score]
      do_not_adjust_for:
        sideline_incidents: Logged during the fall season and cut by the workshop. It is how the workshop is supposed to keep kids in the league, so it is part of the effect being measured.
      indifferent: [age_group, coach_seasons, player_id]
    note: >-
      Seats went strictly by the recorded spring score, which also predicts who loses players,
      so the score is the one column to hold constant. The incident count the director is proud
      of is the mechanism. Its twin moves the score to a paper binder.

