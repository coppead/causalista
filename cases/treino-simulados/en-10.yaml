  - id: en_mortgage_hbe_course
    author: ai
    status: rascunho
    language: en
    style: e-mail to the data team
    persona: credit risk analyst at a regional non-bank mortgage lender based in Dallas (about $5 billion a year in originations), writing to the data engineering team
    theme: Mortgage lending / borrower education
    title: Homebuyer education certificate pushed by the loan officers, and 60-day delinquency within two years
    treatment: hbe_cert
    outcome: dq60_24m
    columns:
      hbe_cert: 1 if a certificate from a HUD-approved homebuyer education course was in the file at closing. Purchase loans closed Jan to Dec 2024.
      dq60_24m: 1 if the loan was ever 60 or more days past due within 24 months of the first payment date.
      first_time: 1 if the borrower was flagged first-time homebuyer on the application.
      fico: Representative credit score at application.
      dti: Back-end debt-to-income ratio as underwritten, percent.
      ltv: Loan-to-value at closing, percent.
      property_state: State of the subject property.
      hardship_app: 1 if a loss-mitigation application was received from the borrower within 24 months of the first payment date.
      loan_num: Loan number.
    not_in_table:
      lo_read: The loan officer's sense of how shaky the borrower was. How the paperwork came in, whether they answered the phone, whether the story held together. Lives in the loan officer's head; the notes field in the LOS is blank on nearly every file.
    story: >-
      Subject: HBE extract, and a question before you build it. Hi Prashant, Megan. Risk
      committee wants to know whether the homebuyer education course does anything to early
      delinquency, so they can decide whether to pay for it on every first-time-buyer loan next
      year instead of leaving it to the branches. I need an extract and I want to talk it through
      before you spend time on it. Background, since neither of you was here for this. In 2024
      the retail channel offered the course (the online HUD-approved one, about three hours) to
      first-time buyers only, no cost to the borrower, certificate goes in the file at closing.
      About 2,100 of the 7,400 first-time-buyer purchase loans we closed last year have one.
      Nobody who wasn't a first-time buyer got it. Within the first-time buyers, who took it was
      up to the loan officers, and I've talked to enough of them to know how that went: they
      pushed it on the borrowers they were nervous about. Some of that is right there on the
      1003, the 640 scores, the 47 DTIs. But a lot of it was the LO's read of the person, whether
      the pay stubs showed up on time, whether they picked up the phone, whether the story held
      together, and none of that gets written down. The notes field in Encompass is empty on
      almost every file. The borrowers an LO is nervous about are, in my experience, the ones who
      go sixty days late, course or no course. For the extract, per loan: the certificate flag,
      ever 60-plus in the first 24 months, the first-time flag, FICO, DTI, LTV at closing
      (first-time buyers run higher LTVs, and LTV predicts default on its own, though I don't
      think the LOs looked at it when deciding who to push), property state (the Oklahoma loans
      have been a problem since the plant closures), and whether we received a loss-mit
      application in the 24 months. On that last one, two things: the course spends a whole
      module on calling your servicer before you miss a payment, and the HBE borrowers do apply
      at a higher clip; and obviously the people who are sixty days down are the ones who apply
      for help. My question for you two, and loop in Dr. Hahn if she has a minute: given how the
      course was assigned, is there a version of this comparison that would stand up at
      committee, and if so which of those fields does it need and which would be a mistake to
      include? I'd rather tell them we can't than hand them a number that falls apart. Thanks,
      Renee.
    edges:
      - lo_read -> hbe_cert
      - lo_read -> dq60_24m
      - first_time -> hbe_cert
      - first_time -> dq60_24m
      - first_time -> ltv
      - fico -> hbe_cert
      - fico -> dq60_24m
      - dti -> hbe_cert
      - dti -> dq60_24m
      - ltv -> dq60_24m
      - property_state -> dq60_24m
      - hbe_cert -> dq60_24m
      - hbe_cert -> hardship_app
      - dq60_24m -> hardship_app
    answer:
      identifiable: false
      missing: [lo_read]
    note: >-
      Score, DTI and the first-time flag are recorded and explain part of who got pushed to the
      course, but the loan officer's read of the borrower explains the rest and predicts going
      late, and it was never written down. The loss-mitigation flag is a second trap, filed
      after the fact for both reasons.

  - id: en_nhs_parking_permit_en10
    author: ai
    status: rascunho
    language: en
    style: one-page memo
    persona: Director of Workforce at an NHS teaching hospital trust in Manchester, writing to the Chief Operating Officer
    theme: Hospital workforce / punctuality
    title: Staff parking permits and late clock-ins, April to September
    treatment: parking_permit
    outcome: late_clockins_6m
    columns:
      parking_permit: 1 if the staff member held a staff car-parking permit for the Oxford Road site on 1 April 2025.
      late_clockins_6m: Number of shifts clocked in more than 10 minutes after the rostered start, April to September 2025, from the time-and-attendance system.
      distance_miles: Road distance in miles from the home postcode held on ESR to the site.
      early_shift_pct: Share of the staff member's rostered shifts starting before 07:30, October 2024 to March 2025.
      drives_to_work: 1 if the staff member gave car as their usual mode of travel to work in the May 2025 staff travel survey. Blank if the survey was not completed.
      division: Clinical division (Medicine, Surgery, Theatres and Critical Care, Women's and Children's, Corporate).
      afc_band: Agenda for Change pay band, 2 to 8a.
      assignment_no: ESR assignment number.
    story: >-
      To the Chief Operating Officer. From the Director of Workforce. 14 October 2025. Re staff
      parking permits and punctuality, what the April to September data can tell us. 1. Purpose.
      You asked whether the permit scheme can be shown to improve punctuality, ahead of the
      Finance and Performance Committee's review of the £410k of parking income forgone. This
      note sets out what we hold and asks for a steer on how far to push it. 2. How permits are
      allocated. Since the 2023 policy, permits for the Oxford Road site are scored on two things
      only, both taken from ESR and the roster: road distance from the home postcode (five miles
      or more scores), and the proportion of shifts in the preceding six months starting before
      07:30, when the Metrolink and the 42 are not yet running at a useful frequency. Roughly
      2,900 of the 7,100 substantive staff on site held a permit on 1 April. Nothing else goes
      into the scoring; the appeals panel held that line all year. 3. The headline. Permit
      holders clocked in late, more than ten minutes after the rostered start, on 2.1% of shifts
      between April and September, against 3.4% for staff without a permit. I am wary of that
      comparison. Colleagues who live further out are late more often for every reason there is,
      permit or no permit, and early starts are where lateness concentrates in the first place,
      because that is when public transport lets people down. 4. Travel survey. The May staff
      travel survey asked about usual mode of travel. Permit holders overwhelmingly drive, which
      is rather the point of the permit, and colleagues who drive are late less often than those
      on the bus. I take this as the scheme working as intended. 5. Other fields in the file.
      Division (Theatres monitors the clock-in far more tightly than Medicine, and it shows in
      the counts) and Agenda for Change band (our Band 2 and 3 colleagues carry more lateness, as
      they carry more of everything). 6. Ask. Whether the Committee can be given an effect of
      holding a permit on late clock-ins from this file, and on what basis the comparison should
      be made, in particular which of the fields above should be held constant and which should
      not be. I would prefer a defensible modest number to the headline.
    edges:
      - distance_miles -> parking_permit
      - distance_miles -> late_clockins_6m
      - early_shift_pct -> parking_permit
      - early_shift_pct -> late_clockins_6m
      - parking_permit -> drives_to_work
      - distance_miles -> drives_to_work
      - early_shift_pct -> drives_to_work
      - drives_to_work -> late_clockins_6m
      - parking_permit -> late_clockins_6m
      - division -> late_clockins_6m
      - afc_band -> late_clockins_6m
    answer:
      identifiable: true
      adjust_for: [distance_miles, early_shift_pct]
      do_not_adjust_for:
        drives_to_work: Reported in May, after the permits were issued, and changed by holding one. Driving is how the permit is meant to get people in on time, so it is part of the effect being measured.
      indifferent: [afc_band, assignment_no, division]
    note: >-
      Permits were scored on two recorded things, and both also drive lateness on their own.
      The travel survey the director reads as the scheme working is the mechanism, measured
      after the permits went out, and must stay out.

  - id: en_carwash_ceramic_month
    author: ai
    status: rascunho
    language: en
    style: voice-note transcript
    persona: owner of a chain of nine express car washes on the west side of Houston, runs the business off POS reports, no analyst on staff, leaving a voice memo for the bookkeeper who pulls the exports
    theme: Car wash chain / membership retention
    title: Free month of Ceramic Unlimited handed out by the pay-station attendants
    treatment: ceramic_upgrade
    outcome: active_6m
    columns:
      ceramic_upgrade: 1 if the member was given the free one-month Ceramic Unlimited upgrade at the pay station between March 2 and April 12, 2026.
      active_6m: 1 if the membership was still active on October 12, 2026 (not cancelled, card not declined for 60 days or more).
      washes_prior_90d: Washes recorded on the member's plate in the 90 days before March 2, 2026.
      washes_mar_apr: Washes recorded on the member's plate from March 2 to April 30, 2026.
      home_site: Site where the membership was sold, 1 to 9.
      plan_tenure_m: Months since the membership started, as of March 1, 2026.
      vehicle_type: Sedan, SUV or truck, other. From the plate lookup.
      member_id: POS member number.
    not_in_table:
      car_pride: How much the member fusses over the car, the wipe-the-door-jambs type. The attendants know it on sight; nothing in the POS records it.
    story: >-
      [Voice memo, 3 min 12, auto-transcribed. Ray to Gabe, Thursday evening.] Hey Gabe, it's
      Ray, um, I'm sitting at the Katy Freeway store waiting on the chemical guy so let me get
      this out of my head. The ceramic thing. Back in March, March 2nd through about the 12th of
      April, I had the pay station folks at the six stores that have the ceramic arch give out a
      free month of Ceramic Unlimited to members, bump 'em up from the basic plan, no charge, see
      if they'd stick around. The other three stores don't have the arch so nobody there got it.
      I didn't give the attendants a list, that's the problem, I told 'em use your judgment, and
      what they did was they gave it to the regulars, the people they know by name, the ones
      who've been with us a while, and if I'm honest the ones with the nice trucks who, you know,
      they're wiping down the door jambs in the vacuum bay on a Sunday. Those folks aren't going
      anywhere whether I give 'em ceramic or not, that's what I'm afraid of, and there's nothing
      in the POS that says who's like that, the attendants just know. What I want from you is,
      did the free month actually keep people, like are they still active in October, six months
      out. Things you've got in the export: how many washes they did in the 90 days before March,
      how many in March and April, which the ceramic people came in a bunch more during the free
      month to get their money's worth and I figure the more you come in the more it's a habit,
      home store, how long they've been a member, vehicle type off the plate lookup, member
      number. Oh and the home store matters on its own, the Westheimer store has that lot problem
      and people quit there regardless, and the regulars and the long-timers, they renew no
      matter what, they always have. So what is it, can you get me a real number out of this or
      do I need to do it properly next year with a list? Call me back, I'm here till seven.
    edges:
      - car_pride -> ceramic_upgrade
      - car_pride -> active_6m
      - car_pride -> washes_prior_90d
      - car_pride -> washes_mar_apr
      - washes_prior_90d -> ceramic_upgrade
      - washes_prior_90d -> active_6m
      - plan_tenure_m -> ceramic_upgrade
      - plan_tenure_m -> active_6m
      - home_site -> ceramic_upgrade
      - home_site -> active_6m
      - ceramic_upgrade -> washes_mar_apr
      - washes_mar_apr -> active_6m
      - ceramic_upgrade -> active_6m
    answer:
      identifiable: false
      missing: [car_pride]
    note: >-
      Prior washes, tenure and home store are recorded and explain part of who got the upgrade,
      but the attendants also went by how much the member fusses over the car, which keeps
      people renewing and is recorded nowhere. The washes during the free month are the
      mechanism, not a fix.

  - id: en_carwash_welcome_texts
    author: ai
    status: rascunho
    language: en
    style: question to a consultant
    persona: owner of a chain of nine express car washes on the west side of Houston, writing to the consultant who set up the membership CRM
    theme: Car wash chain / new-member onboarding
    title: Welcome text series and still a member at 90 days
    treatment: welcome_texts
    outcome: active_90d
    columns:
      welcome_texts: 1 if the member received the three-message welcome text series in the first 30 days of membership. Memberships started January to August 2026.
      active_90d: 1 if the membership was active 90 days after the start date.
      signup_channel: How the membership was sold. Pay station, attendant tablet, or website.
      signup_month: Month the membership started, 2026-01 to 2026-08.
      home_site: Site of signup, 1 to 9.
      winback_d120: 1 if the member was sent the $9.99 win-back text at day 120. Sent to members who had cancelled by then and had received the welcome series, the only mobile numbers we trusted.
      member_id: POS member number.
    story: >-
      Hey Marcus, quick one, you set up the welcome text flow for us in January so you'll know
      this better than me. I want to know if those three texts actually keep new members past 90
      days. Here's the wrinkle. The flow only fires if there's a mobile number on the account,
      and the website signup form didn't ask for one until your June update, so from January to
      May basically the pay-station and tablet signups got the texts and the website signups
      didn't, and from June on everybody did. Website signups are a different animal anyway,
      they're the $9.99 first-month deal hunters and they cancel like crazy. And the month
      matters on its own, our spring signups stick and the July-August crowd drops off when
      school starts, every year. Gabe's win-back text flag from the summer is in the export too,
      use it or don't, your call, and home store, Westheimer loses people regardless. Can you
      tell me what to line up before I compare texted to not texted, and what to ignore? Thanks
      man.
    edges:
      - signup_channel -> welcome_texts
      - signup_channel -> active_90d
      - signup_month -> welcome_texts
      - signup_month -> active_90d
      - welcome_texts -> active_90d
      - home_site -> active_90d
      - welcome_texts -> winback_d120
      - active_90d -> winback_d120
    answer:
      identifiable: true
      adjust_for: [signup_channel, signup_month]
      do_not_adjust_for:
        winback_d120: Sent at day 120, after the outcome, and only to members who had cancelled and had received the welcome series. Adjusting for it creates a false link between the two.
      indifferent: [home_site, member_id]
    note: >-
      Channel and month together decided who got the texts, and each moves retention on its
      own. The win-back flag is mentioned in passing; only the column dictionary says it was
      sent after the fact to members picked by both the texts and the cancellation.
