    title: Telessaúde municipal e internações evitáveis, com a cobertura de ESF de 2024
    twin: pt_saude_telessaude_esf_jun26
    treatment: telessaude
    outcome: icsap_2026
    columns:
      telessaude: Município aderiu ao programa estadual de telessaúde (teleconsultoria para as equipes da atenção primária) em 2025 (1 = sim, 0 = não).
      icsap_2026: Taxa de internações por condições sensíveis à atenção primária, de janeiro a junho de 2026, por 10 mil habitantes.
      icsap_2024: Mesma taxa, de janeiro a junho de 2024.
      porte_pop: População estimada em 2024.
      cobertura_esf: Cobertura populacional das equipes de Saúde da Família em dezembro de 2024, em %.
      cod_ibge: Código IBGE do município.
    story: >-
      Para o Núcleo de Informação. Assunto: efeito do telessaúde nas ICSAP. Dos 417
      municípios, 236 aderiram ao telessaúde em 2025. A adesão não foi aleatória: as
      regionais pressionaram os municípios com ICSAP alta, e o programa exigia pelo menos
      uma equipe de ESF ativa, de modo que quem já tinha cobertura maior aderiu mais. Os
      municípios pequenos aderiram menos (sem TI, sem internet) e, como sempre, têm as taxas
      mais altas, porque internam qualquer coisa no hospital regional. Quem aderiu recebeu
      cofinanciamento para abrir equipes novas, e cobertura de ESF é o que mais segura
      internação evitável. Planilha em anexo com código IBGE, população, ICSAP de 2024 e de
      2026 e cobertura de ESF (a de dezembro de 2024, anterior à adesão). Favor indicar por
      quais colunas ajustar na comparação entre aderentes e não aderentes, para a nota
      técnica da próxima semana.
    edges:
      - icsap_2024 -> telessaude
      - icsap_2024 -> icsap_2026
      - cobertura_esf -> telessaude
      - cobertura_esf -> icsap_2026
      - cobertura_esf -> icsap_2024
      - porte_pop -> telessaude
      - porte_pop -> icsap_2026
      - porte_pop -> icsap_2024
      - telessaude -> icsap_2026
    answer:
      identifiable: true
      adjust_for: [cobertura_esf, icsap_2024, porte_pop]
      indifferent: [cod_ibge]
    note: >-
      Os três motivos da adesão (taxa alta, cobertura de ESF, porte) estão na tabela e os
      três mexem na taxa de 2026. A cobertura aqui é a de antes da adesão; no gêmeo, é a de
      depois.

