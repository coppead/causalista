  - id: en_mortgage_escrow_cushion
    author: ai
    status: rascunho
    language: en
    style: Slack message
    persona: analyst on the servicing analytics team at a mid-size nonbank mortgage servicer (about 300,000 loans), messaging the VP of servicing
    theme: Mortgage servicing / escrow
    title: 24-month escrow cushion applied by a dollar threshold
    treatment: cushion_24m
    outcome: dq60_12m
    columns:
      cushion_24m: 1 if the Feb 2025 escrow analysis spread the shortage over 24 months instead of the standard 12.
      dq60_12m: 1 if the loan was 60 or more days past due at any month-end from Apr 2025 through Mar 2026.
      shortage_amt: Escrow shortage in dollars at the Feb 2025 analysis.
      fico_orig: Borrower FICO at origination.
      autopay_mar25: 1 if the loan was on ACH autopay as of Mar 31, 2025, the month after the cushion letters went out.
      hardship_contact: 1 if any inbound or outbound contact with the hardship team is logged on the loan through Mar 31, 2026.
    story: >-
      @Marcus re the 24-month cushion review. recap so we're aligned: in the Feb analysis the
      system automatically spread the shortage over 24 months for every loan with a shortage over
      $600 and left the standard 12 for everyone under, nobody in ops touched the list, I checked
      the exception log and it's empty. dq60 through March is 4.1% on the cushion loans vs 3.3% on
      the rest, which looks bad until you remember the cushion loans are the ones whose payment
      jumped the most, a $1,400 shortage is a payment shock on its own, cushion or not. two more
      things. the cushion letter had the autopay insert and ACH enrollment is way up in that group,
      and autopay loans almost never go 60, that's a real thing the cushion did. and the letter
      also printed the hardship line number, so we got a wave of calls from cushion borrowers who
      didn't understand the new payment, on top of the normal 45-day outreach we do to anyone
      who's late. FICO is in the pull because Risk always wants it, it had nothing to do with the
      rule, though sure, weaker FICO goes late more. tell me which of those to put in the model
      and which to leave out and I'll have a number by Thursday.
    edges:
      - shortage_amt -> cushion_24m
      - shortage_amt -> dq60_12m
      - cushion_24m -> autopay_mar25
      - autopay_mar25 -> dq60_12m
      - cushion_24m -> dq60_12m
      - fico_orig -> dq60_12m
      - cushion_24m -> hardship_contact
      - dq60_12m -> hardship_contact
    answer:
      identifiable: true
      adjust_for: [shortage_amt]
      do_not_adjust_for:
        autopay_mar25: Enrollment came after the cushion letter and because of it, and autopay is one way the cushion keeps loans current. It is part of the effect being measured.
        hardship_contact: Logged through March 2026, driven by the cushion letter and by going late. Adjusting for it creates a false link between the cushion and delinquency.
      indifferent: [fico_orig]
    note: >-
      The rule was a dollar threshold with no human in the loop, so the shortage amount is the
      only thing that drove the cushion, and it also drives the payment shock. Autopay is the
      mechanism and the hardship contact comes after both.

  - id: en_mortgage_upfront_uw
    author: ai
    status: rascunho
    language: en
    style: one-page memo
    persona: analyst in origination analytics at a retail mortgage lender (about 2,400 purchase applications a month across 60 branches), writing to the SVP of origination
    theme: Mortgage origination / process
    title: Upfront underwriting by division and by rush rule, with a survey sent after closing
    treatment: upfront_uw
    outcome: closed_on_time
    columns:
      upfront_uw: 1 if the application received upfront underwriting (underwriter review within 48 hours of application, before the appraisal is ordered). Purchase applications dated May 1 to Aug 31, 2025.
      closed_on_time: 1 if the loan funded on or before the contract closing date. 0 if it funded late or did not fund.
      division: Southeast, Northeast, Central or West.
      days_to_contract: Days from application date to the contract closing date.
      loan_program: Conventional, FHA, VA or USDA.
      fico: Representative credit score at application.
      appraisal_order_day: Business days from application to appraisal order.
      borrower_nps: Likelihood-to-recommend score, 0 to 10, from the borrower survey sent two weeks after the contract closing date, whether or not the loan funded.
      app_id: Application number.
    story: >-
      MEMORANDUM. To: SVP, Origination. From: Origination Analytics. Date: October 9, 2025. Re:
      Upfront underwriting pilot and on-time closing. Background. From May 1 through August 31,
      upfront underwriting was applied to two groups of purchase applications: every purchase
      application in the Southeast division, where the pilot was based, and, in all four
      divisions, any purchase application whose contract closing date fell within 30 days of the
      application date, the "rush" rule. Branches had no say in it; the LOS set the flag from the
      division code and the contract date. 11,460 purchase applications in the window, 4,212 with
      upfront UW. Headline. 81% of upfront-UW files funded on or before the contract date against
      74% of the rest. Two cautions on the comparison. The Southeast closes faster than anyone
      regardless of process, title and attorney turn times there are roughly half what we see in
      the Northeast, so a division that was always going to do well is over-represented in the
      pilot. In the other direction, the rush rule put our tightest timelines into the pilot, and
      a 21-day contract misses its date far more often than a 45-day one however we underwrite
      it. Program type matters for timing as well, FHA and VA run longer, but it played no part in
      who received upfront UW; the same goes for credit score, which is in the file because it
      always is, and weaker files do take longer to clear conditions. Two supporting metrics the
      regional managers have asked to see in the model. Appraisal order timing moved exactly as
      designed, from a median of 6 business days to 2, and an early appraisal is the single
      biggest reason a file funds on time; the managers want it in "so we compare like with
      like". Borrower NPS is up 9 points on upfront-UW files and they want it in as a control for
      borrower experience (a missed closing date is the surest route to a 2, so the two are not
      independent). I have not added either yet and would like direction before I do.
      Request. Approval to report the on-time effect of upfront UW with the adjustments the
      comparison needs, and nothing added for optics.
    edges:
      - division -> upfront_uw
      - division -> closed_on_time
      - days_to_contract -> upfront_uw
      - days_to_contract -> closed_on_time
      - loan_program -> closed_on_time
      - fico -> closed_on_time
      - upfront_uw -> appraisal_order_day
      - appraisal_order_day -> closed_on_time
      - upfront_uw -> closed_on_time
      - upfront_uw -> borrower_nps
      - closed_on_time -> borrower_nps
    answer:
      identifiable: true
      adjust_for: [days_to_contract, division]
      do_not_adjust_for:
        appraisal_order_day: Set by the process after the flag and brought forward by upfront UW. It is the main way upfront UW gets a file funded on time, so it is part of the effect being measured.
        borrower_nps: Collected two weeks after the contract closing date and driven by both the early underwriter contact and whether the loan closed on time. Adjusting for it creates a false link between the two.
      indifferent: [app_id, fico, loan_program]
    note: >-
      Both assignment rules (division, contract timing) also move on-time closing. The appraisal
      KPI is the mechanism. The survey timing is only in the column dictionary; the memo never
      says when it was sent.

  - id: en_airline_ron_tech
    author: ai
    status: rascunho
    language: en
    style: meeting notes
    persona: director of operations at a US regional airline (about 45 aircraft, flying for a mainline partner), notes taken by the ops coordinator at the weekly ops review
    theme: Airline maintenance / outstations
    title: Overnight line techs at the stations the maintenance director picked
    treatment: ron_tech
    outcome: first_dep_mx_delay_pct
    columns:
      ron_tech: 1 if a line maintenance technician has been based overnight at the station since Jun 1, 2025. Station level, the 22 stations where aircraft overnight.
      first_dep_mx_delay_pct: Percent of the station's first departures of the day, Jul-Sep 2025, delayed 15 min or more with a maintenance delay code.
      mx_delay_pct_q1: Same measure, Jan-Mar 2025.
      partner_mx_onsite: 1 if the mainline partner has maintenance staff of its own based at the station.
      ron_aircraft: Number of our aircraft scheduled to overnight at the station in the summer 2025 schedule.
      open_mels_avg: Average number of open deferred maintenance items on the station's overnighting aircraft at 05:00 local, Jul-Sep 2025.
      mx_control_review: 1 if the station was on Maintenance Control's October review call. The call covered every station with an overnight tech and every station above 6% on first-departure maintenance delays in Q3.
      station_code: IATA station code.
    story: >-
      Weekly Ops Review, Oct 7, 2025. Notes: T. Vang. Present: Dir. Ops, Dir. Maintenance (R.),
      Maintenance Control, Analytics (S.). Item 2, overnight line techs at outstations. Recap from
      R.: since Jun 1 a line tech has been based overnight at 9 of the 22 stations where we
      overnight aircraft. Placement was R.'s call. He started with the stations with the worst
      first-departure maintenance delay rate in Q1, which are still our problem children, same
      tails, same ground power issues, and he put techs where the partner has no maintenance
      presence of its own, because at the partner stations their people will quietly help us out
      at 5am and our morning numbers there have always been better. Stations with fewer than
      three overnighting aircraft were not considered; R. will not put a head where there is one
      airplane. Maintenance Control: open deferred items on the overnighting aircraft at 5am are
      down a lot where there is a tech, they clear them overnight instead of carrying them, and an
      airplane carrying open deferrals is the one that goes late in the morning. Analytics: the
      October review flag is in the station extract, see the dictionary for who was on the call.
      Dir. Ops: wants the effect of the tech on first-departure maintenance delays, station level,
      Q3, with the adjustments it needs and not one more, for the budget ask for six more heads;
      if 22 stations cannot carry an answer, say so. Also wants to know if the open-deferrals
      number belongs in the model or in a separate slide. ACTION (S.): deliver by Oct 17. Item 3, winter ops, deferred to next week.
    edges:
      - mx_delay_pct_q1 -> ron_tech
      - mx_delay_pct_q1 -> first_dep_mx_delay_pct
      - partner_mx_onsite -> ron_tech
      - partner_mx_onsite -> first_dep_mx_delay_pct
      - ron_aircraft -> ron_tech
      - ron_tech -> open_mels_avg
      - open_mels_avg -> first_dep_mx_delay_pct
      - ron_tech -> first_dep_mx_delay_pct
      - ron_tech -> mx_control_review
      - first_dep_mx_delay_pct -> mx_control_review
    answer:
      identifiable: true
      adjust_for: [mx_delay_pct_q1, partner_mx_onsite]
      do_not_adjust_for:
