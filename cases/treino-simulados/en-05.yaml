      up in that group; coaches who actually run the plans run better practices and the kids come
      back. Priya is sending a data request, per team: workshop y/n, % of fall roster registered
      for spring, first-year flag, ref reports fall '24, age group, app sessions, team id. She'll
      tell us what she needs to adjust for and whether the data can answer the question at all.
      Next call Oct 20.
    edges:
