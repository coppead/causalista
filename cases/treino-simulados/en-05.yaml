# Casos que simulam texto de pessoa, para TREINO: arquivo en-05, oito casos em inglês
# (vozes dos EUA e do Reino Unido).
#
# Escritos pelo assistente em 2026-10-07, no papel de pessoas (chefe de treinamento de um
# operador logístico, gerente de uma livraria universitária, diretor de uma liga esportiva
# juvenil, analista de uma financeira de crédito imobiliário, diretor de operações de uma
# companhia aérea regional) descrevendo um conjunto de dados do jeito que essa pessoa
# escreveria: post em fórum, notas de reunião, notas de uma ligação com um consultor,
# mensagem de Slack, memorando de uma página.
#
# Estes casos servem ao treino por reforço (o modelo responde, o verificador dá a nota).
# Não são o teste: nenhum cenário do conjunto congelado em cases/simulados/ é reutilizado.
# As setas declaram o diagrama causal que o texto implica; o verificador recalcula cada
# resposta a partir delas (scripts/check_cases.py). Status rascunho até a revisão.

cases:

  - id: en_3pl_load_right
    author: ai
    status: rascunho
    language: en
    style: one-page memo
    persona: head of training at a UK third-party logistics firm (about 2,100 warehouse colleagues across nine distribution centres in the Midlands and the North), writing to the operations director, no statistics training
    theme: Logistics / warehouse training
    title: Load Right course for the loaders the DC managers picked
    treatment: load_right
    outcome: claims_q3
    columns:
      load_right: 1 if the colleague completed the two-day Load Right course between 7 April and 30 May 2025.
      claims_q3: Number of customer damage claims logged Jul-Sep 2025 traced to a trailer the colleague loaded (loader id taken from the dispatch note).
      claims_q1: Same count for Jan-Mar 2025.
      tenure_months: Months from start date to 1 April 2025.
      night_shift: 1 if the colleague's rostered pattern for 2025 was nights. Patterns are fixed for the calendar year in the March roster.
      pallets_q3: Pallets dispatched against the colleague's id, Jul-Sep 2025.
      dc_code: Site code (B01, B02, L03, ...).
    not_in_table:
      manager_view: What the DC manager made of the colleague's care on the dock. The reason most often given for a nomination; never written down.
    story: >-
      MEMO. To: Operations Director. From: Head of Training. Date: 14 October 2025. Re: Load Right
      and the Q3 claims figures, what we can and cannot say. Summary. 212 colleagues across the
      nine DCs completed Load Right (two days: pallet build, wrap tension, trailer load plan)
      between 7 April and 30 May, cost c. £41k including backfill. Q3 damage claims traced back to
      those 212 came out at 0.9 per loader against 1.6 for everyone else on the dock. I would love
      to put that in the board pack as it stands. I don't think we can, and I'd rather set out why
      now than have Finance do it for us in November. How names were chosen. Each DC manager gave
      me 20 to 30 names whatever the size of the site, so B01 with 410 heads put forward a far
      smaller share than L03 with 140. I have since been round all nine and asked how they picked. Every one of
      them started from the Q1 claims list, which is fair. Most leaned towards the newer starters,
      and that is who we built the course for, new starters do have more claims. And every single
      manager said some version of "and the ones I've been meaning to have a word with", meaning
      the colleagues they watch on the dock every day and wouldn't trust with a mixed pallet. That
      judgement is not written down anywhere, it lives in the manager's head, and those colleagues
      would have had more claims in Q3 with or without us. If anything it cuts against the course,
      but it is still a thumb on the scale. Shifts. The course ran 9 to 5, so the nights pattern
      was hard to release and far fewer nights colleagues went. Nights also run higher on claims,
      they always have, less supervision and the tail end of the inbound. What else is in the
      extract from Analytics: tenure at 1 April, pallets dispatched against each colleague's id in
      Q3 (more pallets, more claims, obviously), the site code (B02 has the fragile FMCG contract
      and runs higher on claims whatever we do) and the Q1 claims count. Ask. Can Analytics tell
      me how much of the 0.9 vs 1.6 is the course and how much is who got picked? And if the
      honest answer is that this extract cannot settle it, I would rather say so in the pack than
      have it taken apart in the room.
    edges:
      - manager_view -> load_right
      - manager_view -> claims_q3
      - manager_view -> claims_q1
      - claims_q1 -> load_right
      - tenure_months -> load_right
      - tenure_months -> claims_q3
      - night_shift -> load_right
      - night_shift -> claims_q3
      - pallets_q3 -> claims_q3
      - dc_code -> load_right
      - dc_code -> claims_q3
      - load_right -> claims_q3
    answer:
      identifiable: false
      missing: [manager_view]
    note: >-
      Three of the four reasons a name went on the list are in the extract (Q1 claims, tenure,
      shift). The fourth, the manager's own read of who is careless, is not, and no column stands
      in for it. The memo even says the bias runs against the course; it is still a bias.

  - id: en_bookstore_buyback_card
    author: ai
    status: rascunho
    language: en
    style: forum post
    persona: manager of an independent university bookstore (state university of about 16,000 students, Mountain West), posting on a college stores association member forum, no analyst on staff
    theme: Retail / university bookstore
    title: Buyback Promise card handed to every other customer
    treatment: promise_card
    outcome: sold_back_dec
    columns:
      promise_card: 1 if the customer was handed a Buyback Promise card with their receipt during rush week, Aug 18-24, 2025.
      sold_back_dec: 1 if the customer sold back at least one title at the Dec 8-13 buyback.
      rush_spend: Dollar total of the rush-week transaction before tax.
      class_year: Freshman, sophomore, junior, senior or grad, from the student ID scan.
      alert_signup: 1 if the customer signed up for buyback text alerts by Nov 30, through the QR code (printed on the card and on the store website).
      dec_survey: 1 if the customer answered the December customer survey.
      register_no: Register where the rush-week transaction was rung, 1 to 6.
    story: >-
      Subject: Did our Buyback Promise card actually move sellback? (and how would I know). Hi
      all, independent store, ~16k students, no data person, so be gentle. We tried something
      during August rush and I'd love a sanity check. The card: wallet-size "Buyback Promise" with
      our guaranteed December minimum for the three biggest gen-ed titles and a QR code to sign up
      for buyback text alerts. Because I wanted to be able to compare afterwards, I told the six
      cashiers to hand one to every other customer, period, no judgment calls, one yes one no
      down the line. They grumbled but the receipts show close to 50/50 at every register. What I
      see: alert signups went way up among the card customers (the QR did its job), and alert
      signups come back to sell at a much higher rate, we knew that from last year. Sellback
      among card customers was 31% vs 24% for the rest. Our GM wants to print 20,000 more cards
      for January. Things that nag me: 1) freshmen sell back at a much higher rate than anybody,
      they don't keep anything; 2) a bigger August basket obviously means more to sell back in
      December; 3) we emailed a customer survey in December to everyone who got a card and to
      everyone who came through the buyback line, and a colleague at another store told me to
      "control for survey response" since it's in the file. That felt off but I can't say why.
      What I have per customer: card y/n, sold back y/n, August basket $, class year, alert
      signup, survey answered, register number. Does the every-other-customer thing mean I can
      just compare the two groups, or do I need to slice by some of this first? Thanks in
      advance, happy to share the spreadsheet with anyone who wants to look.
    edges:
      - promise_card -> alert_signup
      - alert_signup -> sold_back_dec
      - promise_card -> sold_back_dec
      - rush_spend -> sold_back_dec
      - class_year -> sold_back_dec
      - promise_card -> dec_survey
      - sold_back_dec -> dec_survey
    answer:
      identifiable: true
      adjust_for: []
      do_not_adjust_for:
        alert_signup: Signing up came after the card and because of it, and it is the main way the card brings people back in December. It is part of the effect being measured.
        dec_survey: Answered in December, after the buyback, by people who got a card and by people who sold back. Adjusting for it creates a false link between the card and selling back.
      indifferent: [class_year, register_no, rush_spend]
    note: >-
      Every other customer is as good as a draw, so the plain comparison is already right. The
      traps are the alert-signup KPI the manager is proud of, which is the mechanism, and the
      survey a colleague told her to control for, which was sent to both groups after the fact.

  - id: en_youth_soccer_signup
    author: ai
    status: rascunho
    language: en
    style: notes from a call with a consultant
    persona: executive director of a youth soccer league (about 3,200 players and 240 volunteer head coaches, suburban county in New Jersey), typing up notes after an intro call with a consultant who will look at the league's data
    theme: Youth sports / volunteer coaching
    title: Positive Sideline workshop, open sign-up
    twin: en_youth_soccer_assigned
    treatment: sideline_workshop
    outcome: reg_spring_pct
    columns:
      sideline_workshop: 1 if the team's head coach completed the Positive Sideline workshop (3 hours, August 2025) before the fall season.
      reg_spring_pct: Percent of the team's fall 2025 roster registered for spring 2026 by the Jan 31 deadline.
      first_year_coach: 1 if fall 2025 was the head coach's first season with the league.
      ref_reports_fall24: Referee incident reports filed against the team's sideline in fall 2024. 0 if the coach did not coach in fall 2024.
      age_group: U8, U10, U12 or U14.
      plan_app_sessions: Number of practice plans the coach opened in the league's practice-plan app during the fall 2025 season.
      team_id: Team identifier.
    not_in_table:
      coach_engagement: How plugged-in the coach is, the kind who reads the newsletter and shows up to the coaches meeting. Nothing in the registration system captures it.
    story: >-
      Notes from call w/ Priya (consultant), Oct 6, 2025, 45 min. On the call: me, Dana
      (volunteer coordinator). Background I gave her: Positive Sideline workshop, 3 hrs, ran four
      Saturdays in August at the high school, 71 of our 240 head coaches took it, $6,800 with the
      facilitator. Spring registration closes Jan 31 and the board wants to know if it's worth
      running again. How coaches ended up in it: it was open sign-up. First-year coaches mostly
      took it because they have to do three hours of something anyway. Dana emailed every coach
      who had a ref report against their sideline last fall and leaned on them, and most of
      those signed up too. The rest were, in Dana's words, "the coaches who sign up for
      everything", the ones who read the newsletter and show up to the coaches meeting. Those are
      also the coaches whose teams come back every year, we have known that forever, but there is
      nothing in the system that captures it. Priya asked twice if there was a column for that.
      There isn't. Things Priya asked about: first-year coaches' teams come back at maybe 60% vs
      80% for the rest, that's just how it is. Teams with a ref report lose kids, parents don't
      re-up with a screaming sideline. U14 falls off a cliff regardless, that's travel soccer and
      high school taking them. The workshop walks coaches through the practice-plan app and app
      use went way up in that group; coaches who actually run the plans run better practices and
      the kids come back. Priya is sending a data request, per team: workshop y/n, % of fall
      roster registered for spring, first-year flag, ref reports fall '24, age group, app
      sessions, team id. She'll tell us what she needs to adjust for and whether the data can
      answer the question at all. Next call Oct 20.
    edges:
      - coach_engagement -> sideline_workshop
      - coach_engagement -> reg_spring_pct
      - first_year_coach -> sideline_workshop
      - first_year_coach -> reg_spring_pct
      - first_year_coach -> ref_reports_fall24
      - ref_reports_fall24 -> sideline_workshop
      - ref_reports_fall24 -> reg_spring_pct
      - age_group -> reg_spring_pct
      - sideline_workshop -> plan_app_sessions
      - plan_app_sessions -> reg_spring_pct
      - sideline_workshop -> reg_spring_pct
    answer:
      identifiable: false
      missing: [coach_engagement]
    note: >-
      Two of the three reasons a coach signed up are columns. The third, being the kind of coach
      who signs up for everything, also keeps kids coming back and is not recorded. Twin of the
      case where Dana assigned the workshop strictly from the two lists.

  - id: en_youth_soccer_assigned
    author: ai
    status: rascunho
    language: en
    style: notes from a call with a consultant
    persona: executive director of a youth soccer league (about 3,200 players and 240 volunteer head coaches, suburban county in New Jersey), typing up notes after an intro call with a consultant who will look at the league's data
    theme: Youth sports / volunteer coaching
    title: Positive Sideline workshop, assigned from two lists
    twin: en_youth_soccer_signup
