  - id: pt_ecommerce_recomendador_tamanho_email
    author: ai
    status: rascunho
    language: pt
    style: e-mail longo com anexo descrito
    persona: gerente de e-commerce de moda
    theme: E-commerce de moda, recomendador de tamanho
    title: Recomendador de tamanho e devolução do pedido
    treatment: usou_recomendador
    outcome: devolveu_pedido
    columns:
      dia_semana_pedido: Dia da semana em que o pedido foi feito (1 = segunda, 7 = domingo).
      dispositivo: Dispositivo em que o pedido foi feito (app, mobile web, desktop).
      categoria_produto: Categoria do item (vestido, calça, camiseta, acessório).
      devolucoes_anteriores: Número de devoluções por tamanho da cliente nos 12 meses anteriores ao pedido.
      valor_pedido: Valor do pedido, em reais, antes do frete.
      usou_recomendador: >-
        A cliente usou o recomendador de tamanho na página do produto antes de fechar o
        pedido (1 = sim, 0 = não).
      devolveu_pedido: Pedido devolvido dentro do prazo de troca de 15 dias após a entrega (1 = sim, 0 = não).
      avaliou_caimento: >-
        Respondeu à pergunta sobre caimento no e-mail de avaliação enviado 20 dias após a
        entrega (1 = sim, 0 = não).
    story: >-
      Assunto: recomendador de tamanho x devoluções – dados em anexo. Oi Paula, tudo bem?
      Conforme combinamos na reunião de quinta, segue em anexo a planilha
      recomendador_abr_jun.xlsx. A aba "pedidos" tem uma linha por pedido de abril a junho
      (143 mil linhas), só moda feminina, e a aba "dicionario" descreve cada coluna.
      Contexto para quem não acompanhou: o recomendador de tamanho ("qual é o meu
      tamanho?") entrou na página de produto em março. A cliente clica, informa altura,
      peso e como gosta do caimento, e ele sugere o tamanho. Não é obrigatório, e no app e
      no mobile web o botão fica escondido embaixo da descrição, então quase ninguém usa
      pelo celular; no desktop o uso é bem maior. A taxa de devolução dos pedidos com
      recomendador foi de 14% contra 22% sem, e o Ricardo já quer colocar isso no deck do
      investidor. Minhas ressalvas: (1) quem usa o recomendador é quem tem dúvida de
      tamanho, e isso aparece bem no histórico: clientes com devolução anterior por
      tamanho usam o dobro, e essas clientes devolvem mais de qualquer jeito. (2) Em
      vestidos e calças o botão aparece em destaque, logo abaixo do preço; em camisetas e
      acessórios fica discreto. E vestido e calça são justamente as categorias com mais
      devolução por caimento. (3) Pedido de valor alto devolve mais, isso é histórico,
      independe do recomendador. (4) Coloquei também a avaliação de caimento: o e-mail de
      avaliação sai 20 dias depois da entrega, já depois do prazo de troca, e quem usou o
      recomendador responde bem mais (a gente lembra a cliente da sugestão que ela
      recebeu); quem devolveu também responde mais, geralmente para reclamar. Tem ainda o
      dia da semana do pedido, que veio no extrato e deixei. Consegue me dizer por quais
      colunas ajustar para comparar com e sem recomendador de um jeito que eu consiga
      defender para o Ricardo? Obrigada! Carla
    edges:
      - devolucoes_anteriores -> usou_recomendador
      - devolucoes_anteriores -> devolveu_pedido
      - categoria_produto -> usou_recomendador
      - categoria_produto -> devolveu_pedido
      - dispositivo -> usou_recomendador
      - valor_pedido -> devolveu_pedido
      - usou_recomendador -> devolveu_pedido
      - usou_recomendador -> avaliou_caimento
      - devolveu_pedido -> avaliou_caimento
    answer:
