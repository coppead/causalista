  - id: pt_saneamento_caca_vazamento_wiki
    author: ai
    status: rascunho
    language: pt
    style: página de wiki interna
    persona: analista de uma companhia de água e esgoto
    theme: Saneamento, visita para busca de vazamentos internos
    title: Visita do Caça-Vazamento e consumo no trimestre seguinte
    treatment: visita_caca_vazamento
    outcome: consumo_m3_trim_seguinte
    columns:
      matricula: Número da matrícula da ligação de água.
      dmc: Código do DMC (setor de medição e controle) ao qual a ligação pertence.
      categoria: Categoria de faturamento da ligação (residencial, comercial, pública).
      consumo_m3_trim_anterior: Consumo faturado, em m³, no trimestre anterior ao período de visitas.
      visita_caca_vazamento: >-
        Imóvel recebeu a visita do Caça-Vazamento entre março e agosto de 2025 (1 = sim,
        0 = não).
      consumo_m3_trim_seguinte: Consumo faturado, em m³, no trimestre seguinte ao período de visitas.
      reclamacao_sac_90d: >-
        Abriu reclamação no SAC nos 90 dias após o fechamento do trimestre seguinte ao
        período de visitas (1 = sim, 0 = não).
    story: >-
      Caça-Vazamento 2025 — notas para quem for analisar (página mantida pelo Planejamento
      Comercial; última edição 02/10/2026). O que foi: entre março e agosto de 2025 as
      equipes de campo visitaram 9.800 imóveis para procurar vazamentos internos (caixa
      d'água, descarga, torneiras), sem custo para o cliente, consertando na hora o que
      fosse simples. Como os imóveis foram escolhidos: duas listas. A primeira veio do
      faturamento, com todas as ligações cujo consumo no trimestre anterior passou de 30
      m³. A segunda veio da Operação, que mandou as equipes priorizarem os DMCs com maior
      índice de perdas; dentro desses setores a equipe visitou rua por rua. Não houve
      sorteio. Lembrar que o DMC também define a pressão da rede, e setor com pressão alta
      consome mais, visita ou não. Resultado que a Operação quer mostrar: consumo médio no
      trimestre seguinte às visitas, comparado com o dos imóveis não visitados. Imóveis
      comerciais e públicos consomem mais que residenciais, por isso a categoria está na
      base. O SAC pediu para incluir as reclamações: segundo eles, quem recebeu visita e
      mesmo assim viu a conta vir alta liga para reclamar que "o problema não foi
      resolvido". Dúvida em aberto para o time de dados: por quais colunas ajustar a
      comparação entre visitados e não visitados?
    edges:
      - consumo_m3_trim_anterior -> visita_caca_vazamento
      - consumo_m3_trim_anterior -> consumo_m3_trim_seguinte
      - dmc -> visita_caca_vazamento
      - dmc -> consumo_m3_trim_seguinte
      - categoria -> consumo_m3_trim_seguinte
      - visita_caca_vazamento -> consumo_m3_trim_seguinte
      - visita_caca_vazamento -> reclamacao_sac_90d
      - consumo_m3_trim_seguinte -> reclamacao_sac_90d
    answer:
      identifiable: true
      adjust_for: [consumo_m3_trim_anterior, dmc]
      do_not_adjust_for:
        reclamacao_sac_90d: >-
          A reclamação vem depois da conta do trimestre seguinte e depende tanto da visita
          quanto do consumo que apareceu nela.
      indifferent: [categoria, matricula]
    note: >-
      Duas regras de escolha (consumo anterior e DMC), ambas na tabela. A reclamação no
      SAC é registrada depois do resultado; o momento está na descrição da coluna.

  - id: pt_saneamento_tarifa_social_slack
    author: ai
    status: rascunho
    language: pt
