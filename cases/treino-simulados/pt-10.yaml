# Casos simulados para TREINO, em português do Brasil: oito textos escritos como uma
# pessoa escreveria, para o modelo responder durante o treino por reforço (ele responde,
# o verificador dá a nota). Não são teste: ficam fora da medição final e não repetem
# nenhum cenário dos casos congelados de cases/simulados/.
#
# Escritos pelo assistente em 2026-10-07, a pedido do André, no papel de cinco pessoas: a
# gerente de assinaturas de um jornal, o coordenador de atendimento de um plano
# odontológico, uma analista de uma companhia de água e esgoto, a gerente de um
# e-commerce de moda e o gerente de segurança do trabalho de uma mineradora. Cada texto
# tem o estilo do canal em que a pessoa escreveria (wiki interna, relatório trimestral,
# e-mail com anexo, ata, Slack).
#
# As setas declaram o diagrama que o texto implica; o verificador confere a resposta a
# partir delas (scripts/check_cases.py). Status rascunho até revisão.

cases:

  - id: pt_jornal_impresso_domingo_sorteio
    author: ai
    status: rascunho
    language: pt
    style: trecho de relatório trimestral
    persona: gerente de assinaturas de um jornal
    theme: Mídia, assinatura digital de jornal
    title: Edição impressa de domingo sorteada e renovação em 12 meses
    treatment: recebeu_impresso_domingo
    outcome: renovou_12m
    columns:
      id_assinante: Identificador do assinante no sistema de cobrança.
      recebeu_impresso_domingo: >-
        Sorteado para receber em casa a edição impressa de domingo por três meses a partir
        da ativação da assinatura digital (1 = sim, 0 = não).
      renovou_12m: Renovou a assinatura ao fim dos primeiros 12 meses (1 = sim, 0 = não).
      canal_aquisicao: >-
        Canal pelo qual o assinante chegou (busca, redes sociais, indicação, outro),
        registrado na ativação.
      faixa_etaria: Faixa etária informada no cadastro (18–29, 30–44, 45–59, 60+).
      leituras_app_meses_4_6: Matérias abertas no app entre o quarto e o sexto mês de assinatura.
      respondeu_pesquisa_mes13: >-
        Respondeu à pesquisa de satisfação enviada no 13º mês de assinatura (1 = sim,
        0 = não).
    story: >-
      RELATÓRIO TRIMESTRAL DE ASSINATURAS – 3T2026 – Seção 4: Teste da edição impressa de
      domingo. No 1T de 2025 lançamos o teste com os 6.240 assinantes digitais novos do
      trimestre: metade, escolhida por sorteio na planilha de cadastro, passou a receber
      em casa a edição impressa de domingo por três meses, sem custo; a outra metade
      seguiu só com o digital. Agora que todos fecharam 12 meses, temos a renovação.
      Resultados: renovação de 61% no grupo com impresso contra 54% no grupo só digital.
      O indicador que mais nos animou foi o de leitura: entre o quarto e o sexto mês, já
      sem receber o jornal, quem teve o impresso abriu 38% mais matérias no app, e
      sabemos há anos que leitura no app é o que segura o assinante na hora da renovação.
      A pesquisa de satisfação enviada no 13º mês teve resposta de 41% entre quem recebeu
      o impresso e 23% entre os demais; como de costume, quem renovou respondeu muito
      mais do que quem saiu. Observação: a origem do assinante (busca, redes sociais,
      indicação) e a faixa etária continuam pesando na renovação como nos trimestres
      anteriores, e vieram no extrato. A área de dados pediu que especifiquemos por quais
      colunas a comparação entre os dois grupos deve ser ajustada antes de levarmos o
      número à diretoria.
    edges:
      - recebeu_impresso_domingo -> leituras_app_meses_4_6
      - leituras_app_meses_4_6 -> renovou_12m
      - recebeu_impresso_domingo -> renovou_12m
      - canal_aquisicao -> renovou_12m
      - faixa_etaria -> renovou_12m
      - recebeu_impresso_domingo -> respondeu_pesquisa_mes13
      - renovou_12m -> respondeu_pesquisa_mes13
    answer:
      identifiable: true
      adjust_for: []
      do_not_adjust_for:
        leituras_app_meses_4_6: >-
          A leitura entre o quarto e o sexto mês é consequência de ter recebido o impresso
          e é um dos caminhos pelos quais ele segura o assinante.
        respondeu_pesquisa_mes13: >-
          A pesquisa foi enviada depois da renovação, e responder depende tanto de ter
          recebido o impresso quanto de ter renovado.
      indifferent: [canal_aquisicao, faixa_etaria, id_assinante]
    note: >-
      Sorteio: nada a ajustar. O texto oferece dois indicadores que estragariam a conta,
      um apresentado como o resultado mais animador e outro como pesquisa de satisfação.

  - id: pt_odonto_programa_periodontal_pt10
    author: ai
    status: rascunho
    language: pt
    style: ata de reunião
    persona: coordenador de atendimento de um plano odontológico
    theme: Plano odontológico, programa de acompanhamento periodontal
    title: Programa periodontal e custo curativo, sem a avaliação da gengiva
    treatment: programa_periodontal
    outcome: custo_curativo_12m
    columns:
      id_beneficiario: Código do beneficiário na operadora.
      idade: Idade do beneficiário, em anos, na data da consulta de rotina.
      tipo_contrato: Tipo de contrato (PF = pessoa física, PJ = empresarial).
      consultas_ano_anterior: Número de consultas odontológicas no ano anterior à consulta de rotina.
      programa_periodontal: >-
        Beneficiário indicado pelo dentista e inscrito no Programa de Acompanhamento
        Periodontal na consulta de rotina de 2025 (1 = sim, 0 = não).
      limpezas_12m: Número de profilaxias realizadas nos 12 meses seguintes à consulta de rotina.
      custo_curativo_12m: >-
        Soma, em reais, dos procedimentos curativos (restauração, endodontia, extração,
        urgência) pagos pela operadora nos 12 meses seguintes à consulta de rotina. Não
        inclui profilaxia nem consultas.
    not_in_table:
      condicao_gengival: >-
        Avaliação da gengiva feita pelo dentista na cadeira (inflamação, sangramento), que
        motiva a indicação ao programa. A guia da consulta não tem campo para isso.
    story: >-
      ATA – Reunião mensal de Atendimento e Rede, 14/08/2026, sala 2. Presentes: Rogério
      (coordenação de atendimento), Dra. Lúcia (auditoria odontológica), Fabiana (dados),
      Marcos (comercial). Pauta 2 – Programa de Acompanhamento Periodontal. Rogério lembrou
      que o programa começou em janeiro de 2025 e consiste em limpezas trimestrais e
      orientação de higiene para beneficiários indicados pelo dentista da rede na consulta
      de rotina. Dra. Lúcia explicou que a indicação é critério do dentista: ele olha a
      gengiva na cadeira e indica quem está com inflamação ou sangramento, e que esse
      quadro, sem acompanhamento, costuma virar canal e extração mais adiante. Fabiana
      informou que a guia da consulta não tem campo para essa avaliação, então nada disso
      chega ao sistema; o que a base traz é idade, tipo de contrato, quantas consultas o
      beneficiário fez no ano anterior, se entrou no programa, quantas limpezas fez nos 12
      meses seguintes e o custo dos procedimentos curativos nesses mesmos 12 meses.
      Marcos observou que quem já ia mais ao dentista no ano anterior foi mais indicado,
      simplesmente porque passou mais vezes pela cadeira, e que esse público também gasta
      mais em procedimento, por hábito de uso. Rogério destacou como ponto positivo que os
      participantes fizeram em média 3,1 limpezas no ano contra 0,8 dos demais, e que
      limpeza regular reduz procedimento curativo. Dra. Lúcia acrescentou que o custo
      curativo varia também com a idade e com o tipo de contrato (PJ tem cobertura mais
      ampla). Encaminhamento: Fabiana verifica se, com as colunas disponíveis, dá para
      medir o efeito do programa sobre o custo curativo e, em caso positivo, por quais
      colunas ajustar. Prazo: próxima reunião.
    edges:
      - condicao_gengival -> programa_periodontal
      - condicao_gengival -> custo_curativo_12m
      - consultas_ano_anterior -> programa_periodontal
      - consultas_ano_anterior -> custo_curativo_12m
      - programa_periodontal -> limpezas_12m
      - limpezas_12m -> custo_curativo_12m
      - programa_periodontal -> custo_curativo_12m
      - idade -> custo_curativo_12m
      - tipo_contrato -> custo_curativo_12m
    answer:
      identifiable: false
      missing: [condicao_gengival]
    twin: pt_odonto_programa_periodontal_psr
    note: >-
      O dentista indica quem tem a gengiva pior, e gengiva pior vira canal e extração. A
      guia não registra essa avaliação. As consultas do ano anterior estão na tabela, mas
      não bastam.

