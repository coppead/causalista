  - id: pt_mineradora_treinamento_bloqueio_email
    author: ai
    status: rascunho
    language: pt
    style: e-mail longo com anexo descrito
    persona: gerente de segurança do trabalho em uma mineradora
    theme: Mineração, treinamento de bloqueio e etiquetagem de energia
    title: Treinamento de bloqueio e desvios de segurança em 12 meses
    treatment: treinamento_bloqueio
    outcome: desvios_12m
    columns:
      matricula: Matrícula funcional do empregado.
      area: Área de lotação (mina, usina, porto).
      turno: Turno fixo de trabalho (dia, noite).
      tempo_casa_anos: Tempo de empresa, em anos completos, na data de abertura das vagas do treinamento.
      treinamento_bloqueio: >-
        Concluiu o treinamento de 16 horas de bloqueio e etiquetagem de energia no
        primeiro semestre de 2025 (1 = sim, 0 = não).
      aderencia_checklist_pct: >-
        Percentual de tarefas auditadas com checklist de pré-tarefa preenchido
        corretamente, nas auditorias de campo dos 12 meses seguintes ao treinamento.
      desvios_12m: Número de desvios de segurança registrados pelas inspeções nos 12 meses seguintes ao treinamento.
    not_in_table:
      perfil_risco_supervisor: >-
        Avaliação informal do supervisor sobre o quanto o empregado é afoito e pula etapas,
        que orientou as indicações. Não existe em sistema nenhum.
    story: >-
      Assunto: avaliação do treinamento de bloqueio e etiquetagem – planilha anexa.
      Prezados do time de dados, boa tarde. Segue anexa a planilha
      treinamento_bloqueio_2025.xlsx, com uma linha por empregado da manutenção (1.126
      pessoas) e a aba "legenda" explicando as colunas. Preciso de ajuda para responder à
      diretoria se o treinamento de 16 horas de bloqueio e etiquetagem de energia, que
      rodou no primeiro semestre de 2025, reduziu os desvios registrados pelas inspeções
      nos 12 meses seguintes. Como foi a seleção: o RH abriu 400 vagas e cada supervisor
      indicou quem mandar. Conversando com eles, a lógica foi mandar primeiro "quem
      precisa mais": o pessoal mais afoito, que pula etapa, que o supervisor já tinha
      pegado fazendo intervenção sem bloquear. Isso é olho de supervisor; não existe
      registro disso em sistema nenhum. Também foram mais indicados os mais novos de casa,
      e a gente sabe que tempo de casa pesa nos desvios. O treinamento aconteceu só na
      mina e na usina; o porto ficou de fora por logística, e o porto historicamente tem
      menos desvios dessa natureza. O turno da noite aparece com mais desvios todo ano,
      por causa da supervisão reduzida. Como indicador intermediário, as auditorias de
      campo mostram aderência ao checklist de pré-tarefa de 91% entre os treinados contra
      72% nos demais, e aderência ao checklist é justamente o que evita o desvio. A
      diretoria gostou desse número, mas eu quero responder a pergunta certa. Com as
      colunas da planilha, dá para medir o efeito do treinamento sobre os desvios? Se der,
      por quais colunas ajustar? Se não der, me digam o que falta, que eu tento levantar.
      Atenciosamente, Henrique – Segurança do Trabalho.
    edges:
      - perfil_risco_supervisor -> treinamento_bloqueio
      - perfil_risco_supervisor -> desvios_12m
      - tempo_casa_anos -> treinamento_bloqueio
      - tempo_casa_anos -> desvios_12m
      - area -> treinamento_bloqueio
      - area -> desvios_12m
      - turno -> desvios_12m
      - treinamento_bloqueio -> aderencia_checklist_pct
      - aderencia_checklist_pct -> desvios_12m
      - treinamento_bloqueio -> desvios_12m
    answer:
      identifiable: false
      missing: [perfil_risco_supervisor]
    note: >-
      Tempo de casa e área estão na tabela; o olho do supervisor, que mandou os mais
      afoitos, não está. A aderência ao checklist é consequência do treinamento e é
      apresentada como o número que a diretoria gostou.

  - id: pt_jornal_audio_wiki
    author: ai
    status: rascunho
    language: pt
    style: página de wiki interna
    persona: gerente de assinaturas de um jornal
    theme: Mídia, matérias narradas em áudio no app
    title: Uso de áudio no app e cancelamento em 6 meses
    treatment: usa_audio
    outcome: cancelou_6m
    columns:
      sistema_operacional: Sistema operacional do aparelho principal do assinante (iOS, Android).
      uf: Unidade da federação do endereço de cobrança.
      tempo_assinatura_meses: >-
        Meses desde o início da assinatura, na data do lançamento do áudio na plataforma
        do assinante.
      leituras_30d_antes: >-
        Matérias lidas no app nos 30 dias anteriores ao lançamento do áudio na plataforma
        do assinante.
      usa_audio: >-
        Ouviu quatro ou mais matérias narradas nos 30 dias seguintes ao lançamento do
        áudio na sua plataforma (1 = sim, 0 = não).
      sessoes_mes_seguinte: Aberturas do app no mês seguinte ao lançamento do áudio na plataforma do assinante.
      cancelou_6m: >-
        Cancelou a assinatura nos 6 meses seguintes ao lançamento do áudio na sua
        plataforma (1 = sim, 0 = não).
    not_in_table:
      viu_banner_audio: >-
        Se o app exibiu ao assinante o banner "ouça esta matéria", decidido pelo motor de
        recomendação a partir do engajamento dos 30 dias anteriores. O log de exibição não
        é armazenado.
    story: >-
      Wiki Produto > Áudio > Avaliação do impacto na retenção (rascunho; dono: Tiago;
      atualizado em 29/09/2026). Contexto. Em abril lançamos as matérias narradas (áudio)
      no app. Nas primeiras semanas o recurso só existia no iOS; o Android entrou em
      junho. Quem vê o banner "ouça esta matéria" é decidido pelo motor de recomendação do
      app a partir do engajamento dos 30 dias anteriores; esse log de exibição do banner
      não é armazenado, só sabemos quem de fato ouviu. Definição de uso. Consideramos
      usuário de áudio quem ouviu quatro ou mais matérias nos 30 dias após o lançamento
      na sua plataforma. O que sabemos da base. Assinantes mais antigos aderiram mais ao
      áudio e, como sempre, cancelam menos. Quem lia mais antes do lançamento também
      aderiu mais, e leitura prévia é o nosso melhor preditor de cancelamento há anos. O
      cancelamento varia por estado (o Sul e o Centro-Oeste cancelam menos), que está na
      base. Indicador que o time comemorou: no mês seguinte ao lançamento, os usuários de
      áudio abriram o app 2,3 vezes mais; frequência de abertura é o que segura
      assinante. Pergunta para a área de dados. Dá para medir o efeito do uso de áudio
      sobre o cancelamento em 6 meses com o que está na base? Por quais colunas ajustar?
      A tabela tem: sistema_operacional, uf, tempo_assinatura_meses, leituras_30d_antes,
      usa_audio, sessoes_mes_seguinte, cancelou_6m.
    edges:
      - leituras_30d_antes -> viu_banner_audio
      - viu_banner_audio -> usa_audio
      - leituras_30d_antes -> usa_audio
      - leituras_30d_antes -> cancelou_6m
      - sistema_operacional -> usa_audio
      - tempo_assinatura_meses -> usa_audio
      - tempo_assinatura_meses -> cancelou_6m
      - uf -> cancelou_6m
      - usa_audio -> sessoes_mes_seguinte
      - sessoes_mes_seguinte -> cancelou_6m
      - usa_audio -> cancelou_6m
    answer:
      identifiable: true
      adjust_for: [leituras_30d_antes, tempo_assinatura_meses]
      do_not_adjust_for:
        sessoes_mes_seguinte: >-
          As aberturas do mês seguinte são consequência do uso de áudio e são o caminho
          pelo qual ele segura o assinante.
      indifferent: [sistema_operacional, uf]
    note: >-
      Há uma informação não guardada (o banner), mas ela só influencia quem usa o áudio e
      depende da leitura prévia, que está na tabela: o efeito continua medível. A
      plataforma só muda quem usa; o estado só muda quem cancela.
