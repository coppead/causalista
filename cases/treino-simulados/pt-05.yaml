      mais perto do campus também manda mais aluno para o vestibular, com ou sem visita, como
      o relatório da COPERVE de 2024 já mostrava; e que os alunos do noturno se inscrevem
      menos. A bolsista Ana Clara acrescentou que os alunos visitados compareceram muito mais
      à Feira das Profissões de setembro, e que a feira por si só puxa inscrição, o que a
      comissão entendeu ser parte do efeito do projeto. A servidora Tânia informou que a base
      foi montada com uma linha por aluno (código anônimo, IDEB da escola, distância da
      escola ao campus, série, turno, se participou da visita, se foi à feira e se se
      inscreveu no vestibular, por cruzamento de CPF com a COPERVE), cobrindo os alunos de
      todas as 73 escolas que preencheram o formulário. A comissão deliberou encaminhar a
      base ao Núcleo de Estatística com a pergunta: quais colunas devem ser levadas em conta
      na comparação entre visitados e não visitados. Nada mais havendo a tratar, a reunião
      foi encerrada às 15h20. Lavrei a presente ata, Tânia Ribeiro.
    edges:
      - empenho_direcao -> visita_lab
      - empenho_direcao -> inscreveu_vestibular
      - ideb_escola -> visita_lab
      - ideb_escola -> inscreveu_vestibular
      - distancia_campus_km -> visita_lab
      - distancia_campus_km -> inscreveu_vestibular
      - serie -> visita_lab
      - serie -> inscreveu_vestibular
      - turno -> inscreveu_vestibular
      - visita_lab -> participou_feira
      - participou_feira -> inscreveu_vestibular
      - visita_lab -> inscreveu_vestibular
    answer:
      identifiable: false
      missing: [empenho_direcao]
    twin: pt_extensao_visita_lab_sorteio
    note: >-
      Mesma ata do gêmeo, com uma frase trocada: em vez de sorteio, a equipe escolheu as
      escolas pelo empenho da direção, que não foi registrado e também leva à inscrição.

  - id: pt_ecommerce_troca_gratis
    author: ai
    status: rascunho
    language: pt
    style: página de wiki interna
    persona: gerente de e-commerce de uma marca de moda
    theme: E-commerce de moda
    title: Primeira troca grátis e recompra
    treatment: troca_gratis
    outcome: recomprou_90d
    columns:
      troca_gratis: Cliente com a primeira troca grátis habilitada no pedido inicial. Regra automática desde 1/4/2025, primeiro pedido com valor acima de R$ 300 e entrega nas regiões Sul ou Sudeste (1 = sim, 0 = não).
      recomprou_90d: Fez ao menos um novo pedido em até 90 dias do primeiro (1 = sim, 0 = não).
      valor_primeiro_pedido: Valor do primeiro pedido, em reais, já com desconto.
      regiao: Região de entrega do primeiro pedido (Norte, Nordeste, Centro-Oeste, Sudeste ou Sul).
      canal_aquisicao: Canal de origem da primeira compra pela UTM (instagram, google, influencer ou orgânico).
      cupom_boas_vindas: Usou o cupom de boas-vindas de 10% no primeiro pedido (1 = sim, 0 = não).
      fez_troca_60d: Solicitou troca de tamanho ou cor de algum item do primeiro pedido em até 60 dias (1 = sim, 0 = não).
      nps_7d: Nota de 0 a 10 dada na pesquisa enviada sete dias após a entrega do primeiro pedido (vazio se não respondeu).
      dia_semana_pedido: Dia da semana do primeiro pedido.
    story: >-
      Primeira troca grátis, avaliação (rascunho). Página criada por Fernanda (E-commerce) em
      03/02/2026; time de BI, por favor complementar. O que é: desde 1/4/2025 a cliente nova
      ganha a primeira troca com frete grátis nos dois sentidos, conforme a regra que está na
      descrição da coluna troca_gratis na tabela clientes_novos_2025 (a regra é automática,
      ninguém escolhe à mão). Por que a página existe: o CFO quer saber se a troca grátis faz
      a cliente voltar, porque a logística reversa custou R$ 184 mil no ano. O que a gente
      sabe. Quem gasta mais no primeiro pedido volta mais, sempre foi assim, e Sul/Sudeste
      recompra mais que o resto porque o frete chega em dois dias. Quem veio pelo cupom de
      boas-vindas recompra menos (cliente de cupom some) e cliente de influencer recompra mais
      que a de Google. Quem tem a troca grátis trocou mais (23% contra 9%), e quem troca e
      acerta o tamanho volta: isso é justamente o que a gente queria que acontecesse. O NPS de
      sete dias de quem tem troca grátis veio 12 pontos acima, e promotora recompra, isso a
      gente vê todo mês. Colunas da tabela: troca_gratis, recomprou_90d, valor_primeiro_pedido,
      regiao, canal_aquisicao, cupom_boas_vindas, fez_troca_60d, nps_7d, dia_semana_pedido.
      Pergunta pro BI: quais dessas colunas entram na comparação entre quem tem e quem não tem
      troca grátis, e quais não podem entrar?
    edges:
      - valor_primeiro_pedido -> troca_gratis
      - valor_primeiro_pedido -> recomprou_90d
      - regiao -> troca_gratis
      - regiao -> recomprou_90d
      - canal_aquisicao -> recomprou_90d
      - cupom_boas_vindas -> valor_primeiro_pedido
      - cupom_boas_vindas -> recomprou_90d
      - troca_gratis -> fez_troca_60d
      - fez_troca_60d -> recomprou_90d
      - troca_gratis -> nps_7d
      - nps_7d -> recomprou_90d
      - troca_gratis -> recomprou_90d
    answer:
      identifiable: true
      adjust_for: [regiao, valor_primeiro_pedido]
      do_not_adjust_for:
        fez_troca_60d: Consequência da troca grátis e um dos caminhos até a recompra. Faz parte do efeito.
        nps_7d: Medido depois da troca grátis e influenciado por ela; é outro caminho até a recompra. Faz parte do efeito.
      indifferent: [canal_aquisicao, cupom_boas_vindas, dia_semana_pedido]
    note: >-
      A regra de quem recebe a troca grátis está só na descrição da coluna. Dois indicadores
      de que a gerente se orgulha (troca, NPS) são consequências da intervenção.

  - id: pt_ecommerce_estilista_chat
    author: ai
    status: rascunho
    language: pt
    style: mensagem de WhatsApp para um analista freelancer
    persona: gerente de e-commerce de uma marca de moda
    theme: E-commerce de moda
    title: Atendimento da estilista no chat e gasto em 30 dias
    treatment: atendimento_estilista
    outcome: gasto_30d
    columns:
      atendimento_estilista: Cliente foi abordada e atendida por uma das estilistas no chat do site durante a sessão de compra, em outubro de 2025 (1 = sim, 0 = não).
      gasto_30d: Total gasto em pedidos nos 30 dias seguintes à sessão, em reais (0 se não comprou).
      compras_12m_anteriores: Número de pedidos nos 12 meses anteriores à sessão.
      faixa_etaria: Faixa etária declarada no cadastro.
      dispositivo: Dispositivo da sessão (mobile ou desktop).
      cupom_estilista: Recebeu o cupom de 15% enviado pela estilista ao fim do atendimento (1 = sim, 0 = não). Só quem foi atendida recebe.
      devolucoes_30d: Número de itens devolvidos dos pedidos feitos nos 30 dias seguintes à sessão.
    not_in_table:
      pecas_vistas_sessao: Quantidade de peças que a cliente já tinha olhado na sessão quando a estilista decidiu chamá-la ou não. Aparece no painel do chat na hora, mas o painel não guarda.
    story: >-
      Thiago, boa noite, desculpa a hora. Lembra do piloto das estilistas no chat, em outubro?
      A Jú e a Carol ficavam no painel do chat e puxavam conversa com algumas clientes que
      estavam navegando, tipo "quer ajuda pra montar o look?". A diretoria achou lindo mas
      quer número: quanto a conversa com a estilista aumenta o gasto nos 30 dias seguintes.
      Te mandei a base por e-mail, uma linha por sessão de outubro: se foi atendida, gasto
      nos 30 dias, pedidos nos 12 meses anteriores, faixa etária, dispositivo, se recebeu o
      cupom de 15% que a estilista manda no fim do atendimento (só atendida recebe, e cupom
      vende, né) e itens devolvidos dos pedidos desses 30 dias. Agora o detalhe: perguntei pra
      Jú como elas escolhiam quem chamar e ela disse que olhavam no painel quantas peças a
      pessoa já tinha visto na sessão (quem já viu 15 peças tá a fim de comprar) e se era
      cliente antiga, com vários pedidos, que também compra mais, óbvio. Cliente antiga a
      gente tem na base. O número de peças vistas aparece no painel na hora mas ele não
      guarda, já pedi pra TI e não tem log. Cliente mais velha gasta mais, isso você já sabe
      dos outros trabalhos. E devolução: quem comprou mais devolve mais, lógico, mas quem foi
      atendida acerta mais o tamanho e devolve menos. Consegue me dar um retorno até quinta?
      A reunião é sexta cedo.
    edges:
      - pecas_vistas_sessao -> atendimento_estilista
      - pecas_vistas_sessao -> gasto_30d
      - compras_12m_anteriores -> atendimento_estilista
      - compras_12m_anteriores -> gasto_30d
      - faixa_etaria -> gasto_30d
      - atendimento_estilista -> cupom_estilista
      - cupom_estilista -> gasto_30d
      - atendimento_estilista -> gasto_30d
      - atendimento_estilista -> devolucoes_30d
      - gasto_30d -> devolucoes_30d
    answer:
      identifiable: false
      missing: [pecas_vistas_sessao]
    note: >-
      As estilistas escolheram quem chamar pela intenção de compra que o painel mostrava e
      não guardou. O histórico de pedidos está na base e resolve só metade; o cupom é
      consequência do atendimento e a devolução vem depois do gasto.
