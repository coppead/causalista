    persona: coordenadora de extensão de um centro de ciências exatas de universidade pública
    theme: Educação (extensão universitária)
    title: Visita aos laboratórios e inscrição no vestibular (escolha da equipe)
    treatment: visita_lab
    outcome: inscreveu_vestibular
