# Casos simulados para TREINO, em português do Brasil: oito textos escritos como uma
# pessoa escreveria.
#
# Escritos pelo assistente em 2026-10-07, a pedido do André, no papel de cinco pessoas: a
# gerente de loja de uma rede de eletrodomésticos, a coordenadora pedagógica de uma rede
# municipal, o gerente de uma rede de óticas, o diretor de operações de uma transportadora
# de cargas frias e o gerente de manutenção de uma indústria de alimentos. Cada texto tem
# o estilo do canal em que a pessoa escreveria (e-mail ao chefe, dissertação de mestrado,
# ata de reunião, Slack, wiki interna).
#
# Estes casos servem ao treino por reforço: o modelo responde, o verificador dá a nota.
# Não são o teste congelado de cases/simulados/ e não repetem nenhum cenário de lá. As
# setas declaram o diagrama que o texto implica; o verificador confere a resposta a
# partir delas (scripts/check_cases.py). Status rascunho até a revisão.

cases:

  - id: pt_eletro_treino_garantia_no_olho
    author: ai
    status: rascunho
    language: pt
    style: e-mail para o chefe
    persona: gerente de loja de uma rede de eletrodomésticos
    theme: Varejo de eletrodomésticos
    title: Treinamento de garantia estendida com turma escolhida no olho
    treatment: treinamento_garantia
    outcome: taxa_garantia_tri
    columns:
      treinamento_garantia: Vendedor participou do treinamento de venda de garantia estendida em julho (1 = sim, 0 = não).
      taxa_garantia_tri: Percentual das vendas de produtos elegíveis do vendedor que saíram com garantia estendida, de agosto a outubro.
      tempo_casa: Meses de casa do vendedor em 30 de junho.
      loja: Código da loja em que o vendedor está lotado.
      premio_trimestre: Recebeu o prêmio de garantia do trimestre (1 = sim). Pago em novembro a quem bateu a meta de taxa de garantia de agosto a outubro.
      matricula: Matrícula do vendedor no sistema de RH.
    not_in_table:
      jeito_para_servico: A impressão do Ricardo sobre quem tem mais jeito para vender serviço, que ficou só na cabeça dele.
    story: >-
      Oi Marcelo, bom dia.

      Segue o que você pediu sobre o treinamento de garantia estendida. Puxei do BI os
      vendedores das seis lojas da regional, 71 pessoas, com a taxa de garantia de agosto a
      outubro, que é o período que a matriz está usando pra dizer que o treinamento "dobrou a
      conversão".

      Antes de a gente repassar esse número pra cima, queria te alertar de uma coisa. Quem
      montou a turma de julho foi o Ricardo, do Serviços Financeiros. Ele conhece o pessoal
      de balcão há anos e escolheu, nas palavras dele, "quem tem mais jeito pra vender
      serviço". Não teve critério escrito nem ficha de avaliação; foi o olho dele, e olho não
      vira coluna. A regra formal era só ter mais de três meses de casa, e, entre os que
      passavam nessa régua, ele puxou de preferência os mais antigos. Você sabe que os
      antigos já vendem garantia melhor que os novatos, com treinamento ou sem.

      A loja do shopping e a da Avenida têm um público bem diferente das lojas de rua, e
      isso mexe na taxa de garantia de qualquer jeito, então deixei o código da loja na
      base.

      Mais uma coisa. A meta de garantia do trimestre foi reduzida pra quem fez o
      treinamento, "pra incentivar", então o prêmio de novembro saiu pra mais gente da
      turma. Eu não usaria o prêmio como medida de nada, mas ele está na planilha porque o
      RH mandou junto.

      Dá pra dizer que o treinamento funcionou com o que a gente tem? Ou vou precisar pedir
      pro Ricardo escrever o critério que ele usou?

      Abraço,
      Juliana
    edges:
      - jeito_para_servico -> treinamento_garantia
      - jeito_para_servico -> taxa_garantia_tri
      - tempo_casa -> treinamento_garantia
      - tempo_casa -> taxa_garantia_tri
      - loja -> taxa_garantia_tri
      - treinamento_garantia -> taxa_garantia_tri
      - treinamento_garantia -> premio_trimestre
      - taxa_garantia_tri -> premio_trimestre
    answer:
      identifiable: false
      missing: [jeito_para_servico]
    twin: pt_eletro_treino_garantia_por_nota
    note: >-
      A turma foi escolhida pela impressão de uma pessoa sobre quem vende bem serviço, e isso
      não está na tabela. O prêmio vem depois do resultado e depende dele e do treinamento.

