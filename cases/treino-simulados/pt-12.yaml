      - loja -> taxa_garantia_tri
      - treinamento_garantia -> taxa_garantia_tri
      - treinamento_garantia -> premio_trimestre
      - taxa_garantia_tri -> premio_trimestre
    answer:
      identifiable: true
      adjust_for: [nota_avaliacao, tempo_casa]
      do_not_adjust_for:
        premio_trimestre: É pago depois do trimestre e depende tanto de quem fez o treinamento quanto da taxa de garantia que se quer medir.
      indifferent: [loja, matricula]
    twin: pt_eletro_treino_garantia_no_olho
    note: >-
      Mesma história do gêmeo, mas o critério de escolha da turma é uma nota que está na
