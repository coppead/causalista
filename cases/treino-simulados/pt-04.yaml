      Mesmo briefing do gêmeo, com um fato trocado: a pontuação que guiou a escolha se
      perdeu na troca de CRM. Plano e tempo de casa não a substituem.

  - id: pt_mestrado_auxilio_congresso
    author: ai
    status: rascunho
    language: pt
    style: e-mail para o chefe
    persona: professora de pós-graduação em administração
    theme: Pós-graduação acadêmica, auxílio para congressos
    title: Auxílio para congresso e publicação em periódico
    treatment: auxilio_congresso
    outcome: publicou_24m
    columns:
      auxilio_congresso: Aluno recebeu auxílio do programa (passagem e inscrição) para apresentar trabalho em congresso (1 = sim, 0 = não).
      publicou_24m: Teve artigo aceito em periódico até 24 meses depois do edital do auxílio (1 = sim, 0 = não).
      dedicacao_exclusiva: Bolsista com dedicação exclusiva no ingresso (1 = sim, 0 = não).
      linha_pesquisa: Linha de pesquisa do aluno (Finanças, Operações ou Estudos Organizacionais).
      destaque_boletim: Aluno foi mencionado no boletim semestral do programa em algum número posterior aos 24 meses (1 = sim, 0 = não).
    not_in_table:
      avanco_pesquisa: Em que estágio estava a pesquisa do aluno quando o edital saiu. Ficou nas conversas de orientação.
    story: >-
      Assunto: auxílio congresso x publicação, o que dá pra dizer na autoavaliação. Ricardo,
      antes de a gente escrever na autoavaliação da CAPES que o auxílio para congressos
      "aumentou a produção discente", queria te mostrar o que tenho e o que não tenho.
      Peguei as turmas de 2022 a 2024 do mestrado acadêmico, 118 alunos. Desses, 41
      receberam o auxílio para apresentar trabalho em congresso (passagem e inscrição), e eu
      marquei quem teve artigo aceito em periódico até 24 meses depois do edital. Quem
      recebeu publicou bem mais, 56% contra 22%. Só que o edital era por demanda: o aluno
      pedia, anexava o resumo aceito e a comissão aprovava. Quem pedia, você sabe melhor do
      que eu, era quem já tinha resultado na mão, com a pesquisa adiantada, e quem já tem
      resultado publica, com ou sem congresso; quem estava patinando no projeto nem tentava.
      A gente nunca registrou em que estágio estava a pesquisa de cada um na hora do
      pedido, isso ficou nas conversas de orientação. Duas coisas eu tenho na planilha e sei
      que pesam: bolsista com dedicação exclusiva pediu mais (tem tempo pra escrever) e
      publica mais; e a comissão priorizou as linhas de Finanças e Operações, porque os
      congressos do ano eram dessas áreas, e essas linhas publicam mais que Estudos
      Organizacionais de qualquer forma. Também marquei quem apareceu no boletim do
      programa, porque o boletim destaca tanto quem apresentou em congresso quanto quem
      publicou, e isso sai depois de tudo; não sei se serve pra alguma coisa. Colunas:
      recebeu auxílio, publicou em 24 meses, dedicação exclusiva, linha de pesquisa,
      destaque no boletim. Minha sensação é que o número bonito não se sustenta. Se você
      concordar, escrevo de forma mais modesta. Abraço, Helena.
    edges:
