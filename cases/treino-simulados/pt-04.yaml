      missing: [avanco_pesquisa]
    note: >-
      Edital por demanda: quem pediu era quem já tinha resultado. Dedicação exclusiva e
      linha são ajustáveis; o estágio da pesquisa não foi registrado.

  - id: pt_entregas_botao_pronto
    author: ai
    status: rascunho
    language: pt
    style: trecho de relatório trimestral
    persona: gerente de operações de um app de entregas
    theme: Logística urbana, painel do restaurante parceiro
    title: Botão "Pedido pronto" e espera do entregador no restaurante
    treatment: botao_pronto
    outcome: espera_media_q3
    columns:
      botao_pronto: Restaurante ativou o botão "Pedido pronto" no painel do parceiro, que só chama o entregador quando o pedido sai da cozinha (1 = sim, 0 = não). Pensado para reduzir a espera e entregar a comida mais quente.
      espera_media_q3: Tempo médio, em minutos, que o entregador esperou no restaurante entre a chegada e a retirada, nos pedidos do 3º trimestre.
      pedidos_dia_q2: Média de pedidos por dia do restaurante no 2º trimestre.
      tipo_cozinha: Categoria principal do restaurante no app (pizza, japonesa, lanches, brasileira, outras).
      shopping: Restaurante fica em praça de alimentação de shopping (1 = sim, 0 = não).
      nota_parceiro: Nota média, de 1 a 5, dada pelos clientes ao restaurante nos pedidos de outubro, o primeiro mês após o trimestre. Comida quente e entrega rápida puxam a nota para cima.
      id_parceiro: Identificador do restaurante na plataforma.
    story: >-
      Operações, parceiros, 3º trimestre. O botão "Pedido pronto" no painel do parceiro,
      lançado na primeira semana de julho, foi ativado em 1.870 restaurantes ainda naquele
      mês. A ativação foi conduzida pelo time de contas, começando pelos parceiros de maior
      volume e pelas pizzarias, os dois perfis em que o entregador mais espera. O tempo médio de espera do
      entregador no restaurante, no trimestre, foi de 6,1 min nos parceiros com o botão e
      9,4 min nos demais. Restaurantes em praça de alimentação de shopping seguem com espera
      acima da média pela logística de acesso, e isso independe do botão. A base por
      parceiro (id, tipo de cozinha, pedidos/dia no 2º tri, shopping, botão, espera média no
      3º tri e nota do parceiro) está à disposição da área de dados para estimar o efeito do
      botão separado do perfil dos parceiros ativados.
    edges:
      - pedidos_dia_q2 -> botao_pronto
      - pedidos_dia_q2 -> espera_media_q3
      - tipo_cozinha -> botao_pronto
      - tipo_cozinha -> espera_media_q3
      - shopping -> espera_media_q3
      - botao_pronto -> espera_media_q3
      - botao_pronto -> nota_parceiro
      - espera_media_q3 -> nota_parceiro
    answer:
      identifiable: true
      adjust_for: [pedidos_dia_q2, tipo_cozinha]
      do_not_adjust_for:
        nota_parceiro: >-
          É de outubro, depois do trimestre medido, e sobe tanto com o botão (comida mais
          quente) quanto com a espera curta. Ajustar por ela cria uma associação falsa
          entre o botão e a espera.
      indifferent: [id_parceiro, shopping]
    note: >-
      O texto só diz "nota do parceiro"; que ela é de outubro e depende da espera está só
      no dicionário de colunas.
