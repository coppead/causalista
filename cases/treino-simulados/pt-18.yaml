      ficaram praticamente fora do programa, pois já receberam medidores novos em 2024
      pelo contrato de macromedição. Entre abril e julho a Ouvidoria registrou 1.106
      reclamações de conta alta, concentradas em ligações trocadas, o que é esperado
      quando o medidor passa a registrar o consumo real; ligações de consumo elevado, de
