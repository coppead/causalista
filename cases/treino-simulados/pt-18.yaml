    edges:
      - idade_hidrometro -> hidrometro_trocado
      - idade_hidrometro -> consumo_medido_t2
      - idade_hidrometro -> visor_embacado
      - consumo_medido_t4_ant -> hidrometro_trocado
      - consumo_medido_t4_ant -> consumo_medido_t2
      - categoria -> hidrometro_trocado
      - categoria -> consumo_medido_t2
      - visor_embacado -> consumo_medido_t2
      - hidrometro_trocado -> consumo_medido_t2
      - hidrometro_trocado -> reclamacao_conta_alta
      - consumo_medido_t2 -> reclamacao_conta_alta
    answer:
      identifiable: true
      adjust_for: [categoria, consumo_medido_t4_ant, idade_hidrometro]
      do_not_adjust_for:
        reclamacao_conta_alta: >-
          Registrada depois do resultado e causada tanto pela troca quanto pelo volume
          medido. Ajustar por ela cria uma associação falsa entre a troca e o consumo.
      indifferent: [rota_leitura]
    twin: pt_agua_hidrometro_coletor
    note: >-
      Gêmeo do caso anterior: a marcação do leiturista continua fora da base e continua
      afetando o volume medido, mas desta vez não orientou a troca. Basta ajustar pelo
