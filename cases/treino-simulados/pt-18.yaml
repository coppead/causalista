# Casos de TREINO que simulam texto de pessoa, em português do Brasil.
#
# Escritos pelo assistente em 2026-10-07, a pedido do André, no papel de cinco pessoas: uma
# analista de uma empresa de água e esgoto, um produtor rural de laranja, um gerente de
# loja de uma rede de eletrodomésticos, uma coordenadora pedagógica de uma rede municipal
# e uma gerente de cobrança de uma operadora de cartões. Cada texto tem o estilo do canal
# em que a pessoa escreveria (WhatsApp, relatório trimestral, e-mail com anexo, áudio
# transcrito, briefing para consultoria).
#
# Estes casos servem ao treino por reforço: o modelo responde, o verificador dá a nota.
# Não são o teste da seção 7 e não reaproveitam nenhum cenário do conjunto congelado em
# cases/simulados/. Não são texto de pessoas de verdade. As setas declaram o diagrama
# que o texto implica; o verificador confere a resposta a partir delas
# (scripts/check_cases.py).

cases:

  - id: pt_agua_hidrometro_coletor
    author: ai
    status: rascunho
    language: pt
    style: trecho de relatório trimestral
    persona: analista de uma empresa de água e esgoto
    theme: Saneamento, substituição de hidrômetros
    title: Troca de hidrômetros e volume medido (marcação do leiturista orientou a troca)
    treatment: hidrometro_trocado
    outcome: consumo_medido_t2
    columns:
      hidrometro_trocado: Hidrômetro da ligação substituído pelo programa de troca no 1º trimestre de 2026 (1 = sim, 0 = não).
      consumo_medido_t2: Volume medido na ligação no 2º trimestre de 2026, em m³ (soma das leituras de abril, maio e junho).
      idade_hidrometro: Idade do hidrômetro instalado em 1º de janeiro de 2026, em anos, conforme o cadastro patrimonial.
      consumo_medido_t4_ant: Volume medido no 4º trimestre de 2025, em m³.
      categoria: Categoria da ligação (residencial, comercial, pública, industrial).
      reclamacao_conta_alta: Reclamação de "conta alta" registrada na Ouvidoria entre abril e julho de 2026 (1 = sim, 0 = não).
      rota_leitura: Código da rota de leitura.
    not_in_table:
      visor_embacado: >-
        Marcação feita pelo leiturista no coletor portátil de que o visor do hidrômetro
        estava embaçado ou o medidor parado. Fica no coletor e não é carregada no sistema
        comercial.
    story: >-
      3.4 Substituição de hidrômetros e volume medido. No 1º trimestre de 2026 o programa
      de substituição trocou 4.812 hidrômetros na regional Norte, 11% do parque, ao custo
      de R$ 1,38 milhão. O objetivo é reduzir a submedição: medidor velho registra menos
      água do que a que passa por ele, e o que não é medido vira perda aparente e receita
      não faturada. A lista de troca foi montada pela Gerência Comercial a partir do
      cadastro patrimonial (idade do medidor, trocando os mais antigos primeiro) e do
      histórico de leitura: ligações com consumo zerado ou muito baixo no 4º trimestre de
      2025 foram tratadas como suspeitas e entraram na frente. Em campo, as equipes
      trocaram ainda os medidores que o leiturista havia marcado no coletor como "visor
      embaçado" ou "parado", mesmo fora da lista; um medidor parado registra zero e um
      embaçado costuma estar perto disso, e a marcação é tanto mais comum quanto mais
      velho o medidor. Essa marcação fica no coletor portátil e não é carregada no sistema
      comercial, portanto não consta na base deste relatório. Grandes consumidores
      comerciais e industriais ficaram praticamente fora do programa, pois já receberam
      medidores novos em 2024 pelo contrato de macromedição. Entre abril e julho a
      Ouvidoria registrou 1.106 reclamações de conta alta, concentradas em ligações
      trocadas, o que é esperado quando o medidor passa a registrar o consumo real;
      ligações de consumo elevado, de resto, reclamam mais em qualquer trimestre. Para o
      relatório anual, pede-se à Gerência de Dados que estime quanto do volume medido no
      2º trimestre se deve à troca, comparando ligações trocadas e não trocadas. A base
      extraída (Anexo II) tem uma linha por ligação, com as colunas hidrometro_trocado,
      consumo_medido_t2, idade_hidrometro, consumo_medido_t4_ant, categoria,
      reclamacao_conta_alta e rota_leitura. Observa-se que o consumo de uma ligação é
      bastante estável de um trimestre para o outro.
    edges:
      - idade_hidrometro -> hidrometro_trocado
      - idade_hidrometro -> consumo_medido_t2
      - idade_hidrometro -> consumo_medido_t4_ant
      - idade_hidrometro -> visor_embacado
      - consumo_medido_t4_ant -> hidrometro_trocado
      - consumo_medido_t4_ant -> consumo_medido_t2
      - categoria -> hidrometro_trocado
      - categoria -> consumo_medido_t2
      - categoria -> consumo_medido_t4_ant
      - visor_embacado -> hidrometro_trocado
      - visor_embacado -> consumo_medido_t2
      - visor_embacado -> consumo_medido_t4_ant
      - hidrometro_trocado -> consumo_medido_t2
      - hidrometro_trocado -> reclamacao_conta_alta
      - consumo_medido_t2 -> reclamacao_conta_alta
    answer:
      identifiable: false
      missing: [visor_embacado]
    twin: pt_agua_hidrometro_lista
    note: >-
      A marcação de visor embaçado orientou parte das trocas e um medidor assim registra
      menos; ela fica no coletor, fora da base. Idade, consumo anterior e categoria estão
      na tabela, mas não bastam.

  - id: pt_agua_hidrometro_lista
    author: ai
    status: rascunho
    language: pt
    style: trecho de relatório trimestral
    persona: analista de uma empresa de água e esgoto
    theme: Saneamento, substituição de hidrômetros
    title: Troca de hidrômetros e volume medido (lista fechada do escritório)
    treatment: hidrometro_trocado
    outcome: consumo_medido_t2
    columns:
      hidrometro_trocado: Hidrômetro da ligação substituído pelo programa de troca no 1º trimestre de 2026 (1 = sim, 0 = não).
