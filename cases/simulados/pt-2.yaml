      - meses_sem_emprego -> selecionado_curso
      - avaliacao_equipe -> selecionado_curso
      - avaliacao_equipe -> emprego_formal_12m
      - selecionado_curso -> cadastro_sine
      - cadastro_sine -> emprego_formal_12m
      - selecionado_curso -> emprego_formal_12m
      - selecionado_curso -> atualizou_cadunico
      - emprego_formal_12m -> atualizou_cadunico
    answer:
