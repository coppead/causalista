# CONGELADO em 2026-10-06: escrito por uma instância do assistente e revisado por outra, no
# papel de pessoas, por delegação do André. Aprovado por delegação. A partir daqui o
# arquivo não muda; a soma de verificação está em cases/simulados/README.md.
# Casos simulados, arquivo pt-2: oito casos em português do Brasil.
#
# Escritos pelo assistente em 2026-10-06, no papel de pessoas que escrevem como se escreve
# no trabalho: um áudio pro analista, um e-mail com planilha anexa, um trecho de
# relatório, uma pergunta em fórum, uma nota pro chefe. O projeto não conseguiu casos
# escritos por pessoas a tempo; estes simulam esse teste. Cinco personas: o diretor de
# operações de uma transportadora, a gerente de uma ONG de educação, um técnico de uma
# secretaria municipal, uma analista de RH de um hospital e o gerente de uma loja de
# materiais de construção.
#
# São casos de TESTE. Ficam congelados antes de qualquer modelo respondê-los e nunca
# entram em treino. O formato é o de cases/fase0.yaml; as setas declaram o diagrama que
# o texto implica, e o verificador confere a resposta (scripts/check_cases.py).

cases:

  - id: pt_qualifica_sorteio
    author: ai
    status: aprovado
    language: pt
    style: trecho de relatório interno
    persona: técnico da Secretaria Municipal de Assistência Social, responsável pelo acompanhamento do programa de qualificação; formação em serviço social, sem estatística
    theme: Política pública (qualificação profissional)
    title: Curso de qualificação e emprego formal, com vagas sorteadas
    twin: pt_qualifica_indicacao
    treatment: selecionado_curso
    outcome: emprego_formal_12m
    columns:
      selecionado_curso: Inscrito selecionado para uma das vagas do curso de qualificação Qualifica Já, 1º semestre de 2025 (1 = sim, 0 = não).
      emprego_formal_12m: Teve ao menos um vínculo formal de trabalho registrado no eSocial entre julho de 2025 e junho de 2026 (1 = sim, 0 = não).
      idade: Idade em anos na data da inscrição.
      escolaridade: Anos de estudo completos, conforme o CadÚnico na data da inscrição.
      meses_sem_emprego: Meses desde o último vínculo formal, na data da inscrição.
      cadastro_sine: Possui cadastro ativo de trabalhador no SINE municipal em julho de 2025 (1 = sim, 0 = não).
      atualizou_cadunico: Realizou atualização cadastral no CadÚnico entre julho de 2025 e agosto de 2026 (1 = sim, 0 = não).
      nis: Número de Identificação Social do inscrito.
    story: >-
      3. Resultados preliminares de inserção

      O programa Qualifica Já ofertou, no primeiro semestre de 2025, 180 vagas em cursos de
      qualificação profissional (auxiliar administrativo, eletricista predial e cuidador de
      idosos), com carga horária de 160 horas, em parceria com o Senac. Foram recebidas 412
      inscrições de pessoas cadastradas no CadÚnico, por meio dos CRAS. Como o número de
      inscritos superou o de vagas, a seleção se deu por sorteio público, realizado em
      14/02/2025 no auditório da Secretaria, conforme previsto no edital 01/2025; as listas
      de sorteados e de não sorteados foram publicadas no Diário Oficial do Município. A
      quase totalidade dos selecionados concluiu o curso.

      Ao final de cada turma, os instrutores acompanharam os concluintes até a agência do
      SINE para a realização do cadastro de trabalhador, de modo que praticamente todos os
      participantes contam hoje com cadastro ativo. É sabido que o cadastro no SINE amplia
      o acesso a vagas, uma vez que a agência faz o encaminhamento direto aos empregadores
      conveniados.

      O acompanhamento utilizou a base do CadÚnico cruzada com os registros de vínculo do
      eSocial. Cabe registrar que os participantes foram orientados, na última aula, a
      procurar o CRAS para atualização cadastral e inclusão do certificado no prontuário;
      a atualização também é obrigatória para quem passa a ter renda formal, o que explica
      o volume elevado de atualizações no período. Observa-se, como em edições anteriores,
      que a inserção é mais difícil entre os inscritos mais velhos, com menor escolaridade
      e afastados há mais tempo do mercado formal. Esta coordenação solicita à área de
      monitoramento a estimativa do efeito do curso sobre a inserção formal, a fim de
      subsidiar a decisão sobre a edição de 2027.
    edges:
      - idade -> emprego_formal_12m
      - escolaridade -> emprego_formal_12m
      - meses_sem_emprego -> emprego_formal_12m
      - selecionado_curso -> cadastro_sine
      - cadastro_sine -> emprego_formal_12m
      - selecionado_curso -> emprego_formal_12m
      - selecionado_curso -> atualizou_cadunico
      - emprego_formal_12m -> atualizou_cadunico
    answer:
      identifiable: true
      adjust_for: []
      do_not_adjust_for:
        cadastro_sine: Foi feito depois do curso e por causa dele, quando os instrutores levaram as turmas ao SINE. É parte do caminho pelo qual o curso age sobre a inserção.
        atualizou_cadunico: Registrada depois e causada tanto pelo curso (orientação na última aula) quanto pelo emprego formal (atualização obrigatória). Ajustar por ela cria uma associação falsa entre o curso e a inserção.
      indifferent: [idade, escolaridade, meses_sem_emprego, nis]
    note: >-
      Com sorteio, a comparação simples entre selecionados e não selecionados já dá o
      efeito. A armadilha são as duas colunas de depois, o cadastro no SINE e a
      atualização cadastral, apresentadas como rotina administrativa.

