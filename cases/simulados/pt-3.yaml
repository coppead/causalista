    story: >-
      Oi Renata, boa noite, desculpa a hora

      então, sobre a planilha da sacola literária q te mandei. vou te explicar como foi
      pq acho q muda a análise

      ano passado a gente montou 40 sacolas (6 livros cada, troca todo mês) pras três
      turmas do 2º ano, q têm 87 alunos no total. a ideia era priorizar quem tava mais
      atrasado na leitura pelo teste de março, e em parte foi isso. mas na prática a
      sacola foi pra casa de quem a mãe ou o pai apareceu na reunião de abril ou veio
