      - meses_contrato -> cancelou_90d
      - plano -> cancelou_90d
      - ligacao_retencao -> desconto_aplicado
      - desconto_aplicado -> cancelou_90d
      - ligacao_retencao -> cancelou_90d
      - ligacao_retencao -> contato_sac_90d
      - cancelou_90d -> contato_sac_90d
    answer:
      identifiable: false
      missing: [irritacao_percebida]
    note: >-
      Mesma história do caso irmão, com um fato trocado: a escolha final de quem recebia
      a ligação foi pelo ouvido das supervisoras, e essa impressão não está em coluna
      nenhuma. Reclamações e tempo de contrato continuam na tabela, mas não bastam.

  - id: pt_reforco_letra_viva
    author: ai
    status: aprovado
    language: pt
    style: trecho de dissertação de mestrado
    persona: professora da rede municipal que coordena um projeto de reforço escolar e escreve sobre ele a dissertação de mestrado profissional em educação
    theme: Educação (reforço escolar)
    title: Reforço de língua portuguesa e nota de novembro
    treatment: participou_reforco
    outcome: nota_port_nov
    columns:
      matricula: Número de matrícula do estudante na rede municipal.
      participou_reforco: Frequentou as oficinas de reforço de língua portuguesa no contraturno, de março a outubro de 2025 (1 = sim, 0 = não).
      nota_port_nov: Nota na avaliação de língua portuguesa da rede aplicada em novembro de 2025, de 0 a 100.
      nota_diag_fev: Nota na avaliação diagnóstica de língua portuguesa aplicada pela rede em fevereiro de 2025, de 0 a 100.
      escola: Escola em que o estudante estava matriculado em 2025 (A, B ou C).
      bolsa_familia: Família beneficiária do Programa Bolsa Família, conforme o cadastro de matrícula (1 = sim, 0 = não).
      frequencia_2025: Percentual de presença nas aulas regulares de março a outubro de 2025.
    story: >-
      3.2 O desenho do projeto e a base de dados

      O projeto Letra Viva foi implementado em 2025 em três escolas da rede municipal,
      atendendo estudantes do 6º ano em oficinas de leitura e escrita no contraturno,
      duas vezes por semana, de março a outubro. A indicação dos estudantes seguiu a
      avaliação diagnóstica aplicada pela rede em fevereiro: em cada escola, foram
      chamados os estudantes de menor nota, em ordem, até o preenchimento das vagas. As
      médias do diagnóstico, registre-se, variaram sensivelmente entre as três escolas,
      o que já se observava em edições anteriores da avaliação (SMED, 2024).

      O número de vagas, contudo, não foi uniforme: por limitação de espaço físico, a
      escola A abriu duas turmas de oficina, a B uma e a C apenas meia turma,
      compartilhada com outro projeto, de modo que a proporção de estudantes do 6º ano
      atendidos variou de 41% na escola A a 18% na escola C. Trata-se de escolas com
      perfis bastante distintos, e os resultados de novembro, assim como os de
      fevereiro, refletem essas diferenças.

      Um resultado intermediário merece destaque. Os estudantes atendidos passaram a
      frequentar com mais assiduidade as aulas regulares, movimento que as educadoras do
      projeto atribuem ao vínculo construído nas oficinas; a frequência escolar, por sua
      vez, é um dos preditores mais consistentes do desempenho (ver seção 2.3). Cabe
      registrar também o que já se sabia da rede: estudantes de famílias beneficiárias
      do Bolsa Família apresentam frequência menor e desempenho menor nas avaliações,
      padrão que se repetiu em 2025.

      A base de dados, cedida pela Secretaria Municipal de Educação em formato
      anonimizado, contém, para cada um dos 412 estudantes do 6º ano das três escolas: o
      número de matrícula, a escola, a nota do diagnóstico de fevereiro, a condição de
      beneficiário do Bolsa Família conforme o cadastro de matrícula, a participação no
      projeto, o percentual de frequência nas aulas regulares de março a outubro e a
      nota da avaliação da rede em novembro. A média de novembro dos participantes foi
      de 58,3 pontos, contra 63,1 dos não participantes; a diferença, como se discute a
      seguir, não pode ser lida como efeito do projeto sem que se leve em conta o modo
      como os estudantes foram indicados. No capítulo 4, estima-se o efeito da
      participação no Letra Viva sobre a nota de novembro.
    edges:
      - nota_diag_fev -> participou_reforco
      - nota_diag_fev -> nota_port_nov
      - escola -> participou_reforco
      - escola -> nota_port_nov
      - escola -> nota_diag_fev
      - bolsa_familia -> nota_port_nov
      - bolsa_familia -> nota_diag_fev
      - bolsa_familia -> frequencia_2025
      - participou_reforco -> frequencia_2025
      - frequencia_2025 -> nota_port_nov
      - participou_reforco -> nota_port_nov
    answer:
      identifiable: true
      adjust_for: [escola, nota_diag_fev]
      do_not_adjust_for:
        frequencia_2025: Medida durante o projeto e é consequência dele. É um dos caminhos pelos quais o reforço age sobre a nota; ajustar por ela apaga parte do efeito.
      indifferent: [bolsa_familia, matricula]
    note: >-
      A indicação dependeu do diagnóstico de fevereiro e das vagas de cada escola, e as
      duas coisas estão na tabela. A armadilha é a frequência nas aulas regulares, que o
      texto apresenta com orgulho e que é consequência do reforço.

