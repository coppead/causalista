      na cabeça da professora

      a 203 recebeu bem mais sacolas q as outras duas pq a professora de lá abraçou o
      projeto, e a turma dela em geral rende mais mesmo, ela é muito boa

      o teste de novembro deu em média 62 palavras por minuto em quem recebeu e 51 em
      quem não recebeu. a diretora quer levar pra secretaria como resultado do projeto

      na planilha tem: matrícula, turma, fluência de março, fluência de novembro, faltas
      no ano e se recebeu a sacola. faltar muito atrapalha a leitura, claro. ah, e tem
      uma coluna de quem a coordenação chamou pra conversar em dezembro: ela chamou
      todas as famílias da sacola, pra devolver os livros e dar um retorno, e as
      famílias das crianças q ficaram abaixo de 50 palavras no teste de novembro. não
      sei se isso serve pra alguma coisa

      dá pra afirmar q foi a sacola? ou a gente vai estar enganando a secretaria sem
      querer?
