      evadiu: >-
        Cancelou, abandonou ou não renovou a matrícula até o fim de 2025.2 (1 = sim,
        0 = não).
      renda_per_capita: Renda familiar per capita declarada na inscrição do edital, em salários mínimos.
      distancia_km: Distância do CEP de residência ao campus, em km.
      semestre_ingresso: Semestre de ingresso no curso (2024.2 ou 2025.1).
      atendimento_coordenacao: Teve atendimento registrado na coordenação do curso em 2025.2 (1 = sim, 0 = não).
    not_in_table:
      parecer_assistente: >-
        Parecer da assistente social depois da entrevista, com a ordem de prioridade. Fica
        na pasta física do SAE.
    story: >-
      Assunto: RE: evasão e auxílio permanência. Prezada Profa. Cláudia, segue o
      levantamento que a senhora pediu na reunião de departamento. Peguei no SIGAA os 412
      alunos do curso que ingressaram em 2024.2 e 2025.1 e marquei: quem recebeu o auxílio
      permanência a partir de 2025.1, quem evadiu até o fim de 2025.2 (cancelamento,
      abandono ou matrícula não renovada), a renda familiar per capita declarada na
      inscrição do edital, a distância do CEP de residência ao campus, o semestre de
      ingresso e se o aluno teve atendimento registrado na coordenação em 2025.2. Lembro
      que o edital exige renda per capita de até 1,5 salário mínimo e que, dentro desse
      grupo, a assistente social entrevista todos e define a ordem pelo que avalia na
      conversa (se a moradia é precária, se o aluno sustenta a família, e assim por
      diante), justamente o que mais faz o aluno largar o curso. Esse parecer fica na pasta
      física do SAE; para o sistema vai só o deferido ou indeferido. Pelos números brutos,
      quem recebe o auxílio evade menos (11% contra 24%), mas é claro que renda menor evade
      mais e recebe mais auxílio, então essa comparação não vale. Quem mora longe evade
      mais, como sempre comentamos. Marquei também o semestre de ingresso, porque calouro
      evade mais. Sobre o atendimento na coordenação: os bolsistas
      vêm assinar o termo de compromisso todo semestre, e quem está de saída, cancelando ou
      simplesmente desistindo, costuma passar por mim antes para assinar o requerimento ou
      só para avisar, então esse registro mistura as duas coisas. Com esses dados, dá para
      afirmar que o auxílio reduz a evasão? Por quais colunas eu deveria ajustar?
      Atenciosamente, Prof. Marcos Vinícius
    edges:
      - renda_per_capita -> recebeu_auxilio
      - renda_per_capita -> evadiu
      - parecer_assistente -> recebeu_auxilio
      - parecer_assistente -> evadiu
      - distancia_km -> evadiu
      - semestre_ingresso -> evadiu
      - recebeu_auxilio -> atendimento_coordenacao
      - evadiu -> atendimento_coordenacao
      - recebeu_auxilio -> evadiu
    answer:
      identifiable: false
      missing: [parecer_assistente]
    note: >-
      A renda está na tabela, mas a ordem de prioridade dada pela assistente social ficou
      na pasta física, e ela mede exatamente o que faz o aluno evadir. O atendimento na
      coordenação junta bolsistas e desistentes.

  - id: pt_farmacia_entrega_expressa
    author: ai
    status: aprovado
    language: pt
    style: mensagem de Slack para o time de dados
    persona: gerente de marketing de uma rede de farmácias, sem formação em estatística
    theme: Logística, entrega expressa de farmácia
    title: Entrega expressa e recompra em 30 dias
    treatment: entrega_expressa
    outcome: recomprou_30d
    columns:
      entrega_expressa: >-
        Pedido entregue pela entrega expressa, com motoboy próprio da loja (1 = sim, 0 = pela
        entrega padrão, terceirizada).
      recomprou_30d: Cliente fez novo pedido no app nos 30 dias seguintes à entrega (1 = sim, 0 = não).
      item_uso_continuo: Pedido contém medicamento de uso contínuo (1 = sim, 0 = não).
      tempo_entrega_min: Minutos entre a confirmação do pedido e a entrega.
      loja: Código da loja que atendeu o pedido.
      id_pedido: Identificador do pedido no sistema.
    story: >-
      @time-dados bom dia! Preciso de uma ajuda pra fechar o business case do expresso
      antes da reunião de orçamento, dia 20. Contexto pra quem não acompanhou: desde
      fevereiro temos a entrega expressa (motoboy próprio, promessa de 1h) em 23 lojas. A
      loja só entra no expresso se o gerente topar ter motoboy fixo na porta e, sendo bem
      sincera, quem topou foram os gerentes mais ligados no digital, que são também os que
      mantêm o app da loja bonitinho (estoque atualizado, foto, resposta rápida no chat), e
      loja com app bem cuidado tem recompra maior, isso a gente já viu. Dentro de uma loja
      com expresso, nem todo pedido vai de expresso: o sistema prioriza pedido com remédio
      de uso contínuo (o cliente não pode ficar sem) e, quando sobra motoboy, vai o resto.
      O tempo médio caiu de 2h10 pra 38 min nos pedidos expressos, e entrega rápida traz o
      cliente de volta, esse é o nosso argumento. Óbvio que cliente de uso contínuo
      recompra mais, isso não é mérito nosso. Quero saber se o expresso aumenta a recompra
      em 30 dias. Na base de pedidos de fev a ago tem: se foi expresso, se o cliente fez
      outro pedido em 30 dias, se tinha item de uso contínuo, o tempo de entrega em
      minutos, a loja que atendeu e o id do pedido. Dá pra fechar isso com o que a gente
      tem, e por quais colunas eu ajusto? Posso usar a queda no tempo de entrega como
      argumento?
    edges:
      - loja -> entrega_expressa
      - loja -> recomprou_30d
      - item_uso_continuo -> entrega_expressa
      - item_uso_continuo -> recomprou_30d
      - entrega_expressa -> tempo_entrega_min
      - tempo_entrega_min -> recomprou_30d
      - entrega_expressa -> recomprou_30d
    answer:
      identifiable: true
      adjust_for: [item_uso_continuo, loja]
      do_not_adjust_for:
        tempo_entrega_min: >-
          O expresso existe para entregar mais rápido, e a entrega rápida traz o cliente de
          volta. O tempo é parte do efeito que se quer medir.
      indifferent: [id_pedido]
    note: >-
      O que o gerente é não está na tabela, mas é uma característica da loja, e a loja
      está. O tempo de entrega é o argumento de venda e não deve ser ajustado.
